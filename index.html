 if(event==="play")return {state:{phase:"start",at:now,section},sample:null};
 if(event==="waiting"||event==="stalled")return {state:state?.phase==="playing"?{phase:"buffer",at:now,section}:state,sample:null};
 if(event==="playing"){
 const sample=state&&["start","buffer"].includes(state.phase)&&state.section===section?{key:(section==="reels"?"reel":"video")+(state.phase==="start"?"Start":"Buffer"),ms:now-state.at}:null;

function projectCatalog(filter="all"){
 return GYSTE_PROJECTS.filter(p=>filter==="all"||(filter==="beta"&&p.status==="beta")||(filter==="planned"&&p.status==="planned")||(filter==="app"&&p.category==="app"));

function projectShareUrl(id,origin=location.origin){
 if(!GYSTE_PROJECTS.some(p=>p.id===id))return null;
 return origin+"/proyectos.html#"+encodeURIComponent(id);
}
async function shareProject(id,button,status){
 const p=GYSTE_PROJECTS.find(x=>x.id===id),url=projectShareUrl(id);if(!p||!url||button.disabled)return;
 button.disabled=true;
 try{
  if(typeof navigator.share==="function"){try{await navigator.share({title:p.title+" · Gyste / JORSTEKA",text:"Conoce este proyecto y su disponibilidad.",url});if(status.isConnected)status.textContent="Enlace compartido.";return;}catch(e){if(e?.name==="AbortError")return;}}
  if(navigator.clipboard?.writeText){try{await navigator.clipboard.writeText(url);if(status.isConnected)status.textContent="Enlace copiado. Puedes pegarlo en WhatsApp u otra aplicación.";return;}catch{}}
  if(status.isConnected){const input=document.createElement("input");input.className="field";input.readOnly=true;input.value=url;input.setAttribute("aria-label","Enlace del proyecto");status.replaceChildren(document.createTextNode("Copia este enlace:"),input);input.focus();input.select();}
 }finally{button.disabled=false;}
}

let feedbackEpoch=0;
const feedbackSendLocks=new Set();
function validateFeedback(category,body){return Object.hasOwn(FEEDBACK_LABELS,category)&&typeof body==="string"&&body.trim().length>=10&&body.trim().length<=2000;}
const feedbackBugTemplate="Sección de Gyste:\nQué intenté hacer:\nQué ocurrió:\nTiempo aproximado de espera:\n¿Se repite el problema?:";
async function feedbackView(){
 const uid=me?.id,epoch=++feedbackEpoch;if(!uid)return;
 const valid=()=>tab==="feedback"&&me?.id===uid&&feedbackEpoch===epoch;
 shell('<section class="panel"><h2>Sugerencias y ayuda</h2><p role="status">Cargando…</p></section>');
 const [mine,role]=await Promise.all([db.from("gyste_feedback").select("id,category,body,status,created_at").eq("user_id",uid).order("created_at",{ascending:false}).limit(30),db.from("gyste_moderators").select("user_id").eq("user_id",uid).maybeSingle()]);
 if(!valid())return;
 const row=(x,admin=false)=>`<article class="post"><b>${esc(FEEDBACK_LABELS[x.category]||x.category)}</b><p class="muted">${esc(FEEDBACK_STATES[x.status]||x.status)} · ${time(x.created_at)}</p><p class="bodytext">${esc(x.body)}</p>${admin?`<label>Estado<select class="field" data-feedback-id="${esc(x.id)}">${Object.entries(FEEDBACK_STATES).map(([k,v])=>`<option value="${k}" ${k===x.status?"selected":""}>${v}</option>`).join("")}</select></label>`:""}</article>`;
 shell(`<section class="panel"><h2>💡 Construyamos Gyste juntos</h2><p>Envía tus ideas, errores y propuestas. Tu mensaje no se publica. Podrás consultarlo tú y el equipo autorizado, que puede utilizar IA para analizar propuestas. No incluyas contraseñas, datos personales, datos de menores ni información confidencial. Para denunciar publicaciones utiliza Denunciar.</p><form id="feedback-form"><label>Tipo<select class="field" id="feedback-category">${Object.entries(FEEDBACK_LABELS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></label><button type="button" class="secondary full" id="feedback-bug-template">Usar guía para informar de un error</button><label>Tu sugerencia<textarea class="field" id="feedback-body" minlength="10" maxlength="2000" required></textarea></label><p class="muted" id="feedback-length" aria-live="polite"></p><button type="submit" class="primary full">Enviar sugerencia privada</button><p id="feedback-result" role="status"></p></form></section><section class="panel"><h3>Mis sugerencias</h3>${mine.error?"No se pudieron cargar.":(mine.data||[]).map(x=>row(x)).join("")||"Todavía no hay sugerencias."}</section>${role.data?'<section class="panel"><h3>Revisión autorizada</h3><button class="secondary" id="feedback-review">Consultar propuestas</button><div id="feedback-admin"></div></section>':""}`);
 const form=document.getElementById("feedback-form");if(commercialInterest){const request=commercialInterest;commercialInterest=null;if(request.uid===uid){document.getElementById("feedback-category").value="other";document.getElementById("feedback-body").value=request.text;document.getElementById("feedback-result").textContent="Revisa el texto y envíalo solo si deseas manifestar interés. No se realizará ningún cobro.";}}const bodyInput=document.getElementById("feedback-body"),categoryInput=document.getElementById("feedback-category"),template=document.getElementById("feedback-bug-template"),out=document.getElementById("feedback-result"),submit=form.querySelector('[type="submit"]');
 const count=()=>{document.getElementById("feedback-length").textContent=bodyInput.value.length+" / 2000 caracteres";};
 bodyInput.oninput=count;count();
 template.onclick=()=>{if(!valid()||feedbackSendLocks.has(uid))return;if(bodyInput.value.trim()&&!confirm("¿Sustituir el texto por la guía de errores?"))return;categoryInput.value="error";bodyInput.value=feedbackBugTemplate;count();bodyInput.focus();};
 form.onsubmit=async e=>{
 e.preventDefault();if(!valid()||feedbackSendLocks.has(uid)||submit.disabled)return;
 const body=bodyInput.value.trim(),category=categoryInput.value;
 if(!validateFeedback(category,body)||body===feedbackBugTemplate){out.textContent="Completa la descripción del problema o escribe una sugerencia de entre 10 y 2000 caracteres.";return;}
 feedbackSendLocks.add(uid);const controls=[submit,bodyInput,categoryInput,template];controls.forEach(c=>c.disabled=true);out.textContent="Enviando…";let sent=false;
 try{const {error}=await db.from("gyste_feedback").insert({user_id:uid,category,body});if(error)throw error;sent=true;if(valid()){bodyInput.value="";count();out.textContent="Sugerencia recibida. Gracias.";say("Sugerencia recibida. Gracias.");await feedbackView();}}
 catch{if(valid())out.textContent=sent?"Sugerencia recibida. Actualiza la sección.":"No se pudo confirmar el envío. Conservamos el texto en esta pantalla; revisa Mis sugerencias antes de reintentar.";}
 finally{feedbackSendLocks.delete(uid);controls.forEach(c=>c.disabled=false);}
 };
 const review=document.getElementById("feedback-review");if(review)review.onclick=async()=>{review.disabled=true;const {data,error}=await db.from("gyste_feedback").select("id,category,body,status,created_at").order("created_at",{ascending:false}).limit(100);const box=document.getElementById("feedback-admin");if(!box||tab!=="feedback"||me?.id!==uid)return;review.disabled=false;box.innerHTML=error?"No se pudieron consultar.":(data||[]).map(x=>row(x,true)).join("")||"No hay propuestas.";box.querySelectorAll("[data-feedback-id]").forEach(s=>s.onchange=async()=>{s.disabled=true;const {error}=await db.from("gyste_feedback").update({status:s.value}).eq("id",s.dataset.feedbackId).select("id").single();s.disabled=false;if(error){say("No se pudo actualizar.",true);review.click();}else say("Estado actualizado.");});};
}

function recoveryView(){
app.innerHTML=`
<section class="auth">
<h1>Crear contraseña nueva</h1>
<p class="muted">Escribe tu nueva contraseña dos veces para confirmar el cambio.</p>
<div id="notice" class="notice ${noticeError?"error":""}">${esc(notice)}</div>
<input id="newpassword" class="field" type="password" minlength="6" autocomplete="new-password" placeholder="Nueva contraseña">
<input id="confirmnewpassword" class="field" type="password" minlength="6" autocomplete="new-password" placeholder="Repite la nueva contraseña">
<button class="primary full" id="savepassword">Guardar contraseña</button>

let authBusy=false;
function beginAuthAction(button,label){
 if(authBusy||!button||button.disabled)return null;
 authBusy=true;const ids=["login","signup","forgot","email","password","signup-accept"],nodes=ids.map(id=>document.getElementById(id)).filter(Boolean),states=nodes.map(n=>n.disabled),oldLabel=button.textContent;
 nodes.forEach(n=>n.disabled=true);button.textContent=label;
 return ()=>{authBusy=false;nodes.forEach((n,i)=>n.disabled=states[i]);button.textContent=oldLabel;};
}
async function sendPasswordReset(){
const email=document.getElementById("email").value.trim().toLowerCase();
if(!validEmail(email))return say("Escribe primero el correo de tu cuenta.",true);
const button=document.getElementById("forgot"),finish=beginAuthAction(button,"Enviando…");if(!finish)return;
try{
const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname});
if(error)throw error;
say("Si existe una cuenta asociada a ese correo, recibirás un enlace de recuperación. Revisa también spam y ábrelo en este navegador.");
}catch(e){say("No se pudo enviar el correo de recuperación. Comprueba la configuración de URL de Supabase e inténtalo de nuevo.",true);}
finally{finish();}
}

async function saveNewPassword(){
const password=document.getElementById("newpassword").value;
const confirmation=document.getElementById("confirmnewpassword").value;
if(password.length<6)return say("La contraseña debe tener al menos 6 caracteres.",true);
if(password!==confirmation)return say("Las contraseñas no coinciden. Escríbelas de nuevo.",true);
const button=document.getElementById("savepassword");
button.disabled=true;button.textContent="Guardando…";
try{
const {data,error}=await db.auth.updateUser({password});
if(error)throw error;
session=(await db.auth.getSession()).data.session;
if(data?.user){
  window.history.replaceState({},document.title,window.location.pathname+window.location.search);
  notice="Contraseña actualizada correctamente. Ya puedes usarla para entrar en Gyste.";
  noticeError=false;
  await db.auth.signOut();
  session=null;me=null;chatUser=null;
  authView();
  say(notice,false);
}
}catch(e){say("No se pudo actualizar la contraseña. Vuelve a abrir el enlace de recuperación más reciente.",true);button.disabled=false;button.textContent="Guardar contraseña";}
}

function authMessage(error, mode){
  const raw=String(error?.message||"").toLowerCase();
  const code=String(error?.code||"").toLowerCase();
  if(raw.includes("invalid login credentials")||raw.includes("invalid_credentials")||code==="invalid_credentials")
    return "El correo o la contraseña no son correctos. Comprueba los datos e inténtalo de nuevo.";
  if(raw.includes("email not confirmed")||code==="email_not_confirmed")
    return "Tu correo todavía no está confirmado. Revisa tu bandeja de entrada y la carpeta de spam.";
  if(raw.includes("user already registered")||raw.includes("already registered")||raw.includes("user already exists")||code==="user_already_exists")
    return "Si ya tienes cuenta, pulsa Entrar o recupera la contraseña. Revisa también si recibiste un enlace de confirmación.";
  if(raw.includes("password should be at least")||raw.includes("password is too short"))
    return "La contraseña debe tener al menos 6 caracteres.";
  if(raw.includes("rate limit")||raw.includes("too many requests")||code.includes("rate_limit"))
    return "Has realizado demasiados intentos. Espera un poco y vuelve a intentarlo.";
  if(raw.includes("network")||raw.includes("fetch")||raw.includes("timeout"))
    return "No se pudo conectar. Comprueba Internet y vuelve a intentarlo.";
  return mode==="login" ? "No se pudo iniciar sesión. Comprueba tus datos e inténtalo de nuevo." : "No se pudo crear la cuenta. Revisa los datos e inténtalo de nuevo.";
}

function validEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

async function login(){
  const email=document.getElementById("email").value.trim().toLowerCase();
  const password=document.getElementById("password").value;
  const button=document.getElementById("login");
  if(!validEmail(email))return say("Escribe un correo electrónico válido.",true);
  if(!password)return say("Escribe tu contraseña.",true);
  const finish=beginAuthAction(button,"Entrando…");if(!finish)return;
  try{
    const {data,error}=await db.auth.signInWithPassword({email,password});
    if(error)throw error;
    if(!data.session)throw new Error("No se pudo establecer la sesión. Inténtalo de nuevo.");
    session=data.session;
    await boot();
  }catch(error){
    say(authMessage(error,"login"),true);
  }finally{
    finish();
  }
}

async function signup(){
  const email=document.getElementById("email").value.trim().toLowerCase();
  const password=document.getElementById("password").value;
  const button=document.getElementById("signup");
  if(!validEmail(email))return say("Escribe un correo electrónico válido.",true);
  if(password.length<8)return say("Para crear una cuenta, elige una contraseña de al menos 8 caracteres.",true);
  if(!document.getElementById("signup-accept")?.checked)return say("Lee las normas de convivencia y la información de privacidad antes de registrarte.",true);
  const finish=beginAuthAction(button,"Creando cuenta…");if(!finish)return;
  try{
    const {data,error}=await db.auth.signUp({email,password});
    if(error)throw error;
    // Supabase puede devolver identidades vacías cuando el correo ya existe,
    // para evitar revelar información de cuentas a terceros.
    if(data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0){
      say("Si puedes acceder con ese correo, pulsa Entrar. Si necesitas recuperar la contraseña, utiliza la opción correspondiente. Si recibes un enlace de confirmación, ábrelo.");
      return;
    }
    if(data.session){
      session=data.session;
      await boot();
    }else{
      say("Solicitud de registro recibida. Si Supabase requiere confirmar el correo, revisa tu bandeja de entrada y spam.");
    }
  }catch(error){
    say(authMessage(error,"signup"),true);
  }finally{
    finish();
  }
}

async function logout(){
const {error}=await db.auth.signOut();
if(error)return say("No se pudo cerrar sesión: "+error.message,true);
session=null;me=null;chatUser=null;tab="feed";sharedPostId=null;selectedSpaceId=null;homeFilter="all";authView();
}

async function boot(){
const {data:{user},error}=await db.auth.getUser();
if(error||!user){session=null;me=null;return authView();}
if(session?.user?.id!==user.id)return;
me={id:user.id,email:user.email};
const active=()=>session?.user?.id===user.id&&me?.id===user.id;
// Optional editorial bookmarks must not delay or block authentication and the initial feed.
const editorialSync=syncEditorial(user.id).catch(()=>false);
const [profileResult,followingResult,spacesResult]=await Promise.all([
 db.from("gyste_profiles").select("*").eq("user_id",user.id).maybeSingle(),
 readFollowing(user.id),
 readSpaces()
]);
if(!active())return;
let {data:p,error:profileError}=profileResult;
if(profileError)return authViewWithError("No se pudo cargar tu perfil: "+profileError.message);
if(!p){
const name="Miembro de Gyste "+user.id.slice(0,6);
const username="gyste_"+user.id.replace(/-/g,"").slice(0,16);
const {data:created,error:createError}=await db.from("gyste_profiles").upsert({user_id:user.id,display_name:name,username}).select().single();
if(!active())return;
if(createError)return authViewWithError("No se pudo crear tu perfil: "+createError.message);
p=created;
}
me={...me,...p};
applyWallpaper(readWallpaper(me.id));
applyFollowingResult(followingResult);
applySpacesResult(spacesResult);
const requestedPost=new URLSearchParams(location.search).get("post");
if(requestedPost&&/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(requestedPost)){sharedPostId=requestedPost;tab="feed";selectedSpaceId=null;homeFilter="all";}
await renderTab();
void editorialSync.then(ok=>{if(ok&&active())refreshEditorialButtons();}).catch(()=>{});
}

function authViewWithError(message){notice=message;noticeError=true;authView();}

function readFollowing(uid){
return db.from("gyste_follows").select("followed_id").eq("follower_id",uid);
}
function applyFollowingResult({data,error}){
if(!error)following=new Set((data||[]).map(x=>x.followed_id));
else following=new Set();
}

lores: blanco de brillo, piel iluminada, semitono, sombra del pliegue y pupila. Evita contornos uniformes.", "Dibuja pestañas en grupos de diferente longitud y dirección; suaviza las transiciones con grafito, no con el dedo.", "Compara con la foto a distancia de un brazo; corrige tamaño del iris, inclinación y volumen del párpado."]}, {"group": "Dibujo académico", "title": "Nariz y labios: planos, textura y expresiones", "level": "Intermedio · 2 sesiones", "steps": ["Observa un rostro real frontal y otro de tres cuartos. Encaja el volumen nasal como puente, punta y alas sin marcar líneas definitivas.", "Dibuja la sombra proyectada bajo la punta; distingue el plano lateral iluminado de la aleta y el interior de las fosas nasales.", "Para labios, mide ancho y altura respecto a la nariz. Construye primero la abertura entre los labios y luego sus volúmenes.", "Sombrea el labio superior y la sombra bajo el inferior según la luz. Reserva reflejos y evita contornear todo con negro.", "Repite la misma boca en gesto neutro y sonrisa; observa cómo se elevan comisuras y mejillas.", "Compara tus resultados con el modelo: semejanza, bordes, simetría natural y gradación de valores."]}, {"group": "Pintura profesional", "title": "Óleo: retrato por capas y control de valores", "level": "Avanzado · 4 sesiones", "steps": ["Ventila el espacio y revisa las indicaciones de pigmentos y disolventes; usa productos al agua cuando sea posible. Prepara soporte imprimado y referencia propia.", "Haz una grisalla monocroma: identifica cinco valores antes de introducir color; deja secar según el material.", "Construye mezclas de temperatura cálida/fría sin asumir un color de piel único. Compara cada mezcla con la referencia a la misma luz.", "Pinta grandes masas de frente, mejillas, mandíbula y cuello; corrige proporciones antes de los detalles.", "Añade capas finas siguiendo compatibilidad del fabricante y tiempo de secado; evita empastar zonas que necesitan bordes suaves.", "Finaliza con reflejos selectivos y una evaluación de semejanza, armonía cromática y contraste."]}, {"group": "Pintura profesional", "title": "Acuarela: arquitectura urbana y perspectiva", "level": "Intermedio · 3 sesiones", "steps": ["Elige una fotografía autorizada de una calle; dibuja horizonte y puntos de fuga antes de humedecer el papel.", "Prepara tres lavados de valor con el mismo pigmento para estudiar transparencia y control de agua.", "Pinta cielo y fachadas grandes con húmedo sobre húmedo, reservando luces del papel.", "Cuando seque, añade puertas, sombras proyectadas y detalles con pincel fino sobre seco.", "Corrige profundidad mediante contraste y temperatura: más contraste en primer plano, menos al fondo.", "Crea una segunda versión con otra hora del día y compara sombras y atmósfera."]}, {"group": "Escultura profesional", "title": "Busto anatómico en arcilla: del armazón al retrato", "level": "Avanzado · 6 sesiones", "steps": ["Prepara fotografías autorizadas frontal, perfil y tres cuartos; toma medidas relativas de altura craneal, mandíbula y cuello.", "Elige arcilla y soporte según su proceso de secado/cocción; si lleva armazón, comprueba compatibilidad con el horno y retíralo cuando sea necesario.", "Bloquea cráneo, cuello y hombros con masas grandes; gira la pieza cada pocos minutos para comprobar la silueta desde cuatro vistas.", "Sitúa plano frontal, temporales, pómulos y mandíbula; no modeles ojos ni labios antes de fijar el volumen de la cabeza.", "Construye cavidades orbitarias y volumen nasal; agrega párpados como láminas con grosor, no ojos dibujados sobre la superficie.", "Modela boca y orejas observando profundidad y asimetrías. Trabaja el cabello en masas; usa herramientas para bordes y transiciones.", "Vacía la pieza si la arcilla y el tamaño lo requieren, deja espesor uniforme y orificios de ventilación siguiendo la técnica de cocción.", "Documenta la obra desde frente, perfil y tres cuartos; evalúa semejanza, estabilidad, grietas y acabado."]}, {"group": const STORY_BUCKET="gyste-story-media";
let storyExpiryTimer=null;

async function storiesView(){
 stopStoryTimer();
 const uid=me.id;
 const {data,error}=await db.from("gyste_stories").select("id,user_id,content,audience,media_path,media_type,created_at,expires_at").order("created_at",{ascending:false}).limit(80);
 if(tab!=="stories"||me?.id!==uid)return;
 if(error){shell(`<section class="panel"><h2>Historias</h2><p class="error">${esc(error.message)}</p></section>`);return;}
 const items=data||[],ids=[...new Set(items.map(s=>s.user_id))],names={},urls={};
 if(ids.length){const {data:p}=await db.from("gyste_profiles").select("user_id,display_name,avatar_url").in("user_id",ids);(p||[]).forEach(x=>names[x.user_id]=x);}
 const paths=items.map(x=>x.media_path).filter(Boolean);
 if(paths.length){const {data:m}=await db.storage.from(STORY_BUCKET).createSignedUrls(paths,60);(m||[]).forEach(x=>{if(x.path&&x.signedUrl)urls[x.path]=x.signedUrl;});}
 if(tab!=="stories"||me?.id!==uid)return;
 shell(`<section class="panel"><h2>⏳ Historias de 24 horas</h2><p>Comparte un momento con texto, foto o vídeo. Tu historia deja de aparecer tras 24 horas.</p><form id="story-form"><textarea id="story-text" class="field" maxlength="1000" placeholder="¿Qué estás haciendo hoy?"></textarea><label>Quién puede verla<select id="story-audience" class="field"><option value="mutual" selected>Seguimiento mutuo</option><option value="members">Miembros de Gyste</option><option value="only_me">Solo yo</option></select></label><label>Foto o vídeo (máximo 50 MB)<input type="file" id="story-file" class="field" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm"></label><button class="primary full" id="story-publish">Publicar historia</button><p id="story-status" role="status"></p></form></section>${items.map(s=>`<article class="post" data-story="${esc(s.id)}" data-expires="${esc(s.expires_at)}"><div class="posthead"><b>${esc(names[s.user_id]?.display_name||"Miembro")}</b><small>Caduca en ${Math.max(0,Math.ceil((new Date(s.expires_at)-Date.now())/3600000))} h</small></div><div class="bodytext">${esc(s.content)}</div>${s.media_path?urls[s.media_path]?`<div class="media-frame">${s.media_type?.startsWith("video/")?`<video class="media" controls playsinline preload="metadata" src="${esc(safeMediaUrl(urls[s.media_path]))}"></video>`:`<img class="media" alt="Historia" src="${esc(safeMediaUrl(urls[s.media_path]))}" loading="lazy">`}<button class="media-expand" type="button">⛶ Ampliar</button></div>`:'<p class="muted">Archivo temporalmente no disponible.</p>':""}${s.user_id===uid?`<button class="secondary" data-delete-story="${esc(s.id)}">Eliminar historia</button>`:""}</article>`).join("")||'<p class="panel muted">Todavía no hay historias. Publica la primera.</p>'}<button class="secondary full" id="refresh-stories">Actualizar historias</button>`);
 bindMediaActions();
 document.getElementById("refresh-stories").onclick=storiesView;
 storyExpiryTimer=setInterval(()=>{if(tab!=="stories"||!document.getElementById("story-form")){stopStoryTimer();return;}app.querySelectorAll("[data-expires]").forEach(n=>{if(Date.parse(n.dataset.expires)<=Date.now())n.remove();});},10000);
 app.querySelectorAll("[data-delete-story]").forEach(b=>b.onclick=async()=>{if(!confirm("¿Eliminar esta historia?"))return;const s=items.find(x=>x.id===b.dataset.deleteStory);if(!s)return;b.disabled=true;const {error}=await db.from("gyste_stories").delete().eq("id",s.id).eq("user_id",uid);if(error){say("No se pudo eliminar.",true);b.disabled=false;return;}if(s.media_path)await db.storage.from(STORY_BUCKET).remove([s.media_path]);say("Historia eliminada.");await storiesView();});
 document.getElementById("story-form").onsubmit=async e=>{
 e.preventDefault();const b=document.getElementById("story-publish"),status=document.getElementById("story-status"),content=document.getElementById("story-text").value.trim(),audience=document.getElementById("story-audience").value,file=document.getElementById("story-file").files[0];
 if(b.disabled||(!file&&!content))return;if(file&&(!MEDIA_TYPES.includes(file.type)||file.size>MAX_POST_BYTES)){status.textContent="Formato incompatible o archivo superior a 50 MB.";return;}
 b.disabled=true;let path=null,committed=false;try{const id=crypto.randomUUID();
 if(file){const ext=({"image/jpeg":"jpg","image/png":"png","image/webp":"webp","video/mp4":"mp4","video/webm":"webm"})[file.type];path=uid+"/"+id+"."+ext;status.textContent="Subiendo archivo…";const {error}=await db.storage.from(STORY_BUCKET).upload(path,file,{contentType:file.type,upsert:false});if(error)throw error;}
 const {error}=await db.from("gyste_stories").insert({id,user_id:uid,content,audience,media_path:path,media_type:file?.type||null});if(error)throw error;committed=true;say("Historia publicada durante 24 horas.");if(tab==="stories")await storiesView();
 }catch(e){if(path&&!committed)await db.storage.from(STORY_BUCKET).remove([path]);status.textContent="No se pudo publicar la historia.";}finally{b.disabled=false;}
 };
}

async function syncEditorial(uid){

function parseCaribbeanBulletins(xml){
 if(typeof xml!=="string"||xml.length>512000||/<!DOCTYPE|<!ENTITY/i.test(xml))throw Error("invalid XML");
 const doc=new DOMParser().parseFromString(xml,"application/xml");
 if(doc.querySelector("parsererror")||doc.documentElement.localName!=="rss")throw Error("invalid RSS");
 const seen=new Set(),items=[];
 for(const item of doc.querySelectorAll("channel > item")){
  const read=name=>item.querySelector(name)?.textContent?.trim()||"";
  const title=read("title").replace(/\s+/g," ").slice(0,300),link=read("link");
  if(!link)continue;let url;try{url=new URL(link,CARIBBEAN_SOURCE);}catch{continue;}
  if(url.protocol==="http:"&&url.hostname==="www.nhc.noaa.gov")url.protocol="https:";
  if(!title||url.protocol!=="https:"||!["www.nhc.noaa.gov","nhc.noaa.gov"].includes(url.hostname)||url.username||url.password||url.port)continue;
  const date=Date.parse(read("pubDate"));const key=url.href+"|"+title;if(seen.has(key))continue;seen.add(key);
  items.push({title,url:url.href,date:Number.isFinite(date)?date:null});
 }
 return items.sort((a,b)=>(b.date??0)-(a.date??0)).slice(0,5);
}

l-from-script">Usar texto del guion</button><section class="panel"><h3>🔊 Escuchar el texto</h3><p class="muted">Lectura de prueba con voces locales del dispositivo. No se añade al archivo de vídeo. Para incluir narración en el Reel, utiliza la opción Grabar mi voz.</p><label>Voz disponible<select class="field" id="reel-read-voice" disabled><option>Buscando voces…</option></select></label><label>Velocidad<select class="field" id="reel-read-rate"><option value="0.85">Pausada</option><option value="1" selected>Normal</option><option value="1.15">Dinámica</option></select></label><button type="button" class="secondary full" id="reel-read-play" disabled>▶ Escuchar texto</button><button type="button" class="secondary full" id="reel-read-stop" disabled>■ Detener lectura</button><p id="reel-read-status" role="status" aria-live="polite"></p></section><div class="row"><button type="button" class="secondary" id="reel-save-draft">Guardar texto</button><button type="button" class="secondary" id="reel-restore-draft">Recuperar texto</button><button type="button" class="secondary" id="reel-delete-draft">Borrar copia</button></div><p class="muted">La copia es opcional y permanece en este navegador; no guarda fotografías ni vídeos.</p><label>Fondo<select class="field" id="reel-theme"><option value="ocean">Azul y turquesa</option><option value="sunset">Violeta y dorado</option><option value="forest">Verde</option></select></label><label>Música de fondo<select class="field" id="reel-music"><option value="none">Sin música</option><option value="calm">Melodía suave</option><option value="bright">Melodía dinámica</option></select></label><p class="muted">Melodías sencillas sintetizadas por Gyste en tu dispositivo. Sin descargar canciones.</p><label><input id="reel-voice" type="checkbox"> Grabar mi voz durante la creación</label><p class="muted">Opcional. El micrófono se activa solo al crear el vídeo con esta opción marcada. Habla cuando comience el contador. Tu voz se incluirá en el vídeo }

/article><article class="archive-card"><h3>1906 · Patines con motor</h3><p>Scientific American documentó patines motorizados en abril de 1906.</p><a href="https://www.scientificamerican.com/article/motor-roller-skates/" target="_blank" rel="noopener noreferrer">Consultar fuente original · Scientific American</a></article><article class="archive-card"><h3>1918 · Patinete Autoped</h3><p>El Smithsonian conserva este vehículo motorizado fabricado en Nueva York.</p><a href="https://www.si.edu/object/nmah_746073" target="_blank" rel="noopener noreferrer">Consultar fuente original · Smithsonian</a></article><article class="archive-card"><h3>1925 · Automóvil radiocontrolado</h3><p>TIME documentó un coche conducido a distancia desde otro vehículo; no era autónomo en el sentido actual.</p><a href="https://time.com/archive/6653944/science-radio-auto/" target="_blank" rel="noopener noreferrer">Consultar fuente original · TIME, 10 de agosto de 1925</a></article><h3>Canales externos de curiosidades históricas</h3><p>Estos canales presentan historias e interpretaciones sobre inventos olvidados. Son independientes de Gyste; sus afirmaciones no han sido verificadas individualmente.</p><p><a href="https://www.youtube.com/channel/UCZDGFY74Zb16TEivl5xIjpA" target="_blank" rel="noopener noreferrer">Tecnología Olvidada</a> · <a href="https://www.youtube.com/channel/UCq6mA2UolG8cGSPDczflbkQ" target="_blank" rel="noopener noreferrer">Olvidada</a></p><p class="muted">Investiga por qué se abandonó cada invento: costes, competencia, decisiones empresariales y limitaciones técnicas. Distingue los documentos de las hipótesis; no todas las explicaciones tienen el mismo respaldo.</p></section><section class="panel"><h2>La Edad de Hielo: una investigación real</h2><p>Durante el Pleistoceno se sucedieron fases glaciares e interglaciares. En el último máximo glacial, hace aproximadamente 26.500–19.000 años, grandes mantos de hielo cubrieron zonas del norte de Europa y América. El mar estaba a un nivel inferior y hubo estepas frías habitadas por mamuts, bisontes y otros animales. No todo el planeta estaba congelado.</p><p><b>Cómo se sabe:</b> los científicos analizan testigos de hielo, sedimentos, polen fósil, huesos y cambios en la distribución de especies. Una imagen de esa época solo puede ser una reconstrucción científica o artística, nunca una fotografía.</p><p><b>Actividad:</b> compara un mapa del último máximo glacial con un mapa actual; identifica tres diferencias y explica qué evidencia permite deducirlas.</p></section>`);

}

const masterclasses=[{"area":"Dibujo realista","title":"Retrato a grafito: cabeza de tres cuartos","duration":"8 sesiones de 60–90 minutos","materials":"Papel de 180 g/m², lápices H, HB, 2B, 4B y 6B, goma moldeable, difumino, espejo y fotografía propia con luz lateral","steps":[["Preparación del modelo","Coloca una única luz a 45° y evita la luz frontal. Fotografía el rostro a la altura de los ojos, con giro de unos 30°. Trabaja a partir de esa referencia fija."],["Encuaje y silueta","Dibuja un rectángulo que delimite el cráneo completo, sin cabello decorativo. Marca altura total y ancho máximo. Comprueba la inclinación del eje central y la línea de los ojos antes de dibujar rasgos."],["Medición comparativa","Con el lápiz a brazo extendido, compara anchura de nariz con distancia entre ojos; compara mentón–nariz con nariz–cejas. Transfiere relaciones, no medidas absolutas. Verifica asimetrías del giro."],["Construcción de volúmenes","Representa frente, pómulos, mandíbula, cuenca ocular y puente nasal como planos grandes. Distingue el plano frontal del lateral de la cabeza. No traces contornos oscuros alrededor de ojos o labios."],["Mapa de cinco valores","Reserva el blanco del papel para la máxima luz. Separa luz, semitono, sombra propia, sombra proyectada y acentos. Entorna los ojos para juzgar masas, no detalles."],["Modelado anatómico","Construye los párpados envolviendo el globo ocular; la nariz por puente, alas y plano inferior; la boca por volumen del orbicular y sombra bajo labio inferior. Trabaja del valor medio al oscuro."],["Textura y bordes","Utiliza bordes duros en sombras proyectadas y blandos en transiciones de mejilla y frente. Añade cabello por grupos de mechones; evita dibujar cada pelo. Levanta luces con goma moldeable."],["Control y entrega","Invierte horizontalmente la foto del dibujo y la referencia. Corrige proporciones antes de oscurecer. Entrega retrato, esquema de planos, escala tonal y tres fotos de proceso."]],"errors":["Ojos demasiado altos: vuelve a medir cráneo y línea ocular, no corrijas solo los ojos.","Nariz plana: distingue plano inferior y sombra de contacto con el rostro.","Piel manchada: trabaja capas uniformes y limpia el difumino.","Parecido insuficiente: comprueba distancias y ángulos antes de añadir pestañas."],"assessment":"20 puntos: semejanza y proporción (6), volúmenes (6), control tonal (4), proceso documentado (4)."},{"area":"Escultura","title":"Busto anatómico en arcilla: del armazón al acabado","duration":"10 sesiones de 90 minutos","materials":"Arcilla de modelado compatible con el proceso elegido, base estable, varillas o soporte apropiado, estecas, calibre, esponja y fotografías propias frontal/lateral/¾","steps":[["Estudio de referencia","Obtén vistas frontal, perfil y tres cuartos a la misma altura. Marca anchura de cráneo, distancia mentón–coronilla y profundidad de caja craneal. Dibuja siluetas antes de tocar la arcilla."],["Soporte seguro","Prepara una base que no vuelque. Si utilizas arcilla cerámica destinada a cocción, planifica desde el principio el vaciado y el secado; no introduzcas soportes incompatibles en el horno."],["Bloqueo de masas","Levanta primero caja craneal, cuello y cintura escapular. Comprueba perfil y frente a cada adición. Mantén simetría estructural antes de introducir expresiones faciales."],["Planos del cráneo","Localiza arco superciliar, pómulos, mandíbula y mentón. Usa el calibre para comprobar anchuras. Observa que el cráneo continúa detrás de la oreja; evita una cabeza aplanada."],["Órbitas y nariz","Excava suavemente la cuenca antes de añadir párpados. Construye nariz desde puente, cartílagos y base, no como una pieza triangular pegada. Controla proyección en perfil."],["Boca y orejas","Modela el cilindro dental bajo los labios; sitúa comisuras en relación con el eje de la cara. Construye orejas por masas: hélix, antihélix, concha y lóbulo, evitando surcos decorativos excesivos."],["Superficie y carácter","Establece primero planos grandes y transición de luces. Después introduce arrugas o textura únicamente donde expliquen anatomía o expresión. Examina la escultura con una luz lateral."],["Preparación final","Para pieza cerámica: ahueca según grosor y recomendaciones de la arcilla, permite secado uniforme y cuece solo con equipamiento y supervisión adecuados. Para arcilla no cocible: sigue su ficha técnica."],["Evaluación tridimensional","Fotografía 8 ángulos, incluido perfil estricto. Corrige cabeza demasiado pequeña, cuello cilíndrico y mandíbula sin articulación. Entrega vistas, medidas y registro de cambios."]],"errors":["Cráneo sin profundidad: revisa la vista de perfil antes de trabajar ojos.","Ojos saltones: construye primero la órbita y luego los párpados.","Cuello como tubo: incorpora esternocleidomastoideo y trapecio como grandes masas.","Grietas en cerámica: evita secados desiguales y respeta el proceso de vaciado."],"assessment":"20 puntos: proporciones (5), lectura anatómica en 360° (7), acabado (4), documentación y seguridad (4)."},{"area":"Marroquinería","title":"Cartera bifold de cuero: patrón, rebajado y costura a mano","duration":"6 sesiones de 90 minutos","materials":"Cuero curtido apropiado (1,0–1,5 mm para bolsillos), cartulina de patrón, cuchilla afilada, regla metálica, tabla de corte, compás, sacabocados/tenedor de costura, hilo encerado, dos agujas de guarnicionero, cola apta para cuero y bruñidor","steps":[["Diseño funcional","Define tamaño cerrado aproximado 11 × 9 cm y capacidad de billetes/tarjetas. Dibuja el patrón a escala real; reserva holguras para pliegue, grosor de capas y costuras. Crea primero una maqueta de papel."],["Prueba de capacidad","Introduce tarjetas y billetes en la maqueta. Verifica que el pliegue central no fuerza los bolsillos. Ajusta patrón antes de cortar cuero."],["Selección y dirección","Examina marcas, flexibilidad y grosor. Orienta piezas considerando dirección de estiramiento. Identifica exterior, forro y bolsillos; marca reversos discretamente."],["Corte y rebajado","Corta con pasadas controladas, regla y base estable, siempre alejando la cuchilla del cuerpo. Rebaja los bordes de solape y pliegue para reducir volumen sin debilitar la costura."],["Encolado y alineación","Presenta en seco. Aplica adhesivo según ficha del fabricante, ventila el espacio y une solo tras confirmar escuadra. Prensa sin deformar bolsillos."],["Marcado de puntadas","Traza línea de costura paralela al borde (por ejemplo 3–4 mm, ajustada al diseño). Marca paso uniforme con herramienta adecuada. Evita perforar a ciegas capas desplazadas."],["Puntada de guarnicionero","Con dos agujas e hilo encerado, cruza cada puntada con tensión constante. Practica en retales antes de coser la pieza. Remata sin nudos voluminosos en zonas de roce."],["Cantos y acabado","Iguala cantos, lija progresivamente, aplica producto compatible y bruñe. Redondea esquinas y comprueba que no quedan fibras levantadas ni restos de adhesivo."],["Control de calidad","Introduce tarjetas reales y abre/cierra 30 veces. Comprueba costuras, deslizamiento, pliegue, simetría y espesor. Fotografía patrón, maqueta, costura y producto final."]],"errors":["Bolsillos muy apretados: aumenta holgura en el patrón, no estires a la fuerza.","Borde grueso: rebaja antes de encolar y cose sobre muestra.","Costura ondulada: guía la línea y controla tensión puntada a puntada.","Pliegue abultado: revisa superposición de capas cerca del centro."],"assessment":"20 puntos: patrón y capacidad (6), corte/rebajado (4), costura (6), acabado (4)."},{"area":"Pintura","title":"Bodegón al óleo: composición, color y capas","duration":"7 sesiones de 90 minutos","materials":"Lienzo imprimado, pinturas al óleo, pinceles planos y redondos, paleta, trapos, recipiente con tapa y disolventes solo si son adecuados y con ventilación; alternativa: óleo soluble en agua","steps":[["Composición","Dispón tres objetos con materiales distintos y una luz lateral estable. Realiza cinco miniaturas en dos valores para elegir una composición con jerarquía visual."],["Dibujo y proporción","Encaja grandes formas, elipses y ejes. Comprueba verticales y horizontales; evita perfilar cada objeto con negro."],["Estudio tonal","Reduce la escena a tres valores. Reserva el mayor contraste para el centro de interés y controla el valor del fondo."],["Mezclas de color","Construye una carta de mezclas para luces, semitonos y sombras. Compara temperatura y valor antes de saturación; no aclares automáticamente todo con blanco."],["Primera mancha","Aplica capas delgadas para bloquear grandes masas. Mantén las sombras simples y transparentes cuando corresponda al material y al método."],["Volumen y materia","Diferencia metal, cerámica y fruta mediante bordes, reflejos y transición de valores. Trabaja primero masas grandes, después acentos."],["Revisión y conservación","Comprueba la obra en espejo, corrige elipses y relaciones de color. Respeta tiempos de secado, manejo de residuos y recomendaciones de materiales."]],"errors":["Objetos flotantes: corrige sombras de contacto.","Colores apagados: revisa mezclas excesivas y contraste de temperatura.","Todos los bordes iguales: jerarquiza bordes según foco."],"assessment":"20 puntos: composición (5), dibujo (5), color (6), proceso (4)."}];

function bindAcademyVideos(){
 const filter=document.getElementById("academy-video-filter"),grid=document.getElementById("academy-video-grid"),search=document.getElementById("academy-video-search");
 const normalize=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
 const draw=()=>{const matches=academyVideos.filter(v=>(!filter.value||v.area===filter.value)&&normalize(v.area+" "+v.title+" "+v.author).includes(normalize(search.value.trim())));document.getElementById("academy-video-count").textContent=matches.length+" vídeos";grid.innerHTML=matches.map(v=>`<article class="academy-video"><span class="muted">${esc(v.area)} · ${esc(v.level)}</span><h3>${esc(v.title)}</h3><p class="muted">${esc(v.author)}</p><div><button class="video-launch" type="button" data-lesson-video="${esc(v.id)}">▶ Reproducir vídeo</button></div><a href="https://www.youtube.com/watch?v=${esc(v.id)}" target="_blank" rel="noopener noreferrer">Ver vídeo original en YouTube</a></article>`).join("");
 grid.querySelectorAll("[data-lesson-video]").forEach(b=>bindPlayerButton(b));};
 let active=null;
 function restorePlayer(){
  if(!active)return;
  const {host,id}=active;active=null;
  const b=document.createElement("button");b.className="video-launch";b.type="button";b.dataset.lessonVideo=id;b.textContent="▶ Reproducir vídeo";
  host.replaceChildren(b);bindPlayerButton(b);
 }
 function bindPlayerButton(b){
  b.onclick=()=>{
   const v=academyVideos.find(x=>x.id===b.dataset.lessonVideo);if(!v)return;
   restorePlayer();
   document.querySelectorAll("video,audio").forEach(m=>{if(!m.paused)m.pause();});
   const host=b.parentElement,f=document.createElement("iframe"),close=document.createElement("button");
   f.title=v.title;f.src="https://www.youtube-nocookie.com/embed/"+v.id;f.allow="encrypted-media; fullscreen; picture-in-picture";f.allowFullscreen=true;f.referrerPolicy="strict-origin-when-cross-origin";
   close.type="button";close.className="secondary";close.textContent="■ Cerrar vídeo";close.onclick=()=>restorePlayer();
   host.replaceChildren(f,close);active={host,id:v.id};
  };
 }
 filter.onchange=search.oninput=()=>{restorePlayer();draw();};draw();
}

const PRIVATE_BUCKET="gyste-private-media";
const bucketFor=p=>p.audience&&p.audience!=="public"?PRIVATE_BUCKET:BUCKET;
async function prepareMediaUrls(list){
 const uid=me?.id;
 await Promise.all([BUCKET,PRIVATE_BUCKET].map(async bucket=>{
 if(bucket===BUCKET&&!MEDIA_BUCKET_PRIVATE)return;
 const paths=[...new Set(list.filter(p=>bucketFor(p)===bucket).flatMap(p=>postMediaItems(p).map(m=>m.path)).filter(Boolean))];
 if(!paths.length)return;
 const ttl=bucket===PRIVATE_BUCKET?300:MEDIA_SIGNED_URL_TTL;
 const {data,error}=await db.storage.from(bucket).createSignedUrls(paths,ttl);
 if(me?.id!==uid)return;
 if(error){console.warn("No se pudieron generar enlaces firmados",error.message);return;}
 (data||[]).forEach(item=>{if(item.path&&item.signedUrl)mediaUrlCache.set(bucket+":"+item.path,{url:item.signedUrl,expiresAt:Date.now()+ttl*1000});});
 }));
}
function safeMediaUrl(value){
 try{const u=new URL(value,location.href);return u.protocol==="https:"?u.href:"";}catch{return "";}
}

const MEDIA_TYPES=["image/jpeg","image/png","image/webp","video/mp4","video/webm"];
const MEDIA_MANIFEST="gyste-gallery-v1:";
const MAX_POST_FILES=10;
const MAX_POST_BYTES=50*1024*1024;
function postMediaItems(p){
 if(typeof p.media_url==="string"&&p.media_url.startsWith(MEDIA_MANIFEST)){
  try{
   const items=JSON.parse(p.media_url.slice(MEDIA_MANIFEST.length));
   if(Array.isArray(items)&&items.length>=2&&items.length<=MAX_POST_FILES&&items[0]?.path===p.media_path&&items.every(m=>m&&typeof m.path==="string"&&m.path.startsWith(p.user_id+"/")&&/^[0-9a-z-]+\.(jpg|png|webp|mp4|webm)$/i.test(m.path.slice(p.user_id.length+1))&&MEDIA_TYPES.includes(m.type)))return items.map(m=>({path:m.path,type:m.type,url:null}));
  }catch(e){console.warn("Galería no válida",e);}
 }
 return p.media_path||p.media_url?[{path:p.media_path,type:p.media_type,url:typeof p.media_url==="string"&&!p.media_url.startsWith(MEDIA_MANIFEST)?p.media_url:null}]:[];
}
function mediaItemUrl(m,p){
 const bucket=bucketFor(p);
 if(m.path){
  const cached=mediaUrlCache.get(bucket+":"+m.path);
  if(cached&&cached.expiresAt>Date.now()+60000)return safeMediaUrl(cached.url);
  if(bucket===BUCKET&&!MEDIA_BUCKET_PRIVATE)return safeMediaUrl(db.storage.from(BUCKET).getPublicUrl(m.path).data.publicUrl);
 }
 return bucket===PRIVATE_BUCKET||MEDIA_BUCKET_PRIVATE?"":(m.url?safeMediaUrl(m.url):"");
}
function postMediaHTML(p){
 const items=postMediaItems(p);if(!items.length)return "";
 return `<div class="media-gallery ${items.length>1?"multi":""}">${items.map((m,i)=>{
  const url=mediaItemUrl(m,p);if(!url)return '<p class="muted">Archivo no disponible temporalmente.</p>';
  const video=m.type?.startsWith("video/");
  const element=video?`<video class="media" controls playsinline preload="none" src="${esc(url)}"></video><p class="muted" style="margin:4px 8px;font-size:12px">Pulsa ▶ para cargar y reproducir.</p>`:`<img class="media" loading="lazy" decoding="async" src="${esc(url)}" alt="Foto ${i+1} de ${items.length}">`;
  return `<div class="media-frame ${video?"video-frame":""}">${element}<button type="button" class="media-expand">⛶ ${video?"Pantalla completa":"Ampliar foto"}</button></div>`;
 }).join("")}</div>`;
}
function bindMediaActions(){
 app.querySelectorAll(".media-expand").forEach(b=>{
  const frame=b.closest(".media-frame"),original=b.textContent;
   const image=frame.querySelector("img");if(image){b.onclick=()=>openPhotoViewer(image);image.style.cursor="zoom-in";image.onclick=b.onclick;return;}
  const refresh=()=>{b.textContent=(document.fullscreenElement===frame||frame.classList.contains("media-overlay"))?"✕ Salir de pantalla completa":original;};
  frame.addEventListener("fullscreenchange",refresh);
  b.onclick=async()=>{
   if(document.fullscreenElement===frame){await document.exitFullscreen();return;}
   if(frame.classList.contains("media-overlay")){frame.classList.remove("media-overlay");refresh();return;}
   if(frame.requestFullscreen){try{await frame.requestFullscreen();refresh();return;}catch{}}
   frame.classList.add("media-overlay");refresh();
  };
 });
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")app.querySelectorAll(".media-overlay .media-expand").forEach(b=>b.click());});

const POST_COLUMNS="id,content,user_id,likes,created_at,media_url,media_type,media_path,repost_of,audience";
const FEED_PAGE_SIZE=12;
async function readPosts(queryMode,page=0){
let q=db.from("posts").select(POST_COLUMNS+(spacesReady?",space_id":""));
if(sharedPostId)q=q.eq("id",sharedPostId);
 else if(queryMode==="mine")q=q.eq("user_id",me.id);
else if(queryMode==="following")q=q.in("user_id",[...new Set([me.id,...following])]);
else if(selectedSpaceId&&spacesReady)q=q.eq("space_id",selectedSpaceId);
q=q.order("created_at",{ascending:false}).order("id",{ascending:false});
if(sharedPostId)return q.limit(1);
const offset=page*FEED_PAGE_SIZE;
return q.range(offset,offset+FEED_PAGE_SIZE);
}

function bindAudiencePicker(){

async function confirmPublishedPost(uid,id){
 try{const {data,error}=await db.from("posts").select("id,user_id").eq("id",id).eq("user_id",uid).maybeSingle();return !error&&data?.id===id&&data.user_id===uid;}catch{return false;}

async function publish(options={}){
 const batch=options.batch===true;
 const textInput=document.getElementById("posttext"),mediaInput=document.getElementById("media");if(!me?.id||!textInput||!mediaInput)return {ok:false};
 const text=textInput.value.trim();
 const files=batch?[options.reelFile]:Array.from(mediaInput.files||[]);
 if(!text&&!files.length)return say("Escribe algo o elige fotos o vídeos.",true);
 if(files.length>MAX_POST_FILES||files.some(f=>!f||!MEDIA_TYPES.includes(f.type)||!f.size||f.size>MAX_POST_BYTES)||files.reduce((n,f)=>n+f.size,0)>MAX_POST_BYTES)
 return say("Selecciona hasta 10 archivos compatibles, con un máximo de 50 MB en total.",true);
 const b=document.getElementById("publish");if(!b||publishLocks.has(me.id)||(b.disabled&&!batch))return {ok:false};
 const uid=me.id,space=document.getElementById("postspace")?.value||null;
 const audience=document.getElementById("audience")?.value||"only_me",members=[...audienceChosen.keys()],postId=crypto.randomUUID(),bucket=audience==="public"?BUCKET:PRIVATE_BUCKET;
 if(!["public","friends","selected","except","only_me"].includes(audience))return say("Selecciona una audiencia válida.",true);
 if(["selected","except"].includes(audience)&&!members.length)return say("Elige al menos una persona.",true);
 const active=()=>me?.id===uid&&b.isConnected&&document.getElementById("publish")===b;
 publishLocks.add(uid);b.disabled=true;b.textContent="Publicando…";
 const controls=[textInput,mediaInput,document.getElementById("postspace"),document.getElementById("audience"),document.getElementById("audience-search"),...document.querySelectorAll("#audience-chosen button,#audience-results button")].filter(Boolean),previous=controls.map(c=>c.disabled);
 controls.forEach(c=>c.disabled=true);
 const uploaded=[];let postCommitted=false,insertAttempted=false;
 try{
  for(let i=0;i<files.length;i++){
   if(!active())throw Error("Sección cerrada");
   const file=files[i],ext=({"image/jpeg":"jpg","image/png":"png","image/webp":"webp","video/mp4":"mp4","video/webm":"webm"})[file.type];
   const path=uid+"/"+postId+"-"+crypto.randomUUID()+"."+ext;
   b.textContent="Subiendo "+(i+1)+" de "+files.length+"…";
   const {error}=await db.storage.from(bucket).upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;
   uploaded.push({path,type:file.type});
  }
  const first=uploaded[0];
  const url=uploaded.length>1?MEDIA_MANIFEST+JSON.stringify(uploaded):first&&audience==="public"?db.storage.from(BUCKET).getPublicUrl(first.path).data.publicUrl:null;
  const newPost={id:postId,content:text,user_id:uid,audience,media_url:url,media_type:first?.type||null,media_path:first?.path||null};
  if(spacesReady)newPost.space_id=space;
  if(!active())throw Error("Sección cerrada");
  insertAttempted=true;
  try{const {error}=await db.from("posts").insert(newPost);if(error)throw error;postCommitted=true;}
  catch(error){if(me?.id===uid)postCommitted=await confirmPublishedPost(uid,postId);if(!postCommitted)throw error;}
  if(me?.id!==uid)return {ok:true,warning:true};
 if(readPostDraft(uid).trim()===text)writePostDraft(uid,"");
 if(["selected","except"].includes(audience)){const {error:audienceError}=await db.from("gyste_post_audience").insert({post_id:postId,owner_id:uid,member_ids:members});if(audienceError){say("Publicación visible solo para ti: no se pudo guardar la audiencia.",true);if(batch)return {ok:true,warning:true};b.disabled=false;b.textContent="Compartir publicación";await feedView();return;}}
 if(batch)return {ok:true};
  if(!active())return {ok:true};
  sharedPostId=null;
   say("Publicación compartida.");
  try{resetFeedPage();await feedView();}catch(refreshError){console.warn("Publicación guardada; falló la actualización:",refreshError);say("Publicación guardada. Actualiza Inicio para verla.");}
 }catch(e){
  if(uploaded.length&&!insertAttempted&&me?.id===uid){try{const {error}=await db.storage.from(bucket).remove(uploaded.map(m=>m.path));if(error)console.warn("Archivos pendientes de limpieza:",error.message);}catch{}}
  if(active())say(postCommitted?"Publicación guardada; revisa su visibilidad y actualiza Inicio.":insertAttempted?"No se pudo confirmar la publicación. Revisa Inicio antes de volver a compartir.":"No se pudo publicar. Conservamos tu selección mientras sigas en esta pantalla.",true);
  if(batch)return {ok:postCommitted,warning:postCommitted};
   }finally{publishLocks.delete(uid);controls.forEach((c,i)=>c.disabled=previous[i]);if(b.isConnected&&!batch){b.disabled=false;b.textContent="Compartir publicación";}}
}

// Primero borra la fila protegida por RLS; después intenta limpiar el objeto.
// Esto evita dejar una publicación visible con un enlace multimedia roto.
const postDeleteLocks=new Set();
async function deletePost(id,button){
 const uid=me?.id,post=posts.find(p=>p.id===id),key=uid+":"+id,startTab=tab;
 if(!uid||postDeleteLocks.has(key)||button?.disabled)return;
 if(!post)return say("No se encontró esta publicación. Actualiza el inicio.",true);
 if(post.user_id!==uid)return say("Solo puedes eliminar tus propias publicaciones.",true);
 if(!confirm("¿Eliminar esta publicación? Esta acción no se puede deshacer."))return;
 postDeleteLocks.add(key);const oldLabel=button?.textContent;if(button){button.disabled=true;button.textContent="Eliminando…";}
 const ownedPaths=[...new Set(postMediaItems(post).map(m=>m.path).filter(path=>typeof path==="string"&&path.startsWith(uid+"/")))],bucket=bucketFor(post);
 let deleted=false,cleanupPending=false;
 try{
  const {data,error}=await db.from("posts").delete().eq("id",id).eq("user_id",uid).select("id").maybeSingle();
  if(error)throw error;
  if(data?.id!==id)throw Error("No se confirmó el borrado.");
  deleted=true;
  if(me?.id!==uid)return;
  if(ownedPaths.length){try{const {error}=await db.storage.from(bucket).remove(ownedPaths);if(error)cleanupPending=true;}catch{cleanupPending=true;}}
  if(me?.id!==uid)return;
  posts=posts.filter(p=>p.id!==id);ownedPaths.forEach(path=>mediaUrlCache.delete(bucket+":"+path));
  if(tab===startTab){
   say(cleanupPending?"Publicación eliminada. Algunos archivos pueden seguir almacenados; informa al equipo si eran privados o sensibles.":"Publicación eliminada.",cleanupPending);
   try{await renderTab();}catch{if(me?.id===uid&&tab===startTab)say("Publicación eliminada. Actualiza la sección para ver el cambio.",cleanupPending);}
  }
 }catch{
  if(me?.id===uid&&tab===startTab)say(deleted?"Publicación eliminada; actualiza la sección.":"No se pudo confirmar la eliminación. Actualiza la sección antes de intentarlo otra vez.",true);
 }finally{postDeleteLocks.delete(key);if(button){button.disabled=false;button.textContent=oldLabel;}}
}

async function reactPost(id,type,b){

 if(!uid||session?.user?.id!==uid||b.disabled||reactingPostIds.has(key)||!REACTION_TYPES.some(r=>r[0]===type)||!posts.some(p=>p.id===id))return;
 const active=()=>me?.id===uid&&session?.user?.id===uid&&cardsEpoch===epoch;
 reactingPostIds.add(key);reactionButtons(id).forEach(n=>n.disabled=true);
 try{
  const old=reactionMine.get(id),wanted=old===type?null:type;
  try{
   let q;if(wanted===null)q=db.from("reactions").delete().eq("post_id",id).eq("user_id",uid);

 }catch{if(active())say("No se pudo verificar tu reacción. Actualiza la sección antes de reintentar.",true);}
 finally{reactingPostIds.delete(key);if(me?.id===uid&&session?.user?.id===uid)reactionButtons(id).forEach(n=>n.disabled=false);}
}

async function changeProfileImage(kind,file){
 if(!me||profileImageBusy||!["avatar","cover"].includes(kind))return;
 const uid=me.id,key=kind+"_url";
 const extensions={"image/jpeg":"jpg","image/png":"png","image/webp":"webp"};
 if(file&&(!Object.hasOwn(extensions,file.type)||file.size>PROFILE_MAX_BYTES||!file.size))return profilePhotoStatus("Elige una imagen JPG, PNG o WebP de hasta 5 MB.",true);
 profileImageBusy=true;
 app.querySelectorAll("[data-photo-pick],[data-photo-remove]").forEach(b=>b.disabled=true);
 const storage=db.storage.from(PROFILE_BUCKET);let newPath=null;let oldPath=null;
 try{
  profilePhotoStatus(file?"Subiendo fotografía…":"Quitando fotografía…");
  const current=await db.from("gyste_profiles").select(key).eq("user_id",uid).single();
  if(current.error)throw current.error;
  oldPath=ownProfileImagePath(current.data?.[key],uid);
  let url=null;
  if(file){
   newPath=`${uid}/${kind}-${crypto.randomUUID()}.${extensions[file.type]}`;
   const up=await storage.upload(newPath,file,{contentType:file.type,cacheControl:"3600",upsert:false});
   if(up.error)throw up.error;
   url=storage.getPublicUrl(newPath).data.publicUrl;
   if(!profileImageUrl(url))throw new Error("No se obtuvo un enlace de imagen válido.");
  }
  if(me?.id!==uid)throw new Error("La sesión ha cambiado. Vuelve a intentarlo.");
  const saved=await db.from("gyste_profiles").update({[key]:url,updated_at:new Date().toISOString()}).eq("user_id",uid).select().single();
  if(saved.error)throw saved.error;
  if(me?.id===uid){me={...me,...saved.data};refreshProfilePhotoControls();}
  // Remove only objects belonging to this account, after the database update succeeds.
  // Avoid deleting on uncertain network failures (the saved URL may already be in use).
  let cleanupError=false;
  if(oldPath&&oldPath!==newPath){try{const result=await storage.remove([oldPath]);cleanupError=Boolean(result.error);}catch{cleanupError=true;}}
  if(me?.id===uid)profilePhotoStatus((file?"Fotografía guardada.":"Fotografía quitada del perfil.")+(cleanupError?" No se pudo limpiar el archivo anterior.":""),cleanupError);
 }catch(e){if(me?.id===uid)profilePhotoStatus("No se pudo completar el cambio: "+(e?.message||"revisa la conexión")+". Actualiza el perfil antes de reintentar.",true);}
 finally{profileImageBusy=false;app.querySelectorAll("[data-photo-pick],[data-photo-remove]").forEach(b=>b.disabled=false);}
}

 }
}

// No afirma ofrecer cifrado de extremo a extremo ni notificaciones push.
let chatRefreshTimer=null,chatViewEpoch=0;
let chatRenderSignature="";
function stopChatRefresh(){if(chatRefreshTimer){clearInterval(chatRefreshTimer);chatRefreshTimer=null;}}
const CHAT_BUCKET="gyste-chat-media";
const CHAT_AUDIO_TYPES=["audio/webm","audio/mp4","audio/ogg","audio/mpeg","audio/wav"];
const chatFileType=f=>String(f?.type||"").split(";")[0].toLowerCase();
let voiceCapture=null,voiceDraft=null,voiceDraftUrl=null;
function clearVoiceDraft(){voiceDraft=null;if(voiceDraftUrl)URL.revokeObjectURL(voiceDraftUrl);voiceDraftUrl=null;}
function stopVoiceCapture(){if(voiceCapture){const v=voiceCapture;voiceCapture=null;v.cancelled=true;clearTimeout(v.timer);if(v.rec.state!=="inactive")v.rec.stop();v.stream.getTracks().forEach(t=>t.stop());}clearVoiceDraft();}
const chatMediaCache=new Map();
async function prepareChatMedia(items,valid=()=>true){
 const paths=[...new Set((items||[]).map(m=>m.media_path).filter(Boolean))].filter(p=>!chatMediaCache.has(p)||chatMediaCache.get(p).expires<Date.now()+30000);
 if(!paths.length)return;
 const {data,error}=await db.storage.from(CHAT_BUCKET).createSignedUrls(paths,300);
 if(error||!valid())return;
 for(const item of data||[])if(item.path&&item.signedUrl)chatMediaCache.set(item.path,{url:item.signedUrl,expires:Date.now()+300000});
}
function chatAttachment(m){
 if(!m.media_path)return "";
 const entry=chatMediaCache.get(m.media_path),url=entry&&entry.expires>Date.now()?safeMediaUrl(entry.url):"";
 if(!url)return '<p class="muted">Archivo no disponible. Actualiza la conversación.</p>';
 if(m.media_type?.startsWith("audio/"))return `<audio controls preload="none" style="width:100%;max-width:100%" src="${esc(url)}"></audio>`;
 const video=m.media_type?.startsWith("video/");
 return `<div class="media-frame" style="max-width:100%;margin:8px 0;text-align:center">${video?`<video class="media" controls playsinline preload="metadata" src="${esc(url)}"></video>`:`<img class="media" loading="lazy" alt="Fotografía privada" src="${esc(url)}">`}<button type="button" class="media-expand">⛶ ${video?"Pantalla completa":"Ampliar foto"}</button></div>`;
}
function chatBody(content){
 const s=String(content||""),match=s.match(/(?:^|\n)📎 Publicación de Gyste: ([^\s]+)$/);if(!match)return esc(s);
 try{const u=new URL(match[1]);const id=u.searchParams.get("post");if(u.origin!==location.origin||!id||!/^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$/i.test(id))return esc(s);return esc(s.slice(0,match.index).trim())+`<div><button type="button" class="secondary" data-chat-post="${esc(id)}">▶ Ver publicación compartida</button></div>`;}catch{return esc(s);}
}
function chatMarkup(items){return (items||[]).map(m=>`<div class="comment" style="text-align:${m.sender_id===me.id?"right":"left"}"><div class="comment-author" style="justify-content:${m.sender_id===me.id?"flex-end":"flex-start"}"><span class="face">${avatarContent(m.sender_id===me.id?me:chatPeerProfile)}</span></div><div class="bodytext">${chatBody(m.content)}</div>${chatAttachment(m)}<small>${time(m.created_at)}</small></div>`).join("")||'<p class="muted">Inicia la conversación.</p>';}
const chatRefreshLocks=new WeakSet();
async function refreshChatMessages(target,markRead=false){
 const uid=me?.id,list=document.getElementById("chatlist"),status=document.getElementById("chat-refresh-status");
 if(!uid||tab!=="messages"||chatUser!==target||!list||chatRefreshLocks.has(list))return;
 const valid=()=>me?.id===uid&&tab==="messages"&&chatUser===target&&list.isConnected&&document.getElementById("chatlist")===list;
 chatRefreshLocks.add(list);
 try{
 const {data,error}=await db.from("gyste_messages").select("id,sender_id,recipient_id,content,created_at,read_at,media_path,media_type")
 .or(`and(sender_id.eq.${uid},recipient_id.eq.${target}),and(sender_id.eq.${target},recipient_id.eq.${uid})`)
 .order("created_at",{ascending:false}).limit(200);
 if(!valid())return;if(error)throw error;
 const ordered=(data||[]).slice().reverse();
 await prepareChatMedia(ordered,valid);
 if(!valid())return;
 const signature=JSON.stringify(ordered.map(m=>[m.id,m.created_at,m.read_at,m.media_path,chatMediaCache.get(m.media_path)?.url]));
 if(status)status.textContent="";
 if(document.fullscreenElement||list.querySelector(".media-overlay")||Array.from(list.querySelectorAll("video,audio")).some(v=>!v.paused&&!v.ended))return;
 if(signature!==chatRenderSignature){
 const nearBottom=list.scrollHeight-list.scrollTop-list.clientHeight<110;list.innerHTML=chatMarkup(ordered);bindMediaActions();
 list.querySelectorAll("[data-chat-post]").forEach(b=>b.onclick=()=>{if(!valid())return;sharedPostId=b.dataset.chatPost;selectedSpaceId=null;homeFilter="all";tab="feed";chatUser=null;renderTab();window.scrollTo({top:0,behavior:"smooth"});});
 if(nearBottom)list.scrollTop=list.scrollHeight;chatRenderSignature=signature;
 }
 const unread=ordered.filter(m=>m.recipient_id===uid&&m.sender_id===target&&!m.read_at).map(m=>m.id);
 if(markRead&&unread.length&&valid()&&document.visibilityState!=="hidden"){
 const {error:readError}=await db.from("gyste_messages").update({read_at:new Date().toISOString()}).eq("recipient_id",uid).eq("sender_id",target).in("id",unread).is("read_at",null);
 if(readError&&valid()&&status)status.textContent="No se pudieron confirmar los avisos de lectura.";
 }
 }catch{if(valid()&&status)status.textContent="No se pudieron actualizar los mensajes. Se volverá a intentar.";}
 finally{chatRefreshLocks.delete(list);}
}
async function messagesView(){
 stopChatRefresh();stopVoiceCapture();chatRenderSignature="";chatMediaCache.clear();
 const uid=me?.id,requestedChat=chatUser,epoch=++chatViewEpoch;if(!uid)return;
 const valid=()=>tab==="messages"&&me?.id===uid&&chatUser===requestedChat&&epoch===chatViewEpoch;
 if(!requestedChat){
  const {data,error}=await db.from("gyste_messages").select("sender_id,recipient_id,content,created_at,read_at")
  .or(`sender_id.eq.${uid},recipient_id.eq.${uid}`).order("created_at",{ascending:false}).limit(200);
  if(!valid())return;
  if(error){shell(`<p class="error">No se pudieron cargar mensajes: ${esc(error.message)}</p>`);return;}
  const ids=[...new Set((data||[]).map(m=>m.sender_id===me.id?m.recipient_id:m.sender_id))];let map={};
  if(ids.length){const {data:u}=await db.from("gyste_profiles").select("user_id,display_name,avatar_url").in("user_id",ids);(u||[]).forEach(x=>map[x.user_id]=x);}
  if(!valid())return;
  shell(`<section class="panel"><h2>Gyste Chat</h2><p class="muted">Mensajería privada entre miembros. Abre un perfil desde Descubrir para iniciar una conversación.</p>${ids.map(id=>{const last=(data||[]).find(m=>m.sender_id===id||m.recipient_id===id);const unread=(data||[]).filter(m=>m.sender_id===id&&m.recipient_id===me.id&&!m.read_at).length;return `<div class="userrow"><span class="face">${avatarContent(map[id])}</span><div class="userinfo"><b>${esc(map[id]?.display_name||"Miembro")}</b>${unread?` <strong aria-label="Mensajes sin leer">(${unread} nuevos)</strong>`:""}<small class="muted" style="display:block">${esc((last?.content||"").slice(0,100))}</small></div><button class="secondary" data-openchat="${esc(id)}">Abrir</button></div>`;}).join("")||'<p class="muted">Aún no tienes conversaciones.</p>'}</section>`);
  // Permite iniciar una conversación sin tener mensajes previos.
  const panel=document.querySelector(".panel");
  if(panel){
   const finder=document.createElement("div");
   finder.style.marginBottom="18px";
   finder.innerHTML='<label for="chatfind"><b>Buscar una persona para conversar</b></label><input id="chatfind" class="field" maxlength="80" placeholder="Escribe al menos 2 letras del nombre" autocomplete="off"><div id="chatresults" aria-live="polite"></div>';
   panel.insertBefore(finder,panel.children[2]||null);
   let searchSerial=0;
   document.getElementById("chatfind").addEventListener("input",async function(){
    const q=this.value.trim();const results=document.getElementById("chatresults");const serial=++searchSerial;
    if(q.length<2){results.textContent="";return;}
    results.textContent="Buscando…";
    const {data:people,error:searchError}=await db.from("gyste_profiles").select("user_id,display_name").ilike("display_name","%"+q.replace(/[%_,]/g,"")+"%").neq("user_id",me.id).limit(15);
    if(serial!==searchSerial||!valid()||!results.isConnected)return;
    results.replaceChildren();
    if(searchError){results.textContent="No se pudo buscar: "+searchError.message;return;}
    if(!people?.length){results.textContent="No se encontraron miembros.";return;}
    for(const person of people){
     const line=document.createElement("div");line.className="userrow";
     const name=document.createElement("span");name.textContent=person.display_name||"Miembro";
     const open=document.createElement("button");open.className="secondary";open.textContent="Conversar";
     open.onclick=()=>{chatUser=person.user_id;messagesView();};
     line.append(name,open);results.append(line);
    }
   });
  }
  document.querySelectorAll("[data-openchat]").forEach(b=>{b.onclick=()=>{chatUser=b.dataset.openchat;messagesView();};});
  return;
 }
 const target=chatUser;
 if(target===me.id){chatUser=null;return messagesView();}
 const {data:person,error:personError}=await db.from("gyste_profiles").select("display_name,avatar_url").eq("user_id",target).maybeSingle();
 if(!valid())return;
 if(personError){shell(`<p class="error">No se pudo cargar el perfil: ${esc(personError.message)}</p>`);return;}
 chatPeerProfile=person;
 shell(`<section class="panel"><button id="back" class="ghost">← Conversaciones</button><button id="block-chat" class="secondary">Bloquear usuario</button><h2 class="comment-author"><span class="face">${avatarContent(person)}</span>${esc(person?.display_name||"Conversación")}</h2><p class="muted">Gyste Chat · texto, voz, fotos y vídeos privados</p><div id="chatlist" aria-live="polite" style="max-height:55vh;min-height:130px;overflow:auto"></div><p id="chat-refresh-status" class="muted" role="status"></p><p id="chatstatus" class="error" role="status"></p><form id="sendmsg"><div class="commentform"><input id="msg" class="field" maxlength="5000" placeholder="Escribe un mensaje…" aria-label="Mensaje" autocomplete="off"><button id="sendmsgbtn" class="primary">Enviar</button></div><label class="muted">📎 Adjuntar foto, vídeo o audio (máx. 50 MB)<input id="chatfile" class="field" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm,audio/webm,audio/mp4,audio/ogg,audio/mpeg,audio/wav"></label><p class="muted" id="chatfile-status" aria-live="polite"></p><div class="actions"><button type="button" class="secondary" id="voice-record">🎙 Grabar voz</button><button type="button" class="secondary" id="voice-cancel" hidden>Cancelar audio</button></div><div id="voice-preview" aria-live="polite"></div><p class="muted">Los participantes pueden conservar o copiar los archivos que reciben.</p></form></section>`);
 document.getElementById("back").onclick=()=>{stopVoiceCapture();stopChatRefresh();chatUser=null;messagesView();};
 bindVoiceRecorder(target);
 document.getElementById("sendmsg").onsubmit=sendMessage;
 document.getElementById("chatfile").onchange=e=>{stopVoiceCapture();resetVoiceUI();const f=e.target.files[0];document.getElementById("chatfile-status").textContent=f?f.name+" · "+(f.size/1048576).toFixed(1)+" MB":"";};
 document.getElementById("block-chat").onclick=e=>blockUser(target,e.currentTarget);
 const chatList=document.getElementById("chatlist");
 await refreshChatMessages(target,true);
 if(valid()&&chatList?.isConnected&&document.getElementById("chatlist")===chatList)chatRefreshTimer=setInterval(()=>{if(document.visibilityState!=="hidden")refreshChatMessages(target,true);},8000);
}
function resetVoiceUI(){
 const b=document.getElementById("voice-record"),cancel=document.getElementById("voice-cancel"),preview=document.getElementById("voice-preview");
 if(b){b.textContent="🎙 Grabar voz";b.disabled=false;}if(cancel)cancel.hidden=true;if(preview)preview.replaceChildren();
}
function bindVoiceRecorder(target){
 const record=document.getElementById("voice-record"),cancel=document.getElementById("voice-cancel"),preview=document.getElementById("voice-preview");
 cancel.onclick=()=>{stopVoiceCapture();resetVoiceUI();};
 record.onclick=async()=>{
 if(voiceCapture){const v=voiceCapture;if(v.rec.state==="recording"){clearTimeout(v.timer);v.rec.stop();record.disabled=true;}return;}
 if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==="undefined"){preview.textContent="Este navegador no permite grabar voz. Puedes adjuntar un audio.";return;}
 clearVoiceDraft();preview.textContent="Solicitando permiso de micrófono…";record.disabled=true;
 let stream;
 try{
 stream=await navigator.mediaDevices.getUserMedia({audio:true});
 if(tab!=="messages"||chatUser!==target||!record.isConnected){stream.getTracks().forEach(t=>t.stop());return;}
 const mime=["audio/webm;codecs=opus","audio/mp4","audio/ogg;codecs=opus"].find(t=>MediaRecorder.isTypeSupported(t));
 const rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined),chunks=[];
 const v={rec,stream,cancelled:false,timer:null};voiceCapture=v;
 rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
 rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());clearTimeout(v.timer);if(voiceCapture===v)voiceCapture=null;if(v.cancelled||tab!=="messages"||chatUser!==target||!record.isConnected)return;
 const type=(rec.mimeType||chunks[0]?.type||"audio/webm").split(";")[0];
 const blob=new Blob(chunks,{type});resetVoiceUI();
 if(!CHAT_AUDIO_TYPES.includes(type)||!blob.size||blob.size>MAX_POST_BYTES){preview.textContent="No se pudo guardar esta grabación.";return;}
 voiceDraft=blob;voiceDraftUrl=URL.createObjectURL(blob);const audio=document.createElement("audio");audio.controls=true;audio.src=voiceDraftUrl;audio.style.width="100%";preview.append("Audio listo. Escúchalo y pulsa Enviar.",audio);cancel.hidden=false;document.getElementById("chatfile").value="";document.getElementById("chatfile-status").textContent="";
 };
 rec.onerror=()=>{stopVoiceCapture();resetVoiceUI();preview.textContent="Error al grabar audio.";};
 rec.start();record.disabled=false;record.textContent="■ Detener grabación";cancel.hidden=false;preview.textContent="Grabando… máximo 2 minutos.";v.timer=setTimeout(()=>{if(rec.state==="recording")rec.stop();},120000);
 }catch(e){if(stream)stream.getTracks().forEach(t=>t.stop());resetVoiceUI();preview.textContent="No se pudo acceder al micrófono. Revisa los permisos.";}
 };
}
const chatSendLocks=new Set(),chatPendingSends=new WeakMap();
async function checkSentMessage(uid,target,id){
 try{
 const {data,error}=await db.from("gyste_messages").select("id,sender_id,recipient_id").eq("id",id).eq("sender_id",uid).eq("recipient_id",target).maybeSingle();
 return !error&&data?.id===id&&data.sender_id===uid&&data.recipient_id===target;
 }catch{return false;}
}
async function sendMessage(e){
 e.preventDefault();const form=e.currentTarget,uid=me?.id,target=chatUser,key=uid+":"+target;
 if(!uid||!target||!form||voiceCapture||chatSendLocks.has(key))return;
 const input=document.getElementById("msg"),button=document.getElementById("sendmsgbtn"),fileInput=document.getElementById("chatfile"),status=document.getElementById("chatstatus");
 if(!input||!button||!fileInput||button.disabled)return;
 const content=input.value.trim(),file=voiceDraft||fileInput.files?.[0],fileType=chatFileType(file);
 if(!content&&!file)return;
 if(content.length>5000||file&&(![...MEDIA_TYPES,...CHAT_AUDIO_TYPES].includes(fileType)||!file.size||file.size>MAX_POST_BYTES)){if(status)status.textContent="Revisa el texto o el formato y tamaño del archivo (máximo 50 MB).";return;}
 const active=()=>me?.id===uid&&tab==="messages"&&chatUser===target&&form.isConnected&&document.getElementById("sendmsg")===form;
 const controls=[input,button,fileInput,document.getElementById("voice-record"),document.getElementById("voice-cancel")].filter(Boolean),previous=controls.map(c=>c.disabled);
 chatSendLocks.add(key);controls.forEach(c=>c.disabled=true);button.textContent=file?"Subiendo…":"Enviando…";if(status)status.textContent="";
 let draft=chatPendingSends.get(form);
 let committed=false;
 try{
 if(!draft||draft.uid!==uid||draft.target!==target||draft.content!==content||draft.file!==file){
 const id=crypto.randomUUID(),ext=({"image/jpeg":"jpg","image/png":"png","image/webp":"webp","video/mp4":"mp4","video/webm":"webm","audio/webm":"webm","audio/mp4":"m4a","audio/ogg":"ogg","audio/mpeg":"mp3","audio/wav":"wav"})[fileType];
 draft={uid,target,content,file,id,path:file?uid+"/"+id+"."+ext:null,uploaded:false,insertAttempted:false};
 chatPendingSends.set(form,draft);
 }
 if(draft.insertAttempted){committed=await checkSentMessage(uid,target,draft.id);}
 if(!committed){
 if(!active())return;
 if(file&&!draft.uploaded){
 const {error}=await db.storage.from(CHAT_BUCKET).upload(draft.path,file,{upsert:false,contentType:fileType});
 if(error)throw error;draft.uploaded=true;
 }
 if(!active())return;
 button.textContent="Enviando…";draft.insertAttempted=true;
 try{
 const {error}=await db.from("gyste_messages").insert({id:draft.id,sender_id:uid,recipient_id:target,content:content||(fileType.startsWith("audio/")?"🎙 Mensaje de voz":fileType.startsWith("video/")?"🎬 Vídeo":"📷 Fotografía"),media_path:draft.path,media_type:fileType||null});
 if(error)throw error;committed=true;
 }catch(error){if(me?.id===uid)committed=await checkSentMessage(uid,target,draft.id);if(!committed)throw error;}
 }
 if(committed){chatPendingSends.delete(form);if(active()){input.value="";fileInput.value="";clearVoiceDraft();resetVoiceUI();const fs=document.getElementById("chatfile-status");if(fs)fs.textContent="";if(status)status.textContent="Mensaje enviado.";try{await refreshChatMessages(target,true);}catch{}}}
 }catch(error){
 if(active()&&status)status.textContent=error?.code==="42501"?"No se pudo enviar por las preferencias de privacidad o los permisos. Conservamos tu borrador.":"No se pudo confirmar el envío. Conservamos tu borrador mientras sigas en esta conversación. Revisa los mensajes o vuelve a pulsar Enviar.";
 // No eliminar archivos tras una respuesta incierta: podrían pertenecer a un mensaje ya registrado.
 }finally{chatSendLocks.delete(key);controls.forEach((c,i)=>c.disabled=previous[i]);button.textContent="Enviar";if(committed&&active())input.focus();}
}
async function start(){
const timingStart=performance.now();
try{
if(!window.supabase||typeof window.supabase.createClient!=="function"){
app.innerHTML='<section class="auth"><h1>Gyste</h1><p class="error">No se pudo cargar el servicio de conexión. Comprueba Internet y vuelve a intentarlo.</p><button class="primary full" id="retry">Reintentar</button></section>';
document.getElementById("retry").onclick=start;
return;
}
if(!db)db=window.supabase.createClient(URL_DB,KEY_DB,{
  auth:{
    persistSession:true,
    autoRefreshToken:true,
    detectSessionInUrl:true,
    storage:window.localStorage
  }
});
if(!authListener){
authListener=db.auth.onAuthStateChange((event,s)=>{
session=s;
if(event==="PASSWORD_RECOVERY"){
  recoveryView();
  return;
}
if(!s){me=null;chatUser=null;tab="feed";sharedPostId=null;selectedSpaceId=null;homeFilter="all";authView();}
});
}
const result=await Promise.race([
db.auth.getSession(),
new Promise((_,reject)=>setTimeout(()=>reject(new Error("La conexión está tardando demasiado. Comprueba Internet y pulsa Reintentar.")),15000))
]);
const {data,error}=result;
if(error)throw error;
session=data.session;
const recoveryLink=/(?:^|[&#])type=recovery(?:&|$)/i.test(window.location.hash);
if(recoveryLink&&session){recoveryView();}
else if(session)await boot();else authView();
if(session&&me)recordGysteTiming("startup",timingStart);
}catch(e){
app.innerHTML=`<section class="auth"><h1>Gyste</h1><p class="error">${esc(e?.message||"No se pudo iniciar Gyste. Comprueba Internet.")}</p><button class="primary full" id="retry">Reintentar</button></section>`;
document.getElementById("retry").onclick=start;
}
}

// Renueva la vista del feed al volver a la app si los enlaces firmados están cerca de expirar.
document.addEventListener("visibilitychange",()=>{
if(document.visibilityState==="visible"&&session&&me&&tab==="feed"){
const expiring=[...mediaUrlCache.values()].some(x=>x.expiresAt<Date.now()+5*60*1000);
if(expiring)feedView();
}
});

document.addEventListener("play",e=>{if(e.target instanceof HTMLMediaElement)document.querySelectorAll("video,audio").forEach(m=>{if(m!==e.target&&!m.paused)m.pause();});},true);
for(const event of ["play","playing","waiting","stalled","pause","ended","error","emptied","seeking"])document.addEventListener(event,observeVideoTiming,true);
document.addEventListener("visibilitychange",()=>{if(document.hidden)gysteMediaTimings=new WeakMap();});
window.addEventListener("pagehide",stopVoiceCapture);
start();
// Register independently of authentication; no reload and no cached application data.
if(document.readyState==="complete")void registerGysteOffline();else window.addEventListener("load",()=>{void registerGysteOffline();},{once:true});
</script>
