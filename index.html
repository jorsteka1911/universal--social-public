<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gyste</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #0A1929; color: #F3F6F9; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
    header { display: flex; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid #1E4976; background: #0A1929; }
    .logo { font-size: 24px; font-weight: bold; color: #36C7B2; }
    input, button { font-family: inherit; }
    .auth-container { max-width: 400px; margin: 50px auto; padding: 20px; background: #132F4C; border-radius: 12px; border: 1px solid #1E4976; }
    .auth-container h1 { color: #36C7B2; text-align: center; }
    .auth-input { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #1E4976; background: #0A1929; color: white; box-sizing: border-box; }
    .btn-primary { width: 100%; padding: 15px; background: #36C7B2; color: #0A1929; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; margin-bottom: 10px; }
    .btn-secondary { width: 100%; padding: 15px; background: transparent; color: #36C7B2; font-weight: bold; border-radius: 8px; border: 1px solid #36C7B2; cursor: pointer; }
    .feed-container { max-width: 600px; margin: 0 auto; padding: 20px; }
    .post-box { background: #132F4C; padding: 20px; border-radius: 12px; border: 1px solid #1E4976; margin-bottom: 20px; }
    .post { background: #132F4C; padding: 20px; border-radius: 12px; border: 1px solid #1E4976; margin-bottom: 15px; }
    .post-actions { display: flex; gap: 15px; margin-top: 15px; color: #B2BAC2; }
    .action-btn { background: none; border: none; color: #B2BAC2; cursor: pointer; font-size: 1rem; display: flex; align-items: center; gap: 5px; }
    .action-btn:hover { color: #36C7B2; }
    .action-btn.liked { color: #36C7B2; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    
    // --- TUS DATOS DE SUPABASE (DEJA ESTO ASÍ POR AHORA) ---
    const supabaseUrl = 'https://fmmsfyenevlordrupzdw.supabase.co';
    const supabaseKey = 'TU_CLAVE_ANON_AQUI'; 
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    function App() {
      const [session, setSession] = useState(null);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [posts, setPosts] = useState([]);
      const [newPost, setNewPost] = useState('');
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
          if (session) fetchPosts();
          setLoading(false);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setSession(session);
          if (session) fetchPosts();
        });

        return () => subscription.unsubscribe();
      }, []);

      const fetchPosts = async () => {
        const { data } = await supabase.from('posts').select('*').order('created_at', { ascending: false });
        if (data) setPosts(data);
      };

      const handleSignUp = async () => {
        const { error } = await supabase.auth.signUp({ email, password });
        if (error) alert(error.message);
        else alert('¡Revisa tu correo para confirmar tu cuenta!');
      };

      const handleSignIn = async () => {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) alert(error.message);
      };

      const handleSignOut = async () => {
        await supabase.auth.signOut();
        setPosts([]);
      };

      const handleCreatePost = async (e) => {
        e.preventDefault();
        if (!newPost.trim()) return;
        const { error } = await supabase.from('posts').insert([{ content: newPost, user_id: session.user.id }]);
        if (error) alert(error.message);
        else {
          setNewPost('');
          fetchPosts();
        }
      };

      const handleLike = async (postId, currentLikes) => {
        await supabase.from('posts').update({ likes: currentLikes + 1 }).eq('id', postId);
        fetchPosts();
      };

      if (loading) return <div style={{ color: 'white', textAlign: 'center', marginTop: '50px' }}>Cargando Gyste...</div>;

      if (!session) {
        return (
          <div className="auth-container">
            <h1>🌍 Gyste</h1>
            <p style={{ textAlign: 'center', color: '#B2BAC2', marginBottom: '20px' }}>Únete a la red social del futuro</p>
            <input className="auth-input" type="email" placeholder="Correo electrónico" value={email} onChange={e => setEmail(e.target.value)} />
            <input className="auth-input" type="password" placeholder="Contraseña" value={password} onChange={e => setPassword(e.target.value)} />
            <button className="btn-primary" onClick={handleSignIn}>Entrar</button>
            <button className="btn-secondary" onClick={handleSignUp}>Crear cuenta</button>
          </div>
        );
      }

      return (
        <div>
          <header>
            <div className="logo">🌍 Gyste</div>
            <button onClick={handleSignOut} style={{ background: 'transparent', color: 'white', border: '1px solid white', padding: '5px 10px', borderRadius: '5px', cursor: 'pointer' }}>Salir</button>
          </header>

          <div className="feed-container">
            <form onSubmit={handleCreatePost} className="post-box" style={{ display: 'flex', gap: '10px' }}>
              <input 
                value={newPost} 
                onChange={e => setNewPost(e.target.value)} 
                placeholder="¿Qué está pasando en tu universo?" 
                style={{ flex: 1, padding: '15px', borderRadius: '8px', border: '1px solid #1E4976', background: '#0A1929', color: 'white' }} 
              />
              <button type="submit" style={{ padding: '15px', background: '#36C7B2', color: '#0A1929', fontWeight: 'bold', borderRadius: '8px', border: 'none', cursor: 'pointer' }}>Publicar</button>
            </form>

            {posts.map(post => (
              <div key={post.id} className="post">
                <p style={{ margin: '0 0 15px 0', fontSize: '1.1rem' }}>{post.content}</p>
                <div className="post-actions">
                  <button className="action-btn" onClick={() => handleLike(post.id, post.likes || 0)}>
                    ❤️ {post.likes || 0}
                  </button>
                  <button className="action-btn" onClick={() => alert('Comentarios próximamente')}>💬 Comentar</button>
                  <button className="action-btn" onClick={() => alert('Enlace copiado')}>↗️ Compartir</button>
                </div>
              </div>
            ))}
            {posts.length === 0 && <p style={{ textAlign: 'center', color: '#B2BAC2', marginTop: '40px' }}>Aún no hay publicaciones. ¡Sé el primero en publicar!</p>}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
