<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--bg:#091827;--panel:#122d49;--line:#244866;--mint:#36c7b2;--txt:#f3f6f9;--muted:#aab8c5;--red:#ff7c88}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px system-ui,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
header{position:sticky;top:0;z-index:5;background:#091827f2;border-bottom:1px solid var(--line);padding:12px max(14px,calc((100% - 950px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:27px;font-weight:900;color:var(--mint);letter-spacing:.5px}
.wrap{max-width:950px;margin:auto;padding:16px 12px}
nav{display:flex;gap:7px;overflow:auto;padding:10px 0 15px}
nav button,.ghost{background:transparent;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:9px 12px;white-space:nowrap}
nav button.active{background:var(--mint);color:#08202b;border-color:var(--mint);font-weight:800}
.panel,.post,.auth{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.auth{max-width:420px;margin:55px auto}
h1,h2,h3{margin-top:0}
h1{color:var(--mint)}
.muted{color:var(--muted)}
.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--txt);margin:6px 0}
textarea.field{resize:vertical;min-height:80px}
.primary{background:var(--mint);color:#06202a;border:0;border-radius:9px;padding:12px 15px;font-weight:800}
.secondary{background:transparent;color:var(--mint);border:1px solid var(--mint);border-radius:9px;padding:11px 14px}
.full{width:100%;margin-top:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.notice{padding:10px;text-align:center;color:var(--mint)}
.error{color:var(--red)}
.posthead{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px;margin-bottom:10px}
.author{color:var(--mint);font-weight:800}
.bodytext{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.media{width:100%;max-height:520px;object-fit:contain;background:#07121e;border-radius:10px;margin-top:10px}
.actions{display:flex;gap:15px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.action{border:0;background:none;color:var(--muted);padding:6px 0}
.danger{border:1px solid var(--red);background:transparent;color:var(--red);border-radius:8px;padding:7px 10px}
.liked{color:#ff7887}
.comment{border-top:1px solid var(--line);padding:9px 0;overflow-wrap:anywhere}
.comment small{color:var(--muted)}
.commentform{display:flex;gap:7px;margin-top:8px}
.commentform input{min-width:0;flex:1}
.userrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.avatar{width:38px;height:38px;border-radius:50%;background:#1d5268;display:grid;place-items:center;color:var(--mint);font-weight:900;flex-shrink:0}
.userinfo{flex:1;min-width:0;overflow-wrap:anywhere}
.userrow button{flex-shrink:0}
.hidden{display:none!important}
@media(max-width:520px){
header{padding:10px 12px}
.wrap{padding:12px 9px}
.panel,.post{padding:13px}
.auth{margin:25px 12px}
.userrow{flex-wrap:wrap}
}
</style>
</head>

<div id="app" class="wrap"><p class="muted">Iniciando Gyste…</p></div>
<script>
"use strict";

const URL_DB="https://fmmsfyenevlordrupzdw.supabase.co";
const KEY_DB="sb_publishable_FYw0EYzzVvxnBtVQwwxCAg_zQR13mS2";
const BUCKET="gyste-media";
// Mantener en false mientras el bucket siga siendo público.
// Solo cambiar a true DESPUÉS de probar el acceso firmado y privatizar el bucket en Supabase.
const MEDIA_BUCKET_PRIVATE=false;
const MEDIA_SIGNED_URL_TTL=3600;

let db=null;
let authListener=null;
// El SDK puede retirar el fragmento de recuperación antes de que termine getSession().
// Guardamos la intención antes de crear el cliente para impedir que boot() tape el formulario.
let recoveryPending=/(?:^|[&#?])type=recovery(?:&|$)/i.test(window.location.hash+"&"+window.location.search);
let recoverySaving=false;
const app=document.getElementById("app");

let session=null;
let me=null;
let tab="feed";
let posts=[];
let feedMode="recent";
let profiles=[];
let notice="";
let noticeError=false;
let commentCache={};
let liked=new Set();
let following=new Set();
let chatUser=null;
const mediaUrlCache=new Map();

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

const say=(s,e=false)=>{
notice=s;
noticeError=e;
const n=document.getElementById("notice");
if(n){n.textContent=s;n.className="notice"+(e?" error":"");}
};

const time=s=>{
const d=new Date(s);
return Number.isNaN(d.getTime())?"":d.toLocaleString("es-ES",{dateStyle:"short",timeStyle:"short"});
};

<div class="logo">Gyste</div>

app.innerHTML=`
<section class="auth">
<h1>Crear contraseña nueva</h1>

async function sendPasswordReset(){
const email=document.getElementById("email").value.trim().toLowerCase();
if(!validEmail(email))return say("Escribe primero el correo de tu cuenta.",true);
const button=document.getElementById("forgot");
button.disabled=true;button.textContent="Enviando…";
try{
const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname});
if(error)throw error;
say("Te enviamos un enlace. Ábrelo desde este mismo navegador para crear tu contraseña nueva.");
}catch(e){say("No se pudo enviar el correo de recuperación. Comprueba la configuración de URL de Supabase e inténtalo de nuevo.",true);}
finally{button.disabled=false;button.textContent="¿Olvidaste tu contraseña?";}
}

async function saveNewPassword(){
if(recoverySaving)return;
const password=document.getElementById("newpassword").value;
const confirmation=document.getElementById("confirmnewpassword").value;
if(password.length<6)return say("La contraseña debe tener al menos 6 caracteres.",true);
if(password!==confirmation)return say("Las contraseñas no coinciden. Escríbelas de nuevo.",true);
const button=document.getElementById("savepassword");
button.disabled=true;button.textContent="Guardando…";
recoverySaving=true;
try{
const {data,error}=await db.auth.updateUser({password});
if(error)throw error;
session=(await db.auth.getSession()).data.session;
if(data?.user){
  recoveryPending=false;
  window.history.replaceState({},document.title,window.location.pathname+window.location.search);
  notice="Contraseña actualizada correctamente. Ya puedes usarla para entrar en Gyste.";
  noticeError=false;
  await db.auth.signOut();
  session=null;me=null;chatUser=null;
  authView();
  say(notice,false);
}
}catch(e){say("No se pudo actualizar la contraseña. Vuelve a abrir el enlace de recuperación más reciente.",true);button.disabled=false;button.textContent="Guardar contraseña";}
finally{recoverySaving=false;}
}

function authMessage(error, mode){
  const raw=String(error?.message||"").toLowerCase();
  const code=String(error?.code||"").toLowerCase();
  if(raw.includes("invalid login credentials")||raw.includes("invalid_credentials")||code==="invalid_credentials")
    return "El correo o la contraseña no son correctos. Comprueba los datos e inténtalo de nuevo.";
  if(raw.includes("email not confirmed")||code==="email_not_confirmed")
    return "Tu correo todavía no está confirmado. Revisa tu bandeja de entrada y la carpeta de spam.";
  if(raw.includes("user already registered")||raw.includes("already registered")||raw.includes("user already exists")||code==="user_already_exists")
    return "Este correo ya tiene una cuenta. Pulsa Entrar para iniciar sesión.";
  if(raw.includes("password should be at least")||raw.includes("password is too short"))
    return "La contraseña debe tener al menos 6 caracteres.";
  if(raw.includes("rate limit")||raw.includes("too many requests")||code.includes("rate_limit"))
    return "Has realizado demasiados intentos. Espera un poco y vuelve a intentarlo.";
  if(raw.includes("network")||raw.includes("fetch")||raw.includes("timeout"))
    return "No se pudo conectar. Comprueba Internet y vuelve a intentarlo.";
  return mode==="login" ? "No se pudo iniciar sesión. Comprueba tus datos e inténtalo de nuevo." : "No se pudo crear la cuenta. Revisa los datos e inténtalo de nuevo.";
}

function validEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

async function login(){
  const email=document.getElementById("email").value.trim().toLowerCase();
  const password=document.getElementById("password").value;
  const button=document.getElementById("login");
  if(!validEmail(email))return say("Escribe un correo electrónico válido.",true);
  if(!password)return say("Escribe tu contraseña.",true);
  button.disabled=true;button.textContent="Entrando…";
  try{
    const {data,error}=await db.auth.signInWithPassword({email,password});
    if(error)throw error;
    if(!data.session)throw new Error("No se pudo establecer la sesión. Inténtalo de nuevo.");
    session=data.session;
    await boot();
  }catch(error){
    say(authMessage(error,"login"),true);
  }finally{
    const current=document.getElementById("login");
    if(current){current.disabled=false;current.textContent="Entrar";}
  }
}

async function signup(){
  const email=document.getElementById("email").value.trim().toLowerCase();
  const password=document.getElementById("password").value;
  const button=document.getElementById("signup");
  if(!validEmail(email))return say("Escribe un correo electrónico válido.",true);
  if(password.length<6)return say("La contraseña debe tener al menos 6 caracteres.",true);
  button.disabled=true;button.textContent="Creando cuenta…";
  try{
    const {data,error}=await db.auth.signUp({email,password});
    if(error)throw error;
    // Supabase puede devolver identidades vacías cuando el correo ya existe,
    // para evitar revelar información de cuentas a terceros.
    if(data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0){
      say("Este correo ya tiene una cuenta. Pulsa Entrar para iniciar sesión.",true);
      return;
    }
    if(data.session){
      session=data.session;
      await boot();
    }else{
      say("Solicitud de registro recibida. Si Supabase requiere confirmar el correo, revisa tu bandeja de entrada y spam.");
    }
  }catch(error){
    say(authMessage(error,"signup"),true);
  }finally{
    const current=document.getElementById("signup");
    if(current){current.disabled=false;current.textContent="Crear cuenta";}
  }
}

async function logout(){
const {error}=await db.auth.signOut();
if(error)return say("No se pudo cerrar sesión: "+error.message,true);
session=null;me=null;chatUser=null;authView();
}

async function boot(){
const {data:{user},error}=await db.auth.getUser();
if(error||!user){session=null;me=null;return authView();}
me={id:user.id,email:user.email};
let {data:p,error:profileError}=await db.from("gyste_profiles").select("*").eq("user_id",user.id).maybeSingle();
if(profileError)return authViewWithError("No se pudo cargar tu perfil: "+profileError.message);
if(!p){
const name=user.email?.split("@")[0]||"Usuario";
const username=(name.replace(/[^a-z0-9_]/gi,"").toLowerCase()||"usuario").slice(0,22)+"_"+user.id.slice(0,6);
const {data:created,error:createError}=await db.from("gyste_profiles").upsert({user_id:user.id,display_name:name,username}).select().single();
if(createError)return authViewWithError("No se pudo crear tu perfil: "+createError.message);
p=created;
}
me={...me,...p};
await loadFollowing();
await renderTab();
}

// Obtiene enlaces temporales para medios del feed. Si el bucket continúa público,
// conserva compatibilidad con media_url cuando no exista media_path o falle la firma.
async function prepareMediaUrls(list){
const paths=[...new Set(list.map(p=>p.media_path).filter(Boolean))];
if(!paths.length)return;
const {data,error}=await db.storage.from(BUCKET).createSignedUrls(paths,MEDIA_SIGNED_URL_TTL);
if(error){
console.warn("No se pudieron generar enlaces firmados para medios:",error.message);
return;
}
(data||[]).forEach(item=>{
if(item.path&&item.signedUrl){
mediaUrlCache.set(item.path,{url:item.signedUrl,expiresAt:Date.now()+MEDIA_SIGNED_URL_TTL*1000});
}
});
}

function postMediaUrl(p){
if(p.media_path){
const cached=mediaUrlCache.get(p.media_path);
if(cached&&cached.expiresAt>Date.now()+60000)return cached.url;
}
return MEDIA_BUCKET_PRIVATE?"":(p.media_url||"");
}

async function feedView(){
const {data,error}=await db.from("posts")
.select("id,content,user_id,likes,created_at,media_url,media_type,media_path")
.order("created_at",{ascending:false}).limit(60);
if(error){shell(`<p class="error">No se pudo cargar el inicio: ${esc(error.message)}</p>`);return;}
posts=data||[];
mediaUrlCache.clear();
await prepareMediaUrls(posts);
const ids=posts.map(p=>p.id);
liked=new Set();
if(ids.length){
const {data:r,error:reactionError}=await db.from("reactions").select("post_id").eq("user_id",me.id).in("post_id",ids);
if(!reactionError)liked=new Set((r||[]).map(x=>x.post_id));
}
const authors=[...new Set(posts.map(p=>p.user_id))];
let names={};
if(authors.length){
const {data:u}=await db.from("gyste_profiles").select("user_id,display_name,username").in("user_id",authors);
(u||[]).forEach(x=>names[x.user_id]=x);
}
// El feed público conserva todas las publicaciones visibles según RLS.
// «Siguiendo» filtra únicamente las cuentas seguidas y la propia.
const visiblePosts=feedMode==="following"
  ? posts.filter(p=>p.user_id===me.id||following.has(p.user_id))
  : posts;
const cards=visiblePosts.map(p=>postCard(p,names[p.user_id])).join("");
shell(`
<section class="panel">
<h3>Comparte con la comunidad</h3>
<p class="muted">Tus publicaciones pueden aparecer en el inicio de otros miembros de Gyste.</p>
<textarea id="posttext" class="field" maxlength="5000" placeholder="Escribe una publicación…"></textarea>
<label class="muted">Foto o vídeo (máximo 50 MB)
<input id="media" class="field" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm">
</label>
<button id="publish" class="primary full">Publicar</button>
</section>
<section class="panel" aria-label="Filtros del inicio">
<div class="row">
<button type="button" class="${feedMode==="recent"?"primary":"secondary"}" data-feed-mode="recent">Comunidad · Recientes</button>
<button type="button" class="${feedMode==="following"?"primary":"secondary"}" data-feed-mode="following">Siguiendo</button>
<button type="button" class="secondary" id="findPeople">Descubrir personas</button>
</div>
<p class="muted">${feedMode==="following"?"Publicaciones tuyas y de personas a las que sigues.":"Publicaciones recientes de la comunidad, ordenadas por fecha."}</p>
</section>
<div id="feed">${cards||(feedMode==="following"?'<p class="muted">Todavía no hay publicaciones de las personas que sigues. En Descubrir puedes encontrar miembros.</p>':'<p class="muted">Aún no hay publicaciones disponibles. ¡Inicia la conversación!</p>')}</div>`);
document.getElementById("publish").onclick=publish;
document.querySelectorAll("[data-feed-mode]").forEach(b=>{b.onclick=()=>{feedMode=b.dataset.feedMode;feedView();};});
document.getElementById("findPeople").onclick=()=>{tab="explore";exploreView();};
document.querySelectorAll("[data-like]").forEach(b=>{b.onclick=()=>like(b.dataset.like);});
document.querySelectorAll("[data-comment-form]").forEach(f=>{f.onsubmit=sendComment;});
document.querySelectorAll("[data-comments]").forEach(b=>{b.onclick=()=>toggleComments(b.dataset.comments);});
document.querySelectorAll("[data-delete-post]").forEach(b=>{b.onclick=()=>deletePost(b.dataset.deletePost,b);});
}

function postCard(p,author){
const url=postMediaUrl(p);
const media=url?(p.media_type?.startsWith("video/")
?`<video class="media" controls playsinline preload="metadata" src="${esc(url)}"></video>`
:`<img class="media" loading="lazy" src="${esc(url)}" alt="Imagen compartida">`)
:(p.media_path||p.media_url?'<p class="muted">El archivo multimedia no está disponible temporalmente.</p>':"");
return `
<article class="post">
<div class="posthead"><span class="author">${esc(author?.display_name||"Miembro de Gyste")}</span><span>${time(p.created_at)}</span></div>
<div class="bodytext">${esc(p.content||"")}</div>
${media}
<div class="actions">
<button class="action ${liked.has(p.id)?"liked":""}" data-like="${esc(p.id)}">${liked.has(p.id)?"♥ Me gusta":"♡ Me gusta"} · ${Number(p.likes||0)}</button>
<button class="action" data-comments="${esc(p.id)}">Comentarios</button>
${p.user_id===me.id?`<button class="danger" data-delete-post="${esc(p.id)}" type="button">🗑 Eliminar</button>`:""}
</div>
<div id="comments-${esc(p.id)}" class="hidden"><div id="list-${esc(p.id)}"></div>
<form class="commentform" data-comment-form="${esc(p.id)}"><input class="field" maxlength="2000" placeholder="Escribe un comentario…" required><button class="primary">Enviar</button></form>
</div>
</article>`;
}

async function publish(){
const text=document.getElementById("posttext").value.trim();
const file=document.getElementById("media").files[0];
if(!text&&!file)return say("Escribe algo o elige una foto o vídeo.",true);
if(file&&(!["image/jpeg","image/png","image/webp","video/mp4","video/webm"].includes(file.type)||file.size>50*1024*1024))
return say("Formato no válido o archivo superior a 50 MB.",true);
const b=document.getElementById("publish");
b.disabled=true;b.textContent="Publicando…";
let path=null;
try{
let url=null;let type=null;
if(file){
const ext=(file.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"");
path=me.id+"/"+Date.now()+"-"+Math.random().toString(36).slice(2)+"."+ext;
const {error}=await db.storage.from(BUCKET).upload(path,file,{upsert:false,contentType:file.type});
if(error)throw error;
url=db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
type=file.type;
}
const {error}=await db.from("posts").insert({content:text,user_id:me.id,media_url:url,media_type:type,media_path:path});
if(error)throw error;
say("Publicación compartida.");
await feedView();
}catch(e){
if(path){const {error:removeError}=await db.storage.from(BUCKET).remove([path]);if(removeError)console.warn("No se pudo limpiar el archivo subido:",removeError.message);}
say("No se pudo publicar: "+(e?.message||"Error desconocido"),true);
const current=document.getElementById("publish");
if(current){current.disabled=false;current.textContent="Publicar";}
}
}


// Primero confirma el borrado de la fila; después limpia el archivo de Storage.
// Así, un fallo en la base de datos nunca deja una publicación con multimedia roto.
async function deletePost(id,button){
const post=posts.find(p=>String(p.id)===String(id));
if(!post)return say("No se encontró esta publicación. Actualiza el inicio.",true);
if(post.user_id!==me.id)return say("Solo puedes eliminar tus propias publicaciones.",true);
if(!confirm("¿Seguro que quieres eliminar esta publicación? Esta acción no se puede deshacer."))return;
if(button){button.disabled=true;button.textContent="Eliminando…";}
try{
  if(post.media_path&&!post.media_path.startsWith(me.id+"/")){
    throw new Error("La ruta multimedia no pertenece a tu cuenta. No se ha borrado nada.");
  }
  const {data,error}=await db.from("posts").delete().eq("id",id).eq("user_id",me.id).select("id").maybeSingle();
  if(error)throw new Error("No se pudo eliminar la publicación: "+error.message);
  if(!data)throw new Error("No se confirmó el borrado. Comprueba la política de eliminación en Supabase.");
  posts=posts.filter(p=>String(p.id)!==String(id));
  if(post.media_path){
    const {error:storageError}=await db.storage.from(BUCKET).remove([post.media_path]);
    if(storageError){
      console.warn("Publicación eliminada; limpieza multimedia pendiente:",storageError.message);
      say("Publicación eliminada. No se pudo limpiar su archivo multimedia; revisa Storage.",true);
    }else{
      mediaUrlCache.delete(post.media_path);
      say("Publicación eliminada.");
    }
  }else say("Publicación eliminada.");
  await feedView();
}catch(e){
  say(e?.message||"No se pudo eliminar la publicación.",true);
  if(button){button.disabled=false;button.textContent="🗑 Eliminar";}
}
}

async function like(id){
const p=posts.find(x=>x.id===id);if(!p)return;
const was=liked.has(id);
const q=was?db.from("reactions").delete().eq("post_id",id).eq("user_id",me.id):db.from("reactions").insert({post_id:id,user_id:me.id});
const {error}=await q;
if(error)return say(error.message,true);
await feedView();
}

async function toggleComments(id){
const box=document.getElementById("comments-"+id);if(!box)return;
box.classList.toggle("hidden");
if(!box.classList.contains("hidden"))await loadComments(id);
}

async function loadComments(id){
const list=document.getElementById("list-"+id);if(!list)return;
list.innerHTML='<p class="muted">Cargando comentarios…</p>';
const {data,error}=await db.from("gyste_comments").select("id,user_id,content,created_at").eq("post_id",id).order("created_at");
if(error){list.textContent="No se pudieron cargar los comentarios: "+error.message;return;}
const ids=[...new Set((data||[]).map(c=>c.user_id))];let map={};
if(ids.length){const {data:u}=await db.from("gyste_profiles").select("user_id,display_name").in("user_id",ids);(u||[]).forEach(x=>map[x.user_id]=x.display_name);}
list.innerHTML=(data||[]).map(c=>`<div class="comment"><b>${esc(map[c.user_id]||"Miembro")}</b><div>${esc(c.content)}</div><small>${time(c.created_at)}</small></div>`).join("")||'<p class="muted">Sé el primero en comentar.</p>';
}

async function sendComment(e){
e.preventDefault();const form=e.currentTarget;const id=form.dataset.commentForm;const input=form.querySelector("input");const content=input.value.trim();if(!content)return;
const {error}=await db.from("gyste_comments").insert({post_id:id,user_id:me.id,content});
if(error)return say("No se pudo comentar: "+error.message,true);
input.value="";await loadComments(id);say("Comentario publicado.");
}

async function exploreView(){
const {data,error}=await db.from("gyste_profiles").select("user_id,username,display_name,bio").neq("user_id",me.id).order("display_name").limit(100);
if(error){shell(`<p class="error">Error al descubrir personas: ${esc(error.message)}</p>`);return;}
profiles=data||[];
shell(`<section class="panel"><h3>Descubre personas</h3><input id="search" class="field" placeholder="Buscar por nombre o usuario…"></section><div id="people">${peopleHTML(profiles)}</div>`);
document.getElementById("search").oninput=e=>{const q=e.target.value.toLowerCase();document.getElementById("people").innerHTML=peopleHTML(profiles.filter(p=>(p.display_name+" "+p.username).toLowerCase().includes(q)));bindPeople();};
bindPeople();
}

function peopleHTML(list){
return list.map(p=>`<div class="userrow">
<div class="avatar">${esc((p.display_name||"G").slice(0,1).toUpperCase())}</div>
<div class="userinfo"><b>${esc(p.display_name)}</b><div class="muted">@${esc(p.username||"usuario")}</div><small>${esc(p.bio||"")}</small></div>
<button class="secondary" data-follow="${esc(p.user_id)}">${following.has(p.user_id)?"Siguiendo":"Seguir"}</button>
<button class="ghost" data-chat="${esc(p.user_id)}">Mensaje</button>
</div>`).join("")||'<p class="muted">No se encontraron personas.</p>';
}

function bindPeople(){
document.querySelectorAll("[data-follow]").forEach(b=>{b.onclick=()=>follow(b.dataset.follow);});
document.querySelectorAll("[data-chat]").forEach(b=>{b.onclick=()=>{chatUser=b.dataset.chat;tab="messages";messagesView();};});
}

async function follow(id){
const was=following.has(id);
const q=was?db.from("gyste_follows").delete().eq("follower_id",me.id).eq("followed_id",id):db.from("gyste_follows").insert({follower_id:me.id,followed_id:id});
const {error}=await q;if(error)return say(error.message,true);
was?following.delete(id):following.add(id);
await exploreView();say(was?"Has dejado de seguir a esta persona.":"Ahora sigues a esta persona.");
}

async function profileView(){
const {data:p,error}=await db.from("gyste_profiles").select("*").eq("user_id",me.id).single();
if(error){shell(`<p class="error">No se pudo cargar el perfil: ${esc(error.message)}</p>`);return;}
const [{count:followers},{count:followingCount}]=await Promise.all([
db.from("gyste_follows").select("*",{count:"exact",head:true}).eq("followed_id",me.id),
db.from("gyste_follows").select("*",{count:"exact",head:true}).eq("follower_id",me.id)
]);
shell(`<section class="panel"><h2>Mi perfil</h2><p class="muted">${followers||0} seguidores · ${followingCount||0} siguiendo</p>
<label>Nombre visible<input id="display" class="field" maxlength="60" value="${esc(p?.display_name||"")}"></label>
<label>Nombre de usuario<input id="username" class="field" maxlength="30" value="${esc(p?.username||"")}"></label>
<label>Biografía<textarea id="bio" class="field" maxlength="300">${esc(p?.bio||"")}</textarea></label>
<button id="saveprofile" class="primary full">Guardar perfil</button></section>`);
document.getElementById("saveprofile").onclick=saveProfile;
}

async function saveProfile(){
const display_name=document.getElementById("display").value.trim();
const username=document.getElementById("username").value.trim().toLowerCase();
const bio=document.getElementById("bio").value.trim();
if(!display_name||! /^[a-z0-9_]{3,30}$/.test(username))return say("El nombre es obligatorio y el usuario debe tener 3–30 letras, números o guion bajo.",true);
const b=document.getElementById("saveprofile");b.disabled=true;
const {data,error}=await db.from("gyste_profiles").update({display_name,username,bio,updated_at:new Date().toISOString()}).eq("user_id",me.id).select().single();
b.disabled=false;
if(error)return say("No se pudo guardar: "+error.message,true);
me={...me,...data};say("Perfil actualizado.");
}

async function notificationView(){
const {data,error}=await db.from("gyste_notifications").select("*").eq("user_id",me.id).order("created_at",{ascending:false}).limit(60);
if(error){shell(`<p class="error">No se pudieron cargar avisos: ${esc(error.message)}</p>`);return;}
shell(`<section class="panel"><h3>Notificaciones</h3>${(data||[]).map(n=>`<div class="userrow"><div class="userinfo">${esc(n.message)}<small class="muted">${time(n.created_at)}</small></div>${n.is_read?"":"<span class='author'>Nuevo</span>"}</div>`).join("")||'<p class="muted">Todavía no tienes notificaciones.</p>'}</section>`);
const unread=(data||[]).filter(n=>!n.is_read).map(n=>n.id);
if(unread.length){const {error:updateError}=await db.from("gyste_notifications").update({is_read:true}).in("id",unread);if(updateError)console.warn("No se pudieron marcar avisos como leídos:",updateError.message);}
}

async function messagesView(){
if(!chatUser){
const {data,error}=await db.from("gyste_messages").select("sender_id,recipient_id,content,created_at").or(`sender_id.eq.${me.id},recipient_id.eq.${me.id}`).order("created_at",{ascending:false}).limit(100);
if(error){shell(`<p class="error">No se pudieron cargar mensajes: ${esc(error.message)}</p>`);return;}
const ids=[...new Set((data||[]).map(m=>m.sender_id===me.id?m.recipient_id:m.sender_id))];let map={};
if(ids.length){const {data:u}=await db.from("gyste_profiles").select("user_id,display_name").in("user_id",ids);(u||[]).forEach(x=>map[x.user_id]=x.display_name);}
const unique=[...new Set(ids)];
shell(`<section class="panel"><h3>Conversaciones</h3>${unique.map(id=>`<div class="userrow"><b>${esc(map[id]||"Miembro")}</b><button class="secondary" data-openchat="${esc(id)}">Abrir conversación</button></div>`).join("")||'<p class="muted">Aún no tienes conversaciones. Ve a Descubrir para escribir a alguien.</p>'}</section>`);
document.querySelectorAll("[data-openchat]").forEach(b=>{b.onclick=()=>{chatUser=b.dataset.openchat;messagesView();};});
return;
}
const {data:person,error:personError}=await db.from("gyste_profiles").select("display_name").eq("user_id",chatUser).maybeSingle();
if(personError){shell(`<p class="error">No se pudo cargar el perfil: ${esc(personError.message)}</p>`);return;}
const {data,error}=await db.from("gyste_messages").select("*").or(`and(sender_id.eq.${me.id},recipient_id.eq.${chatUser}),and(sender_id.eq.${chatUser},recipient_id.eq.${me.id})`).order("created_at");
if(error){shell(`<p class="error">Error al abrir conversación: ${esc(error.message)}</p>`);return;}
shell(`<section class="panel"><button id="back" class="ghost">← Conversaciones</button><h3>${esc(person?.display_name||"Conversación")}</h3>
<div style="max-height:55vh;overflow:auto">${(data||[]).map(m=>`<div class="comment" style="text-align:${m.sender_id===me.id?"right":"left"}"><div>${esc(m.content)}</div><small>${time(m.created_at)}</small></div>`).join("")||'<p class="muted">Inicia la conversación.</p>'}</div>
<form id="sendmsg" class="commentform"><input id="msg" class="field" maxlength="5000" placeholder="Escribe un mensaje…" required><button class="primary">Enviar</button></form></section>`);
document.getElementById("back").onclick=()=>{chatUser=null;messagesView();};
document.getElementById("sendmsg").onsubmit=sendMessage;
const {error:readError}=await db.from("gyste_messages").update({read_at:new Date().toISOString()}).eq("recipient_id",me.id).eq("sender_id",chatUser).is("read_at",null);
if(readError)console.warn("No se pudieron marcar mensajes como leídos:",readError.message);
}

async function sendMessage(e){
e.preventDefault();const input=document.getElementById("msg");const content=input.value.trim();if(!content)return;
const {error}=await db.from("gyste_messages").insert({sender_id:me.id,recipient_id:chatUser,content});
if(error)return say("No se pudo enviar: "+error.message,true);
await messagesView();
}

async function start(){
try{
if(!window.supabase||typeof window.supabase.createClient!=="function"){
app.innerHTML='<section class="auth"><h1>Gyste</h1><p class="error">No se pudo cargar el servicio de conexión. Comprueba Internet y vuelve a intentarlo.</p><button class="primary full" id="retry">Reintentar</button></section>';
document.getElementById("retry").onclick=start;
return;
}
if(!db)db=window.supabase.createClient(URL_DB,KEY_DB,{
  auth:{
    persistSession:true,
    autoRefreshToken:true,
    detectSessionInUrl:true,
    storage:window.localStorage
  }
});
if(!authListener){
authListener=db.auth.onAuthStateChange((event,s)=>{
session=s;
if(event==="PASSWORD_RECOVERY"){
  recoveryPending=true;
  recoveryView();
  return;
}
// Un SIGNED_IN del enlace de recuperación no debe mostrar el feed.
if(recoveryPending){
  if(s)recoveryView();
  return;
}
if(!s){me=null;chatUser=null;authView();}
});
}
const result=await Promise.race([
db.auth.getSession(),
new Promise((_,reject)=>setTimeout(()=>reject(new Error("La conexión está tardando demasiado. Comprueba Internet y pulsa Reintentar.")),15000))
]);
const {data,error}=result;
if(error)throw error;
session=data.session;
if(recoveryPending){
  if(session)recoveryView();
  else {
    // Si el enlace ha expirado, permitir solicitar uno nuevo.
    recoveryPending=false;
    notice="El enlace de recuperación no se pudo validar. Solicita uno nuevo.";
    noticeError=true;
    authView();
  }
}else if(session)await boot();else authView();
}catch(e){
app.innerHTML=`<section class="auth"><h1>Gyste</h1><p class="error">${esc(e?.message||"No se pudo iniciar Gyste. Comprueba Internet.")}</p><button class="primary full" id="retry">Reintentar</button></section>`;
document.getElementById("retry").onclick=start;
}
}

// Renueva la vista del feed al volver a la app si los enlaces firmados están cerca de expirar.
document.addEventListener("visibilitychange",()=>{
if(document.visibilityState==="visible"&&session&&me&&tab==="feed"){
const expiring=[...mediaUrlCache.values()].some(x=>x.expiresAt<Date.now()+5*60*1000);
if(expiring)feedView();
}
});

start();
</script>
