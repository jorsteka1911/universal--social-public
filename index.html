.creator-photo-tile{min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:5px}
.creator-photo-tile canvas{display:block;width:100%;height:auto;aspect-ratio:9/16;object-fit:cover;border-radius:6px}
.creator-photo-tile small{display:block;text-align:center;margin:4px 0}
.creator-photo-tile .row{gap:3px}
.creator-photo-tile button{min-height:40px;padding:4px;font-size:12px}
/* Menú accesible en capa superior: el desplazamiento no mueve Inicio */
.gyste-menu-dialog{box-sizing:border-box;width:min(480px,calc(100% - 20px));max-width:none;max-height:calc(100vh - 30px);max-height:calc(100dvh - 30px);padding:0;border:1px solid var(--line);border-radius:18px;background:#10283a;color:#f1f7fb;overflow:hidden;box-shadow:0 20px 60px #0009}
.gyste-menu-dialog[open]{display:flex;flex-direction:column}
.gyste-menu-dialog::backdrop{background:#000a}
.gyste-menu-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 14px 9px;border-bottom:1px solid var(--line);flex-shrink:0}
.gyste-menu-head h2{margin:0;font-size:20px}
.gyste-menu-head button{min-width:44px;min-height:44px}
.gyste-menu-scroll{min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:4px 12px 16px}
.gyste-menu-scroll h3{font-size:12px;color:#a9c7d6;margin:15px 2px 8px}
.gyste-menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.gyste-menu-grid button{display:flex;align-items:center;gap:8px;text-align:left;min-height:56px;padding:9px;background:#19394d;border:1px solid #315469;color:#f1f7fb;border-radius:11px;font-size:12px;overflow-wrap:anywhere}
.gyste-menu-grid button span:first-child{font-size:18px;flex-shrink:0}
.gyste-menu-grid button:active{background:#275567}
@media(max-width:320px){.gyste-menu-grid{grid-template-columns:1fr}}
/* Estado de conexión y actualización */
.gyste-connection[hidden]{display:none!important}
.gyste-connection{border:1px solid #ad8147;background:#402e20;color:#ffdfad;padding:10px 12px;border-radius:10px;margin:8px 0;font-size:13px}
.gyste-update-panel{border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.gyste-update-panel summary{cursor:pointer;padding:8px 0;color:var(--mint);font-weight:750}
.gyste-update-panel button{min-height:44px;margin:4px 0}
.assist-actions{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.assist-actions button{font-size:12px;min-height:36px;padding:6px 9px}.assist-alert{border:1px solid #c99843;padding:8px;border-radius:8px}.assist-dialog{width:min(92vw,520px);max-height:85dvh;overflow:auto;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:16px}.assist-dialog button{margin:5px}.assist-large .bodytext,.assist-large .panel p,.assist-large .field{font-size:19px;line-height:1.55}.assist-xl .bodytext,.assist-xl .panel p,.assist-xl .field{font-size:23px;line-height:1.55}.assist-large button,.assist-xl button{min-height:44px}.assist-contrast{--txt:#fff!important;--muted:#fff!important;--bg:#000!important;--panel:#111!important;--line:#aaa!important;--mint:#7fffe8!important}.assist-contrast .panel,.assist-contrast .post,.assist-contrast .chat-bubble{background:#111!important;color:#fff!important;border-color:#aaa!important}.assist-motion *{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.assist-tools{overflow-wrap:anywhere}

/* Mobile interaction: prevent accidental contextual text search on controls and profile identity. */
@media (any-pointer:coarse){
  button,summary,.mobile-nav,.profile-face,.profile-cover,.profile-heading h2,.profile-heading p.muted,.profile-metrics{
    -webkit-user-select:none;user-select:none;
  }
  .profile-heading h2{font-size:clamp(18px,5.5vw,23px);line-height:1.25;overflow-wrap:anywhere}
  .profile-heading p.muted{font-size:14px;line-height:1.4;overflow-wrap:anywhere}
  .profile-photo-links button{min-height:44px}
  .profile-photo-links button:disabled{opacity:1;color:var(--muted);border-color:var(--line);cursor:default}
}
button,[role="button"],.notice-item,.chat-contact,.explore-person-actions{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}

const GYSTE_TIMING_LABELS={feed:"Inicio",videos:"Vídeos",reels:"Reels",messages:"Mensajes",profile:"Perfil",notifications:"Avisos",spaces:"Espacios",learn:"Aprender",feedback:"Sugerencias",startup:"Apertura",videoStart:"Inicio de reproducción de vídeo",reelStart:"Inicio de reproducción de Reel",videoBuffer:"Pausa de carga de vídeo",reelBuffer:"Pausa de carga de Reel"};

}
function recordGysteTiming(section,started){gysteTimings=addTiming(gysteTimings,section,performance.now()-started);}
function mediaTimingEvent(event,state,now,section){
 if(event==="play")return {state:{phase:"start",at:now,section},sample:null};
 if(event==="waiting"||event==="stalled")return {state:state?.phase==="playing"?{phase:"buffer",at:now,section}:state,sample:null};
 if(event==="playing"){
 const sample=state&&["start","buffer"].includes(state.phase)&&state.section===section?{key:(section==="reels"?"reel":"video")+(state.phase==="start"?"Start":"Buffer"),ms:now-state.at}:null;
 return {state:{phase:"playing",section},sample};
 }
 return {state:null,sample:null};
}
function observeVideoTiming(e){
 const video=e.target;if(!(video instanceof HTMLVideoElement))return;
 if(!session||!me||document.hidden){gysteMediaTimings.delete(video);return;}
 if(!["feed","videos","reels","messages","stories","profile","saved"].includes(tab)){gysteMediaTimings.delete(video);return;}
 const result=mediaTimingEvent(e.type,gysteMediaTimings.get(video),performance.now(),tab);
 if(result.state)gysteMediaTimings.set(video,result.state);else gysteMediaTimings.delete(video);
 if(result.sample&&video.isConnected){gysteTimings=addTiming(gysteTimings,result.sample.key,result.sample.ms);gysteRecordLinkSample(result.sample);}
}

 const form=document.getElementById("feedback-form");if(commercialInterest){const request=commercialInterest;commercialInterest=null;if(request.uid===uid){document.getElementById("feedback-category").value="other";document.getElementById("feedback-body").value=request.text;document.getElementById("feedback-result").textContent="Revisa el texto y envíalo solo si deseas manifestar interés. No se realizará ningún cobro.";}}const bodyInput=document.getElementById("feedback-body"),categoryInput=document.getElementById("feedback-category"),template=document.getElementById("feedback-bug-template"),out=document.getElementById("feedback-result"),submit=form.querySelector('[type="submit"]');
 if(safetyFeedbackRequest){const request=safetyFeedbackRequest;safetyFeedbackRequest=null;if(request.uid===uid){categoryInput.value="safety";out.textContent="Describe el problema sin incluir nombres de menores, contraseñas ni conversaciones privadas. La atención no es inmediata. Envía únicamente si lo deseas.";}}
 if(gysteFaultReport){const report=gysteFaultReport;gysteFaultReport=null;if(report.uid===uid){categoryInput.value="error";bodyInput.value=report.text;out.textContent="Revisa el informe técnico. Se enviará asociado a tu cuenta únicamente si pulsas Enviar sugerencia privada.";}}

 bodyInput.oninput=count;count();

 const body=bodyInput.value.trim(),category=categoryInput.value;
 if(!validateFeedback(category,body)||body===feedbackClaimTemplate||body===feedbackBugTemplate||body==="Versión: "+GYSTE_BUILD+"\n"+feedbackBugTemplate){out.textContent="Completa la descripción del problema o escribe una sugerencia de entre 10 y 2000 caracteres.";return;}

let authBusy=false;
function beginAuthAction(button,label){
 if(authBusy||!button||button.disabled)return null;
 authBusy=true;const ids=["login","signup","forgot","email","password","signup-confirm","signup-accept"],nodes=ids.map(id=>document.getElementById(id)).filter(Boolean),states=nodes.map(n=>n.disabled),oldLabel=button.textContent;
 nodes.forEach(n=>n.disabled=true);button.textContent=label;
 return ()=>{authBusy=false;nodes.forEach((n,i)=>n.disabled=states[i]);button.textContent=oldLabel;};
}

const button=document.getElementById("forgot"),finish=beginAuthAction(button,"Enviando…");if(!finish)return;

const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname});

say("Si existe una cuenta asociada a ese correo, recibirás un enlace de recuperación. Revisa también spam y ábrelo en este navegador.");
}catch(e){say("No se pudo enviar el correo de recuperación. Comprueba la configuración de URL de Supabase e inténtalo de nuevo.",true);}
finally{finish();}

const input=document.getElementById("newpassword"),repeat=document.getElementById("confirmnewpassword"),button=document.getElementById("savepassword"),uid=session?.user?.id;
if(!input||!repeat||!button||button.disabled)return;
if(!uid)return say("Abre el enlace de recuperación más reciente.",true);
const password=input.value,confirmation=repeat.value;
if(password.length<8)return say("La contraseña nueva debe tener al menos 8 caracteres.",true);
if(password!==confirmation)return say("Las contraseñas no coinciden. Escríbelas de nuevo.",true);
const current=()=>button.isConnected&&document.getElementById("savepassword")===button&&session?.user?.id===uid;
button.disabled=true;input.disabled=true;repeat.disabled=true;button.textContent="Guardando…";
let confirmed=false;
try{
 const {data,error}=await db.auth.updateUser({password});
 if(error)throw error;
 if(data?.user?.id!==uid)throw Error("Cambio no confirmado");
 confirmed=true;input.value="";repeat.value="";
 if(!current())return;
 window.history.replaceState({},document.title,window.location.pathname+window.location.search);
 const closeRecovery=async()=>{
  if(!current())return;
  button.disabled=true;button.textContent="Cerrando sesión…";
  try{
   const result=await db.auth.signOut();
   if(result.error)throw result.error;
   if(session?.user?.id&&session.user.id!==uid)return;
   session=null;me=null;chatUser=null;
   notice="Contraseña actualizada correctamente. Ya puedes usarla para entrar en Gyste.";noticeError=false;
   authView();say(notice,false);
  }catch{
   if(current()){say("Contraseña actualizada. No se ha podido confirmar el cierre de sesión. Pulsa Cerrar sesión de nuevo.",true);button.textContent="Cerrar sesión";button.disabled=false;button.onclick=closeRecovery;}
  }
 };
 await closeRecovery();
}catch{
 if(current()){
  say(confirmed?"Contraseña actualizada; vuelve a abrir Gyste para comprobar el acceso.":"No se pudo confirmar el cambio. Comprueba tu conexión o abre el enlace de recuperación más reciente.",true);
  if(!confirmed){button.disabled=false;input.disabled=false;repeat.disabled=false;button.textContent="Guardar contraseña";}
 }
}
}

function authMessage(error, mode){
  const raw=String(error?.message||"").toLowerCase();
  const code=String(error?.code||"").toLowerCase();
  if(raw.includes("invalid login credentials")||raw.includes("invalid_credentials")||code==="invalid_credentials")
    return "El correo o la contraseña no son correctos. Comprueba los datos e inténtalo de nuevo.";
  if(raw.includes("email not confirmed")||code==="email_not_confirmed")
    return "Tu correo todavía no está confirmado. Revisa tu bandeja de entrada y la carpeta de spam.";
  if(raw.includes("user already registered")||raw.includes("already registered")||raw.includes("user already exists")||code==="user_already_exists")
    return "Si ya tienes cuenta, pulsa Entrar o recupera la contraseña. Revisa también si recibiste un enlace de confirmación.";
  if(raw.includes("password should be at least")||raw.includes("password is too short"))
    return "La contraseña debe cumplir los requisitos de seguridad del servicio (elige al menos 8 caracteres).";
  if(raw.includes("rate limit")||raw.includes("too many requests")||code.includes("rate_limit"))
    return "Has realizado demasiados intentos. Espera un poco y vuelve a intentarlo.";
  if(raw.includes("network")||raw.includes("fetch")||raw.includes("timeout"))
    return "No se pudo conectar. Comprueba Internet y vuelve a intentarlo.";
  return mode==="login" ? "No se pudo iniciar sesión. Comprueba tus datos e inténtalo de nuevo." : "No se pudo crear la cuenta. Revisa los datos e inténtalo de nuevo.";
}

function validEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

async function login(){
  const email=document.getElementById("email").value.trim().toLowerCase();
  const password=document.getElementById("password").value;
  const button=document.getElementById("login");
  if(!validEmail(email))return say("Escribe un correo electrónico válido.",true);
  if(!password)return say("Escribe tu contraseña.",true);
  const finish=beginAuthAction(button,"Entrando…");if(!finish)return;
  try{
    const {data,error}=await db.auth.signInWithPassword({email,password});
    if(error)throw error;
    if(!data.session)throw new Error("No se pudo establecer la sesión. Inténtalo de nuevo.");
    session=data.session;
    await boot();
  }catch(error){
    gysteFault("acceso",error);say(authMessage(error,"login"),true);
  }finally{
    finish();
  }
}

async function signup(){
  const email=document.getElementById("email").value.trim().toLowerCase();
  const password=document.getElementById("password").value;
  const button=document.getElementById("signup");
  if(!validEmail(email))return say("Escribe un correo electrónico válido.",true);
  if(password.length<8)return say("Para crear una cuenta, elige una contraseña de al menos 8 caracteres.",true);
  const confirmation=document.getElementById("signup-confirm");
  if(!confirmation||confirmation.value!==password)return say("Las contraseñas no coinciden. Repite la contraseña antes de crear tu cuenta.",true);
  if(!document.getElementById("signup-accept")?.checked)return say("Lee las normas de convivencia y la información de privacidad antes de registrarte.",true);
  if(!document.getElementById("signup-adult")?.checked)return say("El piloto está reservado a personas adultas invitadas.",true);
  const finish=beginAuthAction(button,"Creando cuenta…");if(!finish)return;
  try{
    const {data,error}=await db.auth.signUp({email,password});
    if(error)throw error;
    confirmation.value="";
    // Supabase puede devolver identidades vacías cuando el correo ya existe,
    // para evitar revelar información de cuentas a terceros.
    if(data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0){
      say("Si puedes acceder con ese correo, pulsa Entrar. Si necesitas recuperar la contraseña, utiliza la opción correspondiente. Si recibes un enlace de confirmación, ábrelo.");
      return;
    }
    if(data.session){
      session=data.session;
      await boot();
    }else{
      say("Solicitud de registro recibida. Si Supabase requiere confirmar el correo, revisa tu bandeja de entrada y spam.");
    }
  }catch(error){
    gysteFault("registro",error);say(authMessage(error,"signup"),true);
  }finally{
    finish();
  }
}

let gysteLogoutBusy=false;
async function logout(){
 if(gysteLogoutBusy||!confirmNavigationDraft())return;
 const uid=me?.id;if(!uid)return;
 gysteLogoutBusy=true;
 try{
  let jobs=null;
  try{jobs=await pendingList(uid);}catch{}
  if(me?.id!==uid||session?.user?.id!==uid)return;
  if(jobs?.length){
   const choice=await choosePendingLogout(jobs.length);
   if(choice==="cancel"||me?.id!==uid||session?.user?.id!==uid)return;
   if(choice==="clear"){
    if(!confirm("Se eliminarán "+jobs.length+" copias pendientes de este dispositivo. No se borrarán publicaciones ni mensajes ya enviados. ¿Continuar?"))return;
    try{await clearAccountPending(uid);}catch{return say("No se pudo confirmar el borrado de las copias locales. No se ha cerrado la sesión.",true);}
    if(me?.id!==uid||session?.user?.id!==uid)return;
   }
  }else if(jobs===null&&!confirm("No se pudo comprobar si hay archivos pendientes en este dispositivo. Cerrar sesión no los elimina. ¿Continuar?"))return;
  const {error}=await db.auth.signOut();if(error)return say("No se pudo cerrar sesión. Comprueba la conexión.",true);
  gysteFaultScope(null);gysteFaults.clear();session=null;me=null;chatUser=null;tab="feed";sharedPostId=null;selectedSpaceId=null;homeFilter="all";authView();
 }finally{gysteLogoutBusy=false;}
}
function choosePendingLogout(count){
 return new Promise(resolve=>{
  const d=document.createElement("dialog");d.className="assist-dialog";
  d.setAttribute("aria-label","Copias pendientes al cerrar sesión");
  const title=document.createElement("h2");title.textContent="Archivos pendientes";
  const p=document.createElement("p");p.textContent="Tienes "+count+" envíos pendientes guardados en este dispositivo. Si es compartido, recomendamos quitar esas copias. No están cifradas por Gyste.";
  d.append(title,p);
  let selected="cancel";
  for(const [value,label] of [["keep","Conservar y cerrar sesión"],["clear","Borrar copias y cerrar sesión"],["cancel","Cancelar"]]){
   const b=document.createElement("button");b.type="button";b.className="secondary full";b.textContent=label;b.onclick=()=>{selected=value;d.close();};d.append(b);
  }
  d.addEventListener("close",()=>{d.remove();resolve(selected);},{once:true});
  document.body.append(d);d.showModal();
 });
}

// Start independent reads together, but never render them before server identity validation.
let bootEpoch=0;
function beginBootReads(client,uid,readFollowing,readSpaces){
 const auth=Promise.resolve().then(()=>client.auth.getUser());
 const preload=Promise.all([
 Promise.resolve().then(()=>client.from("gyste_profiles").select("*").eq("user_id",uid).maybeSingle()),
 Promise.resolve().then(()=>readFollowing(uid)),
 Promise.resolve().then(()=>readSpaces())
 ]).then(value=>({value}),()=>({value:null}));
 return {auth,preload};
}
async function boot(){
const expectedUid=session?.user?.id,epoch=++bootEpoch;
if(!expectedUid){me=null;return authView();}
const current=()=>epoch===bootEpoch&&session?.user?.id===expectedUid;
const reads=beginBootReads(db,expectedUid,readFollowing,readSpaces);
const {data:{user},error}=await reads.auth;
if(!current())return;
if(error||!user){session=null;me=null;return authView();}
if(user.id!==expectedUid)return;
gysteFaultScope(user.id);me={id:user.id,email:user.email};
const active=()=>current()&&me?.id===user.id;
const editorialSync=syncEditorial(user.id).catch(()=>false);
const loaded=await reads.preload;
if(!active())return;
if(!loaded.value)return authViewWithError("No se pudo completar la carga inicial. Comprueba tu conexión y vuelve a entrar.");
const [profileResult,followingResult,spacesResult]=loaded.value;
let {data:p,error:profileError}=profileResult;
if(profileError)return authViewWithError("No se pudo cargar tu perfil: "+profileError.message);
if(!p){
const name="Miembro de Gyste "+user.id.slice(0,6);
const username="gyste_"+user.id.replace(/-/g,"").slice(0,16);
const {data:created,error:createError}=await db.from("gyste_profiles").upsert({user_id:user.id,display_name:name,username}).select().single();
if(!active())return;
if(createError)return authViewWithError("No se pudo crear tu perfil: "+createError.message);
p=created;
}
me={...me,...p};
applyWallpaper(readWallpaper(me.id));
applyFollowingResult(followingResult);
applySpacesResult(spacesResult);
const requestedPost=new URLSearchParams(location.search).get("post");
if(requestedPost&&/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(requestedPost)){sharedPostId=requestedPost;tab="feed";selectedSpaceId=null;homeFilter="all";}
await renderTab();
void editorialSync.then(ok=>{if(ok&&active())refreshEditorialButtons();}).catch(()=>{});
}

,{group:"Dibujo",name:"Boca y labios: forma, expresión y sombra",level:"Clase guiada",steps:["Dibuja una línea suave entre las dos comisuras; marca el centro.","Traza el arco de Cupido en el labio superior, que suele tener dos elevaciones.","Construye el labio inferior como un volumen curvo; evita una línea oscura continua.","Oscurece la separación entre labios y añade sombra debajo del inferior.","Para una sonrisa, eleva las comisuras y observa cómo cambian las mejillas.","Práctica: boca neutra, sonrisa y expresión de sorpresa."]}
,{group:"Dibujo",name:"Cabello y orejas: formas antes de detalles",level:"Clase guiada",steps:["Marca primero la masa general del cabello y la dirección de crecimiento.","Separa el cabello en mechones grandes; reserva bandas de luz.","Oscurece raíces y zonas interiores, sin dibujar cada pelo.","Coloca las orejas aproximadamente entre la línea de cejas y la base de la nariz en un rostro frontal adulto.","Dibuja borde externo, antihélix y lóbulo observando la referencia.","Práctica: tres peinados y dos orejas desde distintos ángulos."]}
,{group:"Cuero",name:"Costura de guarnicionero: dos agujas",level:"Clase guiada",steps:["Corta dos retales de cuero curtido y marca una línea paralela al borde, a unos 3–4 mm.","Señala orificios regulares con tenedor de costura y perfora sobre base adecuada.","Enhebra una aguja en cada extremo del mismo hilo encerado.","Pasa una aguja por el primer orificio y centra el hilo; cruza las agujas en cada agujero sin perforar el hilo.","Mantén tensión uniforme sin deformar el cuero; remata con dos o tres puntadas hacia atrás.","Práctica: cose 10 cm rectos y comprueba que las puntadas tienen igual inclinación."]}
,{group:"Pintura",name:"Mezclar colores sin ensuciar la paleta",level:"Clase guiada",steps:["Prepara rojo, amarillo, azul, blanco y un soporte para hacer pruebas.","Mezcla amarillo con azul en proporciones 3:1, 1:1 y 1:3 y compara los verdes.","Mezcla rojo con amarillo para crear naranjas cálidos y fríos.","Añade pequeñas cantidades del complementario para neutralizar sin recurrir siempre al negro.","Crea una escala de cinco valores de un color añadiendo blanco progresivamente.","Práctica: pinta una manzana usando únicamente cinco mezclas propias."]}
,{group:"Madera y manualidades",name:"Tallado de una hoja en relieve",level:"Clase guiada",steps:["Dibuja una hoja de 8 cm sobre una tabla blanda fijada con sargentos.","Marca el contorno y las nervaduras; mantén las manos fuera de la trayectoria de la herramienta.","Rebaja el fondo poco a poco alrededor de la hoja, sin intentar retirar toda la madera de una vez.","Redondea la superficie de la hoja siguiendo su forma natural.","Marca las nervaduras con cortes superficiales y suaviza con lija.","Práctica: crea dos hojas con profundidades diferentes y compara las sombras."]}

const professionalCourses=[{"group": "Dibujo académico", "title": "Retrato realista: método de observación", "level": "Avanzado · 6 sesiones", "steps": ["Prepara una referencia propia con luz lateral única, papel A3, HB, 2B, 4B, goma maleable y difumino limpio. Delimita el encuadre con cuatro marcas; evita dibujar de memoria.", "Bloquea la silueta del cráneo con líneas rectas provisionales; mide alto/ancho con el lápiz extendido y compara ángulos de mandíbula y sienes.", "Marca eje de simetría y dirección de cejas, base nasal y boca según el modelo; comprueba alineaciones verticales con una plomada. No impongas proporciones estándar a un rostro individual.", "Modela las órbitas: sombreado de cuencas, planos de frente y pómulos. Trabaja cinco valores de grafito; reserva el papel para los brillos.", "Ojos: observa el grosor del párpado, el solapamiento del iris, la sombra del párpado superior y la dirección de las pestañas. Nariz: pinta planos de luz y sombra, no dos líneas laterales.", "Boca: mide distancia entre comisuras, arco de Cupido y sombra bajo labio inferior. Cabello: organiza masas oscuras y reflejos; deja los mechones sueltos para el final.", "Termina corrigiendo semejanza, valores y bordes duros/blandos. Fotografía el dibujo en blanco y negro para comparar contraste con la referencia."]}, {"group": "Dibujo académico", "title": "Ojo humano: estudio anatómico en grafito", "level": "Intermedio · 90 minutos", "steps": ["Trabaja a partir de una fotografía nítida de un ojo real, con párpado y ceja visibles; marca la distancia entre lagrimal y comisura externa.", "Dibuja primero la forma del globo bajo los párpados, no un símbolo de almendra. Observa que el párpado superior suele ocultar parte del iris.", "Traza el grosor del borde palpebral; ubica lagrimal, pliegue superior y bolsas suaves del inferior según el modelo.", "Construye el iris con un círculo en perspectiva; deja sin grafito el reflejo de la luz y oscurece pupila y borde superior.", "Aplica cinco valores: blanco de brillo, piel iluminada, semitono, sombra del pliegue y pupila. Evita contornos uniformes.", "Dibuja pestañas en grupos de diferente longitud y dirección; suaviza las transiciones con grafito, no con el dedo.", "Compara con la foto a distancia de un brazo; corrige tamaño del iris, inclinación y volumen del párpado."]}, {"group": "Dibujo académico", "title": "Nariz y labios: planos, textura y expresiones", "level": "Intermedio · 2 sesiones", "steps": ["Observa un rostro real frontal y otro de tres cuartos. Encaja el volumen nasal como puente, punta y alas sin marcar líneas definitivas.", "Dibuja la sombra proyectada bajo la punta; distingue el plano lateral iluminado de la aleta y el interior de las fosas nasales.", "Para labios, mide ancho y altura respecto a la nariz. Construye primero la abertura entre los labios y luego sus volúmenes.", "Sombrea el labio superior y la sombra bajo el inferior según la luz. Reserva reflejos y evita contornear todo con negro.", "Repite la misma boca en gesto neutro y sonrisa; observa cómo se elevan comisuras y mejillas.", "Compara tus resultados con el modelo: semejanza, bordes, simetría natural y gradación de valores."]}, {"group": "Pintura profesional", "title": "Óleo: retrato por capas y control de valores", "level": "Avanzado · 4 sesiones", "steps": ["Ventila el espacio y revisa las indicaciones de pigmentos y disolventes; usa productos al agua cuando sea posible. Prepara soporte imprimado y referencia propia.", "Haz una grisalla monocroma: identifica cinco valores antes de introducir color; deja secar según el material.", "Construye mezclas de temperatura cálida/fría sin asumir un color de piel único. Compara cada mezcla con la referencia a la misma luz.", "Pinta grandes masas de frente, mejillas, mandíbula y cuello; corrige proporciones antes de los detalles.", "Añade capas finas siguiendo compatibilidad del fabricante y tiempo de secado; evita empastar zonas que necesitan bordes suaves.", "Finaliza con reflejos selectivos y una evaluación de semejanza, armonía cromática y contraste."]}, {"group": "Pintura profesional", "title": "Acuarela: arquitectura urbana y perspectiva", "level": "Intermedio · 3 sesiones", "steps": ["Elige una fotografía autorizada de una calle; dibuja horizonte y puntos de fuga antes de humedecer el papel.", "Prepara tres lavados de valor con el mismo pigmento para estudiar transparencia y control de agua.", "Pinta cielo y fachadas grandes con húmedo sobre húmedo, reservando luces del papel.", "Cuando seque, añade puertas, sombras proyectadas y detalles con pincel fino sobre seco.", "Corrige profundidad mediante contraste y temperatura: más contraste en primer plano, menos al fondo.", "Crea una segunda versión con otra hora del día y compara sombras y atmósfera."]}, {"group": "Escultura profesional", "title": "Busto anatómico en arcilla: del armazón al retrato", "level": "Avanzado · 6 sesiones", "steps": ["Prepara fotografías autorizadas frontal, perfil y tres cuartos; toma medidas relativas de altura craneal, mandíbula y cuello.", "Elige arcilla y soporte según su proceso de secado/cocción; si lleva armazón, comprueba compatibilidad con el horno y retíralo cuando sea necesario.", "Bloquea cráneo, cuello y hombros con masas grandes; gira la pieza cada pocos minutos para comprobar la silueta desde cuatro vistas.", "Sitúa plano frontal, temporales, pómulos y mandíbula; no modeles ojos ni labios antes de fijar el volumen de la cabeza.", "Construye cavidades orbitarias y volumen nasal; agrega párpados como láminas con grosor, no ojos dibujados sobre la superficie.", "Modela boca y orejas observando profundidad y asimetrías. Trabaja el cabello en masas; usa herramientas para bordes y transiciones.", "Vacía la pieza si la arcilla y el tamaño lo requieren, deja espesor uniforme y orificios de ventilación siguiendo la técnica de cocción.", "Documenta la obra desde frente, perfil y tres cuartos; evalúa semejanza, estabilidad, grietas y acabado."]}, {"group": ensión para que las piezas no se deformen.", "Monta el panel en un monedero o cartera y refuerza reverso, cierres y bordes."]}, {"group": "Carpintería y artesanía", "title": "Talla escultórica de madera: hoja en bajo relieve", "level": "Intermedio · 3 sesiones", "steps": ["Selecciona madera blanda seca y sin grietas; fija la tabla con sargentos y usa protección adecuada.", "Transfiere un dibujo botánico real; decide fondo, plano intermedio y nervaduras antes de cortar.", "Rebaja el fondo con gubia en pasadas cortas siguiendo veta y siempre alejando el filo del cuerpo.", "Modela la curvatura de cada hoja con cortes progresivos; observa sombras bajo una luz lateral.", "Lija solo donde sea adecuado para conservar aristas; aplica acabado compatible y documenta el proceso."]}, {"group": "Carpintería y artesanía", "title": "Marquetería: panel geométrico de precisión", "level": "Avanzado · 4 sesiones", "steps": ["Dibuja el patrón a escala 1:1 con líneas de corte y sentido de la veta.", "Elige chapas con diferentes tonos y orientación; etiqueta cada pieza por su posición.", "Corta sobre base de seguridad con cuchilla apropiada; ensambla en seco y corrige huecos.", "Fija con cinta de marquetería y encola sobre soporte plano, prensando de forma uniforme.", "Retira cinta y lija con cuidado de no atravesar la chapa; aplica acabado y revisa juntas."]}];

const STORY_BUCKET="gyste-story-media";
let storyExpiryTimer=null;
function stopStoryTimer(){if(storyExpiryTimer!==null){clearInterval(storyExpiryTimer);storyExpiryTimer=null;}}
async function storiesView(){
 stopStoryTimer();
 const uid=me.id;
 const {data,error}=await db.from("gyste_stories").select("id,user_id,content,audience,media_path,media_type,created_at,expires_at").order("created_at",{ascending:false}).limit(80);
 if(tab!=="stories"||me?.id!==uid)return;
 if(error){shell(`<section class="panel"><h2>Historias</h2><p class="error">${esc(error.message)}</p></section>`);return;}
 const items=data||[],ids=[...new Set(items.map(s=>s.user_id))],names={},urls={};
 if(ids.length){const {data:p}=await db.from("gyste_profiles").select("user_id,display_name,avatar_url").in("user_id",ids);(p||[]).forEach(x=>names[x.user_id]=x);}
 const paths=items.map(x=>x.media_path).filter(Boolean);
 if(paths.length){const {data:m}=await db.storage.from(STORY_BUCKET).createSignedUrls(paths,60);(m||[]).forEach(x=>{if(x.path&&x.signedUrl)urls[x.path]=x.signedUrl;});}
 if(tab!=="stories"||me?.id!==uid)return;
 shell(`<section class="panel"><h2>⏳ Historias de 24 horas</h2><p>Comparte un momento con texto, foto o vídeo. Tu historia deja de aparecer tras 24 horas.</p><form id="story-form"><textarea id="story-text" class="field" maxlength="1000" placeholder="¿Qué estás haciendo hoy?"></textarea><label>Quién puede verla<select id="story-audience" class="field"><option value="mutual" selected>Seguimiento mutuo</option><option value="members">Miembros de Gyste</option><option value="only_me">Solo yo</option></select></label><label>Foto o vídeo (máximo 50 MB)<input type="file" id="story-file" class="field" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm"></label><button class="primary full" id="story-publish">Publicar historia</button><p id="story-status" role="status"></p></form></section>${items.map(s=>`<article class="post" data-story="${esc(s.id)}" data-expires="${esc(s.expires_at)}"><div class="posthead"><b>${esc(names[s.user_id]?.display_name||"Miembro")}</b><small>Caduca en ${Math.max(0,Math.ceil((new Date(s.expires_at)-Date.now())/3600000))} h</small></div><div class="bodytext">${esc(s.content)}</div>${s.media_path?urls[s.media_path]?`<div class="media-frame">${s.media_type?.startsWith("video/")?`<video class="media" controls playsinline preload="metadata" src="${esc(safeMediaUrl(urls[s.media_path]))}"></video>`:`<img class="media" alt="Historia" src="${esc(safeMediaUrl(urls[s.media_path]))}" loading="lazy">`}<button class="media-expand" type="button">⛶ Ampliar</button></div>`:'<p class="muted">Archivo temporalmente no disponible.</p>':""}${s.user_id===uid?`<button class="secondary" data-delete-story="${esc(s.id)}">Eliminar historia</button>`:""}</article>`).join("")||'<p class="panel muted">Todavía no hay historias. Publica la primera.</p>'}<button class="secondary full" id="refresh-stories">Actualizar historias</button>`);
 bindMediaActions();
 document.getElementById("refresh-stories").onclick=storiesView;
 storyExpiryTimer=setInterval(()=>{if(tab!=="stories"||!document.getElementById("story-form")){stopStoryTimer();return;}app.querySelectorAll("[data-expires]").forEach(n=>{if(Date.parse(n.dataset.expires)<=Date.now())n.remove();});},10000);
 app.querySelectorAll("[data-delete-story]").forEach(b=>b.onclick=async()=>{if(!confirm("¿Eliminar esta historia?"))return;const s=items.find(x=>x.id===b.dataset.deleteStory);if(!s)return;b.disabled=true;const {error}=await db.from("gyste_stories").delete().eq("id",s.id).eq("user_id",uid);if(error){say("No se pudo eliminar.",true);b.disabled=false;return;}if(s.media_path)await db.storage.from(STORY_BUCKET).remove([s.media_path]);say("Historia eliminada.");await storiesView();});
 document.getElementById("story-form").onsubmit=async e=>{
 e.preventDefault();const b=document.getElementById("story-publish"),status=document.getElementById("story-status"),content=document.getElementById("story-text").value.trim(),audience=document.getElementById("story-audience").value,file=document.getElementById("story-file").files[0];
 if(b.disabled||(!file&&!content))return;if(file&&(!MEDIA_TYPES.includes(file.type)||file.size>MAX_POST_BYTES)){status.textContent="Formato incompatible o archivo superior a 50 MB.";return;}
 b.disabled=true;let path=null,committed=false;try{const id=crypto.randomUUID();
 if(file){const ext=({"image/jpeg":"jpg","image/png":"png","image/webp":"webp","video/mp4":"mp4","video/webm":"webm"})[file.type];path=uid+"/"+id+"."+ext;status.textContent="Subiendo archivo…";const {error}=await db.storage.from(STORY_BUCKET).upload(path,file,{contentType:file.type,upsert:false});if(error)throw error;}
 const {error}=await db.from("gyste_stories").insert({id,user_id:uid,content,audience,media_path:path,media_type:file?.type||null});if(error)throw error;committed=true;say("Historia publicada durante 24 horas.");if(tab==="stories")await storiesView();
 }catch(e){if(path&&!committed)await db.storage.from(STORY_BUCKET).remove([path]);status.textContent="No se pudo publicar la historia.";}finally{b.disabled=false;}
 };
}

async function syncEditorial(uid){
 const state=editorialState(uid);
 if(!editorialActive(state))return false;
 if(state.loading)return state.loading;
 if(state.busy)return state.ready;
 state.loading=(async()=>{
 try{
  const known=GYSTE_EDITORIAL.map(n=>n.noteId);
  const {data,error}=await db.from("gyste_editorial_bookmarks").select("note_id").eq("user_id",uid).in("note_id",known);
  if(error||!editorialActive(state))throw Error("sync");
  const ids=new Set((data||[]).map(x=>x.note_id).filter(id=>known.includes(id)));
  const legacy=editorialLocal(uid),missing=[...legacy].filter(id=>!ids.has(id));
  if(missing.length){
   const {error:importError}=await db.from("gyste_editorial_bookmarks").upsert(missing.map(note_id=>({user_id:uid,note_id})),{onConflict:"user_id,note_id",ignoreDuplicates:true});
   if(importError||!editorialActive(state))throw Error("import");
   missing.forEach(id=>ids.add(id));
  }
  if(!editorialActive(state))return false;
  if(legacy.size){try{localStorage.removeItem(editorialSavedKey(uid));}catch{}}
  state.ids=ids;state.ready=true;return true;
 }catch{state.ready=false;return false;}
 })();
 try{return await state.loading;}finally{state.loading=null;}
}

function cleanCreatorProject(raw){
 if(!raw||raw.version!==1||!raw.fields||!raw.options)return null;
 const fields={},options={};
 for(const [k,max] of Object.entries(CREATOR_PROJECT_FIELDS)){if(typeof raw.fields[k]!=="string"||raw.fields[k].length>max)return null;fields[k]=raw.fields[k];}
 for(const [k,allowed] of Object.entries(CREATOR_PROJECT_OPTIONS)){const optional=["reel-transition","reel-font","reel-text-size","reel-text-position","reel-text-motion"];const value=optional.includes(k)&&raw.options[k]===undefined?allowed[0]:raw.options[k];if(!allowed.includes(value))return null;options[k]=value;}
 return {version:1,fields,options};
}
function parseCreatorAIPlan(raw){
 if(typeof raw!=="string"||raw.length>12000)return null;
 let value;try{value=JSON.parse(raw.trim().replace(/^\x60\x60\x60(?:json)?\s*/i,"").replace(/\s*\x60\x60\x60$/,""));}catch{return null;}
 if(!value||!Array.isArray(value.scenes)||value.scenes.length<1||value.scenes.length>20||value.scenes.some(x=>typeof x!=="string"||!x.trim()||x.trim().length>110||/[\r\n]/.test(x.trim()))||typeof value.caption!=="string"||value.caption.length>5000)return null;
 const scenes=value.scenes.map(x=>x.trim()),text=scenes.join("\n");if(text.length>1200)return null;
 return {scenes,text,caption:value.caption.trim()};
}

 video.addEventListener("play",buffering);

 video.addEventListener("playing",()=>{if(!failed&&!video.paused&&!video.ended)write("⏸ Pausar","Reproduciendo");});

 shell(`<section class="panel"><h2>Historia documental · La Habana y el mundo</h2><p>Referencias documentales para consulta; las fichas y licencias individuales aún necesitan validación. Las fotografías y reproducciones se sirven desde Wikimedia Commons: requieren conexión y su carga no está garantizada. Si alguna falla, no se sustituye por imágenes generadas.</p><p>Para el siglo XVIII se conservan mapas, pinturas y grabados, <b>no fotografías</b>. La fotografía se desarrolló durante el siglo XIX.</p></section><section class="panel"><h2>La Habana histórica</h2><div class="archive-grid">${cards}</div><p>También puedes consultar el <a href="https://www.loc.gov/resource/det.4a06698/" target="_blank" rel="noopener noreferrer">registro de una panorámica de La Habana de 1904 (Biblioteca del Congreso)</a>.</p></section><section class="panel"><h2>Explora archivos por región</h2><p><a target="_blank" rel="noopener noreferrer" href="https://commons.wikimedia.org/wiki/Category:Havana_in_the_1900s">La Habana de 1900</a> · <a target="_blank" rel="noopener noreferrer" href="https://commons.wikimedia.org/wiki/Category:Old_maps_of_Havana">Mapas antiguos de La Habana</a> · <a target="_blank" rel="noopener noreferrer" href="https://www.loc.gov/pictures/">Estados Unidos</a> · <a target="_blank" rel="noopener noreferrer" href="https://www.europeana.eu/">Europa</a> · <a target="_blank" rel="noopener noreferrer" href="https://www.ndl.go.jp/en/">Asia: Biblioteca Nacional de Japón</a></p></section><section class="panel"><h2>🔎 Tecnologías olvidadas</h2><p>Inventos del pasado que anticiparon el futuro. Consulta documentos históricos y compara prototipos con tecnologías actuales.</p><article class="archive-card"><h3>1900 · Automóviles eléctricos</h3><p>El Riker eléctrico de alrededor de 1900 se conserva en el Smithsonian.</p><a href="https://www.si.edu/object/riker-electric-automobile-ca-1900%3Anmah_840488" target="_blank" rel="noopener noreferrer">Consultar fuente original · Smithsonian</a></article><article class="archive-card"><h3>1906 · Patines con motor</h3><p>Scientific American documentó patines motorizados en abril de 1906.</p><a href="https://www.scientificamerican.com/article/motor-roller-skates/" target="_blank" rel="noopener noreferrer">Consultar fuente original · Scientific American</a></article><article class="archive-card"><h3>1918 · Patinete Autoped</h3><p>El Smithsonian conserva este vehículo motorizado fabricado en Nueva York.</p><a href="https://www.si.edu/object/nmah_746073" target="_blank" rel="noopener noreferrer">Consultar fuente original · Smithsonian</a></article><article class="archive-card"><h3>1925 · Automóvil radiocontrolado</h3><p>TIME documentó un coche conducido a distancia desde otro vehículo; no era autónomo en el sentido actual.</p><a href="https://time.com/archive/6653944/science-radio-auto/" target="_blank" rel="noopener noreferrer">Consultar fuente original · TIME, 10 de agosto de 1925</a></article><h3>Canales externos de curiosidades históricas</h3><p>Estos canales presentan historias e interpretaciones sobre inventos olvidados. Son independientes de Gyste; sus afirmaciones no han sido verificadas individualmente.</p><p><a href="https://www.youtube.com/channel/UCZDGFY74Zb16TEivl5xIjpA" target="_blank" rel="noopener noreferrer">Tecnología Olvidada</a> · <a href="https://www.youtube.com/channel/UCq6mA2UolG8cGSPDczflbkQ" target="_blank" rel="noopener noreferrer">Olvidada</a></p><p class="muted">Investiga por qué se abandonó cada invento: costes, competencia, decisiones empresariales y limitaciones técnicas. Distingue los documentos de las hipótesis; no todas las explicaciones tienen el mismo respaldo.</p></section><section class="panel"><h2>La Edad de Hielo: una investigación real</h2><p>Durante el Pleistoceno se sucedieron fases glaciares e interglaciares. En el último máximo glacial, hace aproximadamente 26.500–19.000 años, grandes mantos de hielo cubrieron zonas del norte de Europa y América. El mar estaba a un nivel inferior y hubo estepas frías habitadas por mamuts, bisontes y otros animales. No todo el planeta estaba congelado.</p><p><b>Cómo se sabe:</b> los científicos analizan testigos de hielo, sedimentos, polen fósil, huesos y cambios en la distribución de especies. Una imagen de esa época solo puede ser una reconstrucción científica o artística, nunca una fotografía.</p><p><b>Actividad:</b> compara un mapa del último máximo glacial con un mapa actual; identifica tres diferencias y explica qué evidencia permite deducirlas.</p></section>`);
 app.querySelectorAll(".historic-expand").forEach(b=>{const image=b.parentElement.querySelector("img");b.onclick=()=>openPhotoViewer(image);image.style.cursor="zoom-in";image.onclick=b.onclick;});
}

const masterclasses=[{"area":"Dibujo realista","title":"Retrato a grafito: cabeza de tres cuartos","duration":"8 sesiones de 60–90 minutos","materials":"Papel de 180 g/m², lápices H, HB, 2B, 4B y 6B, goma moldeable, difumino, espejo y fotografía propia con luz lateral","steps":[["Preparación del modelo","Coloca una única luz a 45° y evita la luz frontal. Fotografía el rostro a la altura de los ojos, con giro de unos 30°. Trabaja a partir de esa referencia fija."],["Encuaje y silueta","Dibuja un rectángulo que delimite el cráneo completo, sin cabello decorativo. Marca altura total y ancho máximo. Comprueba la inclinación del eje central y la línea de los ojos antes de dibujar rasgos."],["Medición comparativa","Con el lápiz a brazo extendido, compara anchura de nariz con distancia entre ojos; compara mentón–nariz con nariz–cejas. Transfiere relaciones, no medidas absolutas. Verifica asimetrías del giro."],["Construcción de volúmenes","Representa frente, pómulos, mandíbula, cuenca ocular y puente nasal como planos grandes. Distingue el plano frontal del lateral de la cabeza. No traces contornos oscuros alrededor de ojos o labios."],["Mapa de cinco valores","Reserva el blanco del papel para la máxima luz. Separa luz, semitono, sombra propia, sombra proyectada y acentos. Entorna los ojos para juzgar masas, no detalles."],["Modelado anatómico","Construye los párpados envolviendo el globo ocular; la nariz por puente, alas y plano inferior; la boca por volumen del orbicular y sombra bajo labio inferior. Trabaja del valor medio al oscuro."],["Textura y bordes","Utiliza bordes duros en sombras proyectadas y blandos en transiciones de mejilla y frente. Añade cabello por grupos de mechones; evita dibujar cada pelo. Levanta luces con goma moldeable."],["Control y entrega","Invierte horizontalmente la foto del dibujo y la referencia. Corrige proporciones antes de oscurecer. Entrega retrato, esquema de planos, escala tonal y tres fotos de proceso."]],"errors":["Ojos demasiado altos: vuelve a medir cráneo y línea ocular, no corrijas solo los ojos.","Nariz plana: distingue plano inferior y sombra de contacto con el rostro.","Piel manchada: trabaja capas uniformes y limpia el difumino.","Parecido insuficiente: comprueba distancias y ángulos antes de añadir pestañas."],"assessment":"20 puntos: semejanza y proporción (6), volúmenes (6), control tonal (4), proceso documentado (4)."},{"area":"Escultura","title":"Busto anatómico en arcilla: del armazón al acabado","duration":"10 sesiones de 90 minutos","materials":"Arcilla de modelado compatible con el proceso elegido, base estable, varillas o soporte apropiado, estecas, calibre, esponja y fotografías propias frontal/lateral/¾","steps":[["Estudio de referencia","Obtén vistas frontal, perfil y tres cuartos a la misma altura. Marca anchura de cráneo, distancia mentón–coronilla y profundidad de caja craneal. Dibuja siluetas antes de tocar la arcilla."],["Soporte seguro","Prepara una base que no vuelque. Si utilizas arcilla cerámica destinada a cocción, planifica desde el principio el vaciado y el secado; no introduzcas soportes incompatibles en el horno."],["Bloqueo de masas","Levanta primero caja craneal, cuello y cintura escapular. Comprueba perfil y frente a cada adición. Mantén simetría estructural antes de introducir expresiones faciales."],["Planos del cráneo","Localiza arco superciliar, pómulos, mandíbula y mentón. Usa el calibre para comprobar anchuras. Observa que el cráneo continúa detrás de la oreja; evita una cabeza aplanada."],["Órbitas y nariz","Excava suavemente la cuenca antes de añadir párpados. Construye nariz desde puente, cartílagos y base, no como una pieza triangular pegada. Controla proyección en perfil."],["Boca y orejas","Modela el cilindro dental bajo los labios; sitúa comisuras en relación con el eje de la cara. Construye orejas por masas: hélix, antihélix, concha y lóbulo, evitando surcos decorativos excesivos."],["Superficie y carácter","Establece primero planos grandes y transición de luces. Después introduce arrugas o textura únicamente donde expliquen anatomía o expresión. Examina la escultura con una luz lateral."],["Preparación final","Para pieza cerámica: ahueca según grosor y recomendaciones de la arcilla, permite secado uniforme y cuece solo con equipamiento y supervisión adecuados. Para arcilla no cocible: sigue su ficha técnica."],["Evaluación tridimensional","Fotografía 8 ángulos, incluido perfil estricto. Corrige cabeza demasiado pequeña, cuello cilíndrico y mandíbula sin articulación. Entrega vistas, medidas y registro de cambios."]],"errors":["Cráneo sin profundidad: revisa la vista de perfil antes de trabajar ojos.","Ojos saltones: construye primero la órbita y luego los párpados.","Cuello como tubo: incorpora esternocleidomastoideo y trapecio como grandes masas.","Grietas en cerámica: evita secados desiguales y respeta el proceso de vaciado."],"assessment":"20 puntos: proporciones (5), lectura anatómica en 360° (7), acabado (4), documentación y seguridad (4)."},{"area":"Marroquinería","title":"Cartera bifold de cuero: patrón, rebajado y costura a mano","duration":"6 sesiones de 90 minutos","materials":"Cuero curtido apropiado (1,0–1,5 mm para bolsillos), cartulina de patrón, cuchilla afilada, regla metálica, tabla de corte, compás, sacabocados/tenedor de costura, hilo encerado, dos agujas de guarnicionero, cola apta para cuero y bruñidor","steps":[["Diseño funcional","Define tamaño cerrado aproximado 11 × 9 cm y capacidad de billetes/tarjetas. Dibuja el patrón a escala real; reserva holguras para pliegue, grosor de capas y costuras. Crea primero una maqueta de papel."],["Prueba de capacidad","Introduce tarjetas y billetes en la maqueta. Verifica que el pliegue central no fuerza los bolsillos. Ajusta patrón antes de cortar cuero."],["Selección y dirección","Examina marcas, flexibilidad y grosor. Orienta piezas considerando dirección de estiramiento. Identifica exterior, forro y bolsillos; marca reversos discretamente."],["Corte y rebajado","Corta con pasadas controladas, regla y base estable, siempre alejando la cuchilla del cuerpo. Rebaja los bordes de solape y pliegue para reducir volumen sin debilitar la costura."],["Encolado y alineación","Presenta en seco. Aplica adhesivo según ficha del fabricante, ventila el espacio y une solo tras confirmar escuadra. Prensa sin deformar bolsillos."],["Marcado de puntadas","Traza línea de costura paralela al borde (por ejemplo 3–4 mm, ajustada al diseño). Marca paso uniforme con herramienta adecuada. Evita perforar a ciegas capas desplazadas."],["Puntada de guarnicionero","Con dos agujas e hilo encerado, cruza cada puntada con tensión constante. Practica en retales antes de coser la pieza. Remata sin nudos voluminosos en zonas de roce."],["Cantos y acabado","Iguala cantos, lija progresivamente, aplica producto compatible y bruñe. Redondea esquinas y comprueba que no quedan fibras levantadas ni restos de adhesivo."],["Control de calidad","Introduce tarjetas reales y abre/cierra 30 veces. Comprueba costuras, deslizamiento, pliegue, simetría y espesor. Fotografía patrón, maqueta, costura y producto final."]],"errors":["Bolsillos muy apretados: aumenta holgura en el patrón, no estires a la fuerza.","Borde grueso: rebaja antes de encolar y cose sobre muestra.","Costura ondulada: guía la línea y controla tensión puntada a puntada.","Pliegue abultado: revisa superposición de capas cerca del centro."],"assessment":"20 puntos: patrón y capacidad (6), corte/rebajado (4), costura (6), acabado (4)."},{"area":"Pintura","title":"Bodegón al óleo: composición, color y capas","duration":"7 sesiones de 90 minutos","materials":"Lienzo imprimado, pinturas al óleo, pinceles planos y redondos, paleta, trapos, recipiente con tapa y disolventes solo si son adecuados y con ventilación; alternativa: óleo soluble en agua","steps":[["Composición","Dispón tres objetos con materiales distintos y una luz lateral estable. Realiza cinco miniaturas en dos valores para elegir una composición con jerarquía visual."],["Dibujo y proporción","Encaja grandes formas, elipses y ejes. Comprueba verticales y horizontales; evita perfilar cada objeto con negro."],["Estudio tonal","Reduce la escena a tres valores. Reserva el mayor contraste para el centro de interés y controla el valor del fondo."],["Mezclas de color","Construye una carta de mezclas para luces, semitonos y sombras. Compara temperatura y valor antes de saturación; no aclares automáticamente todo con blanco."],["Primera mancha","Aplica capas delgadas para bloquear grandes masas. Mantén las sombras simples y transparentes cuando corresponda al material y al método."],["Volumen y materia","Diferencia metal, cerámica y fruta mediante bordes, reflejos y transición de valores. Trabaja primero masas grandes, después acentos."],["Revisión y conservación","Comprueba la obra en espejo, corrige elipses y relaciones de color. Respeta tiempos de secado, manejo de residuos y recomendaciones de materiales."]],"errors":["Objetos flotantes: corrige sombras de contacto.","Colores apagados: revisa mezclas excesivas y contraste de temperatura.","Todos los bordes iguales: jerarquiza bordes según foco."],"assessment":"20 puntos: composición (5), dibujo (5), color (6), proceso (4)."}];

function bindAcademyVideos(){
 const filter=document.getElementById("academy-video-filter"),grid=document.getElementById("academy-video-grid"),search=document.getElementById("academy-video-search");
 const normalize=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
 const draw=()=>{const matches=academyVideos.filter(v=>(!filter.value||v.area===filter.value)&&normalize(v.area+" "+v.title+" "+v.author).includes(normalize(search.value.trim())));document.getElementById("academy-video-count").textContent=matches.length+" vídeos";grid.innerHTML=matches.map(v=>`<article class="academy-video"><span class="muted">${esc(v.area)} · ${esc(v.level)}</span><h3>${esc(v.title)}</h3><p class="muted">${esc(v.author)}</p><div><button class="video-launch" type="button" data-lesson-video="${esc(v.id)}">▶ Reproducir vídeo</button></div><a href="https://www.youtube.com/watch?v=${esc(v.id)}" target="_blank" rel="noopener noreferrer">Ver vídeo original en YouTube</a></article>`).join("");
 grid.querySelectorAll("[data-lesson-video]").forEach(b=>bindPlayerButton(b));};
 let active=null;
 function restorePlayer(){
  if(!active)return;
  const {host,id}=active;active=null;
  const b=document.createElement("button");b.className="video-launch";b.type="button";b.dataset.lessonVideo=id;b.textContent="▶ Reproducir vídeo";
  host.replaceChildren(b);bindPlayerButton(b);
 }
 function bindPlayerButton(b){
  b.onclick=()=>{
   const v=academyVideos.find(x=>x.id===b.dataset.lessonVideo);if(!v)return;
   restorePlayer();
   document.querySelectorAll("video,audio").forEach(m=>{if(!m.paused)m.pause();});
   const host=b.parentElement,f=document.createElement("iframe"),close=document.createElement("button");
   f.title=v.title;f.src="https://www.youtube-nocookie.com/embed/"+v.id;f.allow="encrypted-media; fullscreen; picture-in-picture";f.allowFullscreen=true;f.referrerPolicy="strict-origin-when-cross-origin";
   close.type="button";close.className="secondary";close.textContent="■ Cerrar vídeo";close.onclick=()=>restorePlayer();
   host.replaceChildren(f,close);active={host,id:v.id};
  };
 }
 filter.onchange=search.oninput=()=>{restorePlayer();draw();};draw();
}

function bindLearningJourney(){
 const uid=me.id,key="gyste-learning-v1:"+uid,select=document.getElementById("journey-select"),box=document.getElementById("journey-content");
 let data={};try{const parsed=JSON.parse(localStorage.getItem(key));if(parsed&&typeof parsed==="object"&&!Array.isArray(parsed))data=parsed;}catch{}
 if(Object.hasOwn(LEARNING_JOURNEYS,data.selected))select.value=data.selected;
 const save=()=>{try{localStorage.setItem(key,JSON.stringify(data));return true;}catch{return false;}};
 const draw=()=>{const route=select.value,tasks=LEARNING_JOURNEYS[route].tasks,done=Array.isArray(data[route])?data[route]:[];
 box.innerHTML=`<p><b>${tasks.filter((_,i)=>done[i]===true).length} de ${tasks.length} pasos completados</b></p><progress max="${tasks.length}" value="${tasks.filter((_,i)=>done[i]===true).length}" style="width:100%" aria-label="Progreso de aprendizaje"></progress>${tasks.map((task,i)=>`<label style="display:flex;gap:10px;align-items:flex-start;margin:14px 0"><input type="checkbox" data-journey-task="${i}" ${done[i]===true?"checked":""}><span>${esc(task)}</span></label>`).join("")}<p id="journey-save-status" role="status"></p>`;
 box.querySelectorAll("[data-journey-task]").forEach(b=>b.onchange=()=>{const i=Number(b.dataset.journeyTask);if(!Array.isArray(data[route]))data[route]=[];data[route][i]=b.checked;const ok=save();draw();if(!ok)document.getElementById("journey-save-status").textContent="El progreso no se ha podido guardar en el dispositivo.";});
 };
 select.onchange=()=>{data.selected=select.value;save();draw();};
 document.getElementById("journey-share").onclick=goCompose;
 draw();
}

const PRIVATE_BUCKET="gyste-private-media";
const legacyPublicVideoIds=new Set(["fda0c4fb-b921-4a78-a5a0-6e9c847da529","7ffa635a-ec7a-4101-b741-373393086024"]);
const bucketFor=p=>legacyPublicVideoIds.has(p.id)||(p.audience&&p.audience!=="public")?PRIVATE_BUCKET:BUCKET;
async function prepareMediaUrls(list){
 const uid=me?.id;
 await Promise.all([BUCKET,PRIVATE_BUCKET].map(async bucket=>{
 if(bucket===BUCKET&&!MEDIA_BUCKET_PRIVATE)return;
 const paths=[...new Set(list.filter(p=>bucketFor(p)===bucket).flatMap(p=>postMediaItems(p).map(m=>m.path)).filter(Boolean))];
 if(!paths.length)return;
 const ttl=bucket===PRIVATE_BUCKET?300:MEDIA_SIGNED_URL_TTL;
 const {data,error}=await db.storage.from(bucket).createSignedUrls(paths,ttl);
 if(me?.id!==uid)return;
 if(error){console.warn("No se pudieron generar enlaces firmados",error.message);return;}
 (data||[]).forEach(item=>{if(item.path&&item.signedUrl)mediaUrlCache.set(bucket+":"+item.path,{url:item.signedUrl,expiresAt:Date.now()+ttl*1000});});
 }));
}
function safeMediaUrl(value){
 try{const u=new URL(value,location.href);return u.protocol==="https:"?u.href:"";}catch{return "";}
}

const MEDIA_TYPES=["image/jpeg","image/png","image/webp","video/mp4","video/webm"];
const MEDIA_MANIFEST="gyste-gallery-v1:";
const MAX_POST_FILES=10;
const MAX_POST_BYTES=50*1024*1024;
function postMediaItems(p){
 if(typeof p.media_url==="string"&&p.media_url.startsWith(MEDIA_MANIFEST)){
  try{
   const items=JSON.parse(p.media_url.slice(MEDIA_MANIFEST.length));
   if(Array.isArray(items)&&items.length>=2&&items.length<=MAX_POST_FILES&&items[0]?.path===p.media_path&&items.every(m=>m&&typeof m.path==="string"&&m.path.startsWith(p.user_id+"/")&&/^[0-9a-z-]+\.(jpg|png|webp|mp4|webm)$/i.test(m.path.slice(p.user_id.length+1))&&MEDIA_TYPES.includes(m.type)))return items.map(m=>({path:m.path,type:m.type,url:null}));
  }catch(e){console.warn("Galería no válida",e);}
 }
 return p.media_path||p.media_url?[{path:p.media_path,type:p.media_type,url:typeof p.media_url==="string"&&!p.media_url.startsWith(MEDIA_MANIFEST)?p.media_url:null}]:[];
}
function mediaItemUrl(m,p){
 const bucket=bucketFor(p);
 if(m.path){
  const cached=mediaUrlCache.get(bucket+":"+m.path);
  if(cached&&cached.expiresAt>Date.now()+60000)return safeMediaUrl(cached.url);
  if(bucket===BUCKET&&!MEDIA_BUCKET_PRIVATE)return safeMediaUrl(db.storage.from(BUCKET).getPublicUrl(m.path).data.publicUrl);
 }
 return bucket===PRIVATE_BUCKET||MEDIA_BUCKET_PRIVATE?"":(m.url?safeMediaUrl(m.url):"");
}
function postMediaHTML(p){
 const items=postMediaItems(p);if(!items.length)return "";
 const album=items.length>1&&items.every(m=>m.type?.startsWith("image/"));
 return `<div class="media-gallery ${items.length>1?"multi":""}${album?" photo-album":""}">${items.map((m,i)=>{
  const url=mediaItemUrl(m,p);if(!url)return '<p class="muted">Archivo no disponible temporalmente.</p>';
  const video=m.type?.startsWith("video/");
  const deferred=!video&&gysteDataSaver();
  const element=video?`<video class="media" controls playsinline preload="none" src="${esc(url)}"></video><p class="muted" style="margin:4px 8px;font-size:12px">Pulsa ▶ para cargar y reproducir.</p>`:deferred?`<button type="button" class="load-photo">${gysteIcon("photos")} Ver foto ${i+1} de ${items.length}</button><img class="media" decoding="async" data-photo-src="${esc(url)}" alt="Foto ${i+1} de ${items.length}">`:`<img class="media" loading="lazy" decoding="async" src="${esc(url)}" alt="Foto ${i+1} de ${items.length}">`;
  return `<div class="media-frame ${video?"video-frame":""}">${element}${album?`<span class="album-index" aria-hidden="true">${i+1}/${items.length}</span>`:""}<button type="button" class="media-expand" ${deferred?"hidden":""}>⛶ ${video?"Pantalla completa":"Ampliar foto"}</button></div>`;
 }).join("")}</div>`;
}
// Photo failure recovery: keep the original URL (including any signature), never substitute another image.
function bindPhotoRecovery(frame,image,button){
 if(frame.dataset.photoRecovery==="1")return;
 frame.dataset.photoRecovery="1";
 const status=document.createElement("p");status.className="muted";status.setAttribute("role","status");status.style.cssText="padding:10px;margin:0;text-align:center";status.hidden=true;
 const retry=document.createElement("button");retry.type="button";retry.className="secondary";retry.textContent="Reintentar foto";retry.style.cssText="margin:8px auto;display:none";frame.append(status,retry);
 let failed=false;
 const loading=()=>{failed=false;image.style.display="";button.disabled=true;status.hidden=false;status.textContent="Cargando fotografía…";retry.style.display="none";};
 const ready=()=>{failed=false;image.style.display="";button.disabled=false;status.hidden=true;retry.style.display="none";};
 const error=()=>{failed=true;image.style.display="none";button.disabled=true;status.hidden=false;status.textContent="No se pudo cargar esta fotografía. Reintenta o vuelve a abrir la publicación para renovar el acceso.";retry.style.display="block";};
 image.addEventListener("load",ready);image.addEventListener("error",error);
 retry.onclick=()=>{if(!failed)return;const url=image.getAttribute("src");if(!url)return;loading();image.removeAttribute("src");image.setAttribute("src",url);};
 if(image.complete){if(image.naturalWidth>0)ready();else error();}else{button.disabled=true;}
}
function bindMediaActions(){
 app.querySelectorAll(".load-photo").forEach(load=>{load.onclick=()=>{const frame=load.closest(".media-frame"),img=frame?.querySelector("img[data-photo-src]"),expand=frame?.querySelector(".media-expand");if(!img||!expand)return;const url=img.dataset.photoSrc;load.hidden=true;img.removeAttribute("data-photo-src");expand.hidden=false;img.src=url;bindPhotoRecovery(frame,img,expand);expand.onclick=()=>{if(!expand.disabled)openPhotoViewer(img);};img.onclick=expand.onclick;};});
 app.querySelectorAll(".media-expand").forEach(b=>{
  const frame=b.closest(".media-frame"),original=b.textContent;
   const image=frame.querySelector("img");if(image?.hasAttribute("data-photo-src"))return;if(image){bindPhotoRecovery(frame,image,b);b.onclick=()=>{if(!b.disabled)openPhotoViewer(image);};image.style.cursor="zoom-in";image.onclick=b.onclick;return;}
  const video=frame.querySelector("video");if(video)bindVideoRecovery(frame,video);
  const refresh=()=>{b.textContent=(document.fullscreenElement===frame||frame.classList.contains("media-overlay"))?"✕ Salir de pantalla completa":original;};
  if(!b.dataset.fullscreenBound){b.dataset.fullscreenBound="1";frame.addEventListener("fullscreenchange",refresh);}
  b.onclick=async()=>{
   if(document.fullscreenElement===frame){await document.exitFullscreen();return;}
   if(frame.classList.contains("media-overlay")){frame.classList.remove("media-overlay");refresh();return;}
   if(frame.requestFullscreen){try{await frame.requestFullscreen();refresh();return;}catch{}}
   if(video&&typeof video.webkitEnterFullscreen==="function"){try{video.webkitEnterFullscreen();return;}catch{}}
   frame.classList.add("media-overlay");refresh();
  };
 });
}

const POST_COLUMNS="id,content,user_id,likes,created_at,media_url,media_type,media_path,repost_of,audience";
const FEED_PAGE_SIZE=12;
async function readPosts(queryMode,page=0){
let q=db.from("posts").select(POST_COLUMNS+(spacesReady?",space_id":""));
if(sharedPostId)q=q.eq("id",sharedPostId);
 else if(queryMode==="mine")q=q.eq("user_id",me.id);
else if(queryMode==="following")q=q.in("user_id",[...new Set([me.id,...following])]);
else if(selectedSpaceId&&spacesReady)q=q.eq("space_id",selectedSpaceId);
q=q.order("created_at",{ascending:false}).order("id",{ascending:false});
if(sharedPostId)return q.limit(1);

return q.range(offset,offset+FEED_PAGE_SIZE);
}

}

let gysteTusLoading=null;
function loadGysteTus(){
 if(window.tus?.Upload)return Promise.resolve(window.tus);
 if(!gysteTusLoading)gysteTusLoading=new Promise((resolve,reject)=>{
  const script=document.createElement("script");
  script.src="https://cdn.jsdelivr.net/npm/tus-js-client@4.3.1/dist/tus.min.js";
  const fail=()=>{clearTimeout(timer);script.remove();gysteTusLoading=null;reject(Error("No se pudo cargar la subida reanudable"));};
  const timer=setTimeout(fail,30000);
  script.onerror=fail;
  script.onload=()=>{clearTimeout(timer);if(window.tus?.Upload)resolve(window.tus);else fail();};
  document.head.append(script);
 });
 return gysteTusLoading;
}

function gysteMissingTransfer(error){let status=0;try{status=Number(error?.originalResponse?.getStatus?.()||0);}catch{}return status===404||status===410;}

function gysteConfirmedOffset(value,size){
 if(typeof value!=="string"||!/^\d+$/.test(value))return null;
 const n=Number(value);return Number.isSafeInteger(n)&&n>=0&&n<=size?n:null;
}
function gystePendingSummary(job){
 const total=job.files.reduce((n,f)=>n+f.size,0);
 const confirmed=job.files.reduce((n,f,i)=>{const t=job.transfers[i];return n+(t?.done?f.size:Math.min(f.size,Math.max(0,Number.isSafeInteger(t?.confirmedBytes)?t.confirmedBytes:0)));},0);
 return job.files.length+" archivo(s) · "+(total/1048576).toFixed(1)+" MB · "+job.transfers.filter(t=>t.done).length+" completos · "+Math.floor(100*confirmed/Math.max(1,total))+" % confirmado durante la última sesión";
}
async function gysteResumableTransfer({client,endpoint,key,uid,bucket,path,file,state,active,progress,load,checkpoint=async()=>{}}){
 if(!active())throw Error("Pantalla cerrada");
 const Tus=await load();
 if(!active())throw Error("Pantalla cerrada");
 const session=async()=>{const {data,error}=await client.auth.getSession();if(error||data?.session?.user?.id!==uid||!data.session.access_token||!active())throw Error("Sesión no disponible");return data.session.access_token;};
 const token=await session();
 return new Promise((resolve,reject)=>{
  let upload;
  const remember=()=>{if(upload?.url)state.url=upload.url;};
  upload=new Tus.Upload(file,{
   endpoint,uploadUrl:state.url||null,chunkSize:6*1024*1024,
   uploadDataDuringCreation:false,storeFingerprintForResuming:false,removeFingerprintOnSuccess:true,
   retryDelays:[0,2000,5000,10000,20000],
   headers:{authorization:"Bearer "+token,apikey:key},
   metadata:{bucketName:bucket,objectName:path,contentType:file.type,cacheControl:"3600"},
   onBeforeRequest:async req=>{if(new URL(req.getURL(),endpoint).origin!==new URL(endpoint).origin)throw Error("Dirección no válida");req.setHeader("authorization","Bearer "+await session());},
   onAfterResponse:async(req,res)=>{
    const method=req.getMethod(),status=res.getStatus();if(status<200||status>=300)return;
    if(method==="POST"){const loc=res.getHeader("Location");if(loc){const url=new URL(loc,endpoint).href;if(new URL(url).origin!==new URL(endpoint).origin)throw Error("Dirección no válida");state.url=url;state.urlCreatedAt=Date.now();state.confirmedBytes=0;await checkpoint();}}
    if(method==="HEAD"||method==="PATCH"){const offset=gysteConfirmedOffset(res.getHeader("Upload-Offset"),file.size);if(offset!==null&&offset!==state.confirmedBytes){state.confirmedBytes=offset;await checkpoint();}}
   },
   onProgress:(sent,total)=>{remember();if(active())progress(Math.min(100,Math.floor(100*sent/Math.max(1,total))));},
   onError:error=>{remember();reject(error);},
   onSuccess:()=>{state.url=null;state.urlCreatedAt=null;resolve();}
  });
  try{upload.start();}catch(error){remember();reject(error);}
 });
}

async function runPending(job,ops){
 if(job.uid!==ops.uid||!ops.active())throw Error("Cuenta cambiada");
 if(!await ops.confirm(job)){
  for(let i=0;i<job.files.length;i++){
   if(!ops.active())throw Error("Cuenta cambiada");
   if(job.transfers[i].done)continue;
   await ops.upload(job,i,()=>ops.save(job));
   job.transfers[i].done=true;job.transfers[i].url=null;job.transfers[i].confirmedBytes=job.files[i].size;await ops.save(job);
  }
  if(!ops.active())throw Error("Cuenta cambiada");
  try{await ops.insert(job)}catch(e){if(!await ops.confirm(job))throw e}
  if(!await ops.confirm(job))throw Error("Envío no confirmado");
 }
 if(!ops.active())throw Error("Cuenta cambiada");
 await ops.audience(job);await ops.remove(job.id);
}
let pendingDB=null;
const pendingBusy=new Set();
function openPending(){
 if(!window.indexedDB)return Promise.reject(Error("Almacenamiento no disponible"));
 if(!pendingDB)pendingDB=new Promise((ok,no)=>{const q=indexedDB.open("gyste-pending-v1",1);q.onupgradeneeded=()=>{q.result.createObjectStore("jobs",{keyPath:"id"}).createIndex("uid","uid");};q.onsuccess=()=>ok(q.result);q.onerror=()=>{pendingDB=null;no(q.error);};q.onblocked=()=>{pendingDB=null;no(Error("Almacenamiento bloqueado"));};});
 return pendingDB;
}
async function pendingTx(mode,fn){
 const d=await openPending();return new Promise((ok,no)=>{const tx=d.transaction("jobs",mode);let value;const q=fn(tx.objectStore("jobs"));q.onsuccess=()=>{value=q.result;};tx.oncomplete=()=>ok(value);tx.onabort=()=>no(tx.error||Error("Copia no guardada"));tx.onerror=()=>no(tx.error);});
}
const pendingGet=id=>pendingTx("readonly",s=>s.get(id)),pendingList=uid=>pendingTx("readonly",s=>s.index("uid").getAll(uid)),pendingSave=j=>pendingTx("readwrite",s=>s.put(j)),pendingRemove=id=>pendingTx("readwrite",s=>s.delete(id));
const pendingAccount=uid=>me?.id===uid&&session?.user?.id===uid;
async function clearAccountPending(uid){
 if(!pendingAccount(uid)||pendingBusy.size)throw Error("Cuenta no disponible o envío en curso");
 const d=await openPending();
 await new Promise((resolve,reject)=>{
  const tx=d.transaction("jobs","readwrite"),store=tx.objectStore("jobs"),q=store.index("uid").openCursor(IDBKeyRange.only(uid));
  q.onsuccess=()=>{if(!pendingAccount(uid)){tx.abort();return;}const cursor=q.result;if(cursor){cursor.delete();cursor.continue();}};
  tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error("Borrado cancelado"));tx.onerror=()=>reject(tx.error);
 });
 if((await pendingList(uid)).length!==0)throw Error("Quedan copias pendientes");
 void paintPending();
}
async function pendingLock(id,fn){
 if(pendingBusy.has(id))throw Error("Envío en curso");
 pendingBusy.add(id);
 try{if(navigator.locks?.request)return await navigator.locks.request("gyste-pending-"+id,{ifAvailable:true},lock=>{if(!lock)throw Error("Abierto en otra pestaña");return fn();});return await fn();}
 finally{pendingBusy.delete(id);void paintPending();}
}
async function paintPending(){
 const b=document.getElementById("pending-link"),uid=me?.id;if(!b||!uid)return;
 try{const jobs=await pendingList(uid);if(b.isConnected&&pendingAccount(uid)){b.hidden=!jobs.length;b.textContent="📤 Archivos pendientes ("+jobs.length+")";}}catch{}
}
async function processPending(job,progress,viewActive,existing=false){
 const uid=job.uid,active=()=>pendingAccount(uid)&&viewActive();
 return pendingLock(job.id,async()=>{
  if(!active())throw Error("Cuenta cambiada");
  const old=await pendingGet(job.id);
  if(old){if(old.uid!==uid)throw Error("Cuenta incorrecta");job=old;}
  else{if(existing)throw Error("Copia ya retirada");await pendingSave(job);}
  void paintPending();
  if(navigator.onLine===false)throw Error("Sin conexión; copia guardada");
  const confirm=j=>j.kind==="post"?confirmPublishedPost(uid,j.id):checkSentMessage(uid,j.row.recipient_id,j.id,j.row.media_path,j.row.media_type);
  await runPending(job,{uid,active,confirm,save:pendingSave,remove:pendingRemove,
   upload:async(j,i,checkpoint)=>{

const commentLoads=new WeakMap(),commentSendLocks=new Set();
async function loadComments(id){
 const uid=me?.id,list=document.getElementById("list-"+id);if(!uid||!list)return;
 const marker={};commentLoads.set(list,marker);
 const valid=()=>me?.id===uid&&list.isConnected&&commentLoads.get(list)===marker;
 list.innerHTML='<p class="muted">Cargando comentarios…</p>';
 try{
  const {data,error}=await db.from("gyste_comments").select("id,user_id,content,created_at").eq("post_id",id).order("created_at");
  if(!valid())return;if(error)throw error;
  const ids=[...new Set((data||[]).map(c=>c.user_id))],map={};
  if(ids.length){const {data:u}=await db.from("gyste_profiles").select("user_id,display_name,avatar_url").in("user_id",ids);if(!valid())return;(u||[]).forEach(x=>map[x.user_id]=x);}
  if(!valid())return;
  list.innerHTML=(data||[]).map(c=>`<div class="comment"><div class="comment-author"><span class="face">${avatarContent(map[c.user_id])}</span><b>${esc(map[c.user_id]?.display_name||"Miembro")}</b></div><div>${esc(c.content)}</div><small>${time(c.created_at)}</small></div>`).join("")||'<p class="muted">Sé el primero en comentar.</p>';
 }catch{
  if(!valid())return;
  list.innerHTML='<p class="muted" role="status">No se pudieron cargar los comentarios.</p><button type="button" class="secondary" data-comment-retry>Reintentar</button>';
  list.querySelector("[data-comment-retry]").onclick=()=>{if(valid())loadComments(id);};
 }
}
async function sendComment(e){
 e.preventDefault();const form=e.currentTarget,uid=me?.id,id=form.dataset.commentForm,input=form.querySelector("input"),button=form.querySelector("button"),status=form.querySelector("[data-comment-status]");
 if(!uid||!id||!input||!button||button.disabled)return;
 const content=input.value.trim(),key=uid+":"+id;
 if(!content||content.length>2000){if(status)status.textContent="Escribe un comentario de entre 1 y 2000 caracteres.";return;}
 if(commentSendLocks.has(key))return;
 const active=()=>me?.id===uid&&form.isConnected;
 commentSendLocks.add(key);button.disabled=true;input.disabled=true;button.textContent="Enviando…";if(status)status.textContent="";
 try{
  const {error}=await db.from("gyste_comments").insert({post_id:id,user_id:uid,content});
  if(error)throw error;if(!active())return;
  input.value="";if(status)status.textContent="Comentario publicado.";await loadComments(id);
 }catch{
  if(active()&&status)status.textContent="No se pudo confirmar el envío. Tu texto se conserva. Revisa los comentarios antes de volver a enviarlo.";
 }finally{
  commentSendLocks.delete(key);input.disabled=false;button.disabled=false;button.textContent="Enviar";
 }
}

async function changeProfileImage(kind,file){
 if(!me||profileImageBusy||!["avatar","cover"].includes(kind))return;
 const uid=me.id,key=kind+"_url";
 const extensions={"image/jpeg":"jpg","image/png":"png","image/webp":"webp"};
 if(file&&(!file.size||file.size>MAX_POST_BYTES))return profilePhotoStatus("Elige una imagen de hasta 50 MB.",true);
 profileImageBusy=true;
 app.querySelectorAll("[data-photo-pick],[data-photo-remove]").forEach(b=>b.disabled=true);
 const storage=db.storage.from(PROFILE_BUCKET);let newPath=null;let oldPath=null;
 try{
  profilePhotoStatus(file?"Preparando fotografía…":"Quitando fotografía…");
  if(file&&(!Object.hasOwn(extensions,file.type)||file.size>PROFILE_MAX_BYTES)){file=await gysteOptimizePhoto(file,"light",true);if(!Object.hasOwn(extensions,file.type)||file.size>PROFILE_MAX_BYTES)throw Error("La imagen no se pudo convertir a JPG, PNG o WebP de hasta 5 MB");}
  if(file)profilePhotoStatus("Subiendo fotografía…");
  const current=await db.from("gyste_profiles").select(key).eq("user_id",uid).single();
  if(current.error)throw current.error;
  oldPath=ownProfileImagePath(current.data?.[key],uid);
  let url=null;
  if(file){
   newPath=`${uid}/${kind}-${crypto.randomUUID()}.${extensions[file.type]}`;
   const up=await storage.upload(newPath,file,{contentType:file.type,cacheControl:"3600",upsert:false});
   if(up.error)throw up.error;
   url=storage.getPublicUrl(newPath).data.publicUrl;
   if(!profileImageUrl(url))throw new Error("No se obtuvo un enlace de imagen válido.");
  }
  if(me?.id!==uid)throw new Error("La sesión ha cambiado. Vuelve a intentarlo.");
  const saved=await db.from("gyste_profiles").update({[key]:url,updated_at:new Date().toISOString()}).eq("user_id",uid).select().single();
  if(saved.error)throw saved.error;
  if(me?.id===uid){me={...me,...saved.data};refreshProfilePhotoControls();}
  // Remove only objects belonging to this account, after the database update succeeds.
  // Avoid deleting on uncertain network failures (the saved URL may already be in use).
  let cleanupError=false;
  if(oldPath&&oldPath!==newPath){try{const result=await storage.remove([oldPath]);cleanupError=Boolean(result.error);}catch{cleanupError=true;}}
  if(me?.id===uid)profilePhotoStatus((file?"Fotografía guardada.":"Fotografía quitada del perfil.")+(cleanupError?" No se pudo limpiar el archivo anterior.":""),cleanupError);
 }catch(e){if(me?.id===uid)profilePhotoStatus("No se pudo completar el cambio: "+(e?.message||"revisa la conexión")+". Actualiza el perfil antes de reintentar.",true);}
 finally{profileImageBusy=false;app.querySelectorAll("[data-photo-pick],[data-photo-remove]").forEach(b=>b.disabled=false);}
}

const profileSaveLocks=new Set();
async function saveProfile(){
 const uid=me?.id,button=document.getElementById("saveprofile"),fields=["display","username","bio"].map(id=>document.getElementById(id));
 if(!uid||tab!=="profile"||!button||fields.some(f=>!f)||button.disabled||profileSaveLocks.has(uid))return;
 const [display_name,username,bio]=[fields[0].value.trim(),fields[1].value.trim().toLowerCase(),fields[2].value.trim()];
 if(!display_name||display_name.length>60||!/^[a-z0-9_]{3,30}$/.test(username)||bio.length>300)return say("Comprueba el nombre (hasta 60 caracteres), el usuario (3–30 letras, números o guion bajo) y la biografía (hasta 300 caracteres).",true);
 const active=()=>me?.id===uid&&tab==="profile"&&button.isConnected;
 profileSaveLocks.add(uid);button.disabled=true;button.textContent="Guardando…";fields.forEach(f=>f.disabled=true);
 try{
  const {data,error}=await db.from("gyste_profiles").update({display_name,username,bio,updated_at:new Date().toISOString()}).eq("user_id",uid).select().single();
  if(error)throw error;if(!data||data.user_id!==uid)throw Error("No se confirmó el cambio.");
  if(me?.id!==uid)return;
  // Update only the fields saved here, not a concurrently edited photo.
  me={...me,display_name:data.display_name,username:data.username,bio:data.bio};
  if(active()){say("Perfil actualizado.");await profileView();}
 }catch(e){
  if(active())say(e?.code==="23505"?"Ese nombre de usuario ya está en uso. Elige otro.":"No se pudo confirmar el guardado. Revisa tu conexión e inténtalo de nuevo.",true);
 }finally{
  profileSaveLocks.delete(uid);button.disabled=false;button.textContent="Guardar cambios";fields.forEach(f=>f.disabled=false);
 }
}

let unreadState={uid:null,stamp:0,serial:0,loading:false,messages:null,notifications:null};
function resetUnreadBadges(){unreadState={uid:null,stamp:0,serial:0,loading:false,messages:null,notifications:null};}
function unreadLabel(count){return Number.isSafeInteger(count)&&count>0?(count>99?"99+":String(count)):"";}
function unreadBadge(kind){return '<span class="unread-count" data-unread-kind="'+kind+'" aria-hidden="true" hidden></span>';}
function paintUnreadBadges(){
 const uid=me?.id;
 app.querySelectorAll("[data-unread-kind]").forEach(node=>{const kind=node.dataset.unreadKind,count=uid&&unreadState.uid===uid?unreadState[kind]:null,label=unreadLabel(count);node.textContent=label;node.hidden=!label;const b=node.closest("button");if(b)b.setAttribute("aria-label",(kind==="messages"?"Mensajes":"Notificaciones")+(label?" · "+count+" sin leer":""));});
}
async function refreshUnreadBadges(force=false){
 const uid=me?.id;if(!uid||session?.user?.id!==uid||document.hidden||navigator.onLine===false)return;
 if(unreadState.uid!==uid)unreadState={uid,stamp:0,serial:0,loading:false,messages:null,notifications:null};
 const state=unreadState,now=Date.now(),interval=gysteDataSaver(uid)?120000:60000;
 if(!force&&(state.loading||now-state.stamp<interval))return;
 const serial=++state.serial;state.loading=true;state.stamp=now;
 try{
 const results=await Promise.allSettled([
 db.from("gyste_messages").select("id",{count:"exact",head:true}).eq("recipient_id",uid).is("read_at",null),
 db.from("gyste_notifications").select("id",{count:"exact",head:true}).eq("user_id",uid).eq("is_read",false)
 ]);
 if(unreadState!==state||state.serial!==serial||me?.id!==uid||session?.user?.id!==uid)return;
 ["messages","notifications"].forEach((kind,i)=>{const r=results[i];state[kind]=r.status==="fulfilled"&&!r.value.error&&Number.isSafeInteger(r.value.count)&&r.value.count>=0?r.value.count:null;});
 paintUnreadBadges();
 }finally{if(unreadState===state&&state.serial===serial)state.loading=false;}
}
