<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gyste</title>
  <style>
    body { background-color: #0A1929; color: #F3F6F9; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background-color: #0A1929; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #1E4976; }
    .logo { font-size: 24px; font-weight: bold; color: #36C7B2; }
    .btn-register { background-color: #36C7B2; color: #0A1929; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .feed { padding: 20px; display: flex; flex-direction: column; gap: 20px; }
    .post { background-color: #132F4C; border-radius: 16px; border: 1px solid #1E4976; overflow: hidden; }
    .post-header { padding: 15px; display: flex; align-items: center; gap: 10px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background-color: #1E4976; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #36C7B2; }
    .media { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #000; display: block; }
    .post-actions { padding: 10px 15px; display: flex; gap: 15px; border-top: 1px solid #1E4976; align-items: center; }
    .action { color: #B2BAC2; cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 0.9rem; }
    .transparency { padding: 10px 15px; background: rgba(54, 199, 178, 0.1); font-size: 0.8rem; color: #B2BAC2; border-top: 1px solid #1E4976; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 200; }
    .modal-content { background: #132F4C; padding: 30px; border-radius: 16px; width: 90%; max-width: 400px; border: 1px solid #1E4976; }
    .modal input { width: 100%; padding: 12px; margin-bottom: 15px; background: #0A1929; border: 1px solid #1E4976; color: white; border-radius: 8px; box-sizing: border-box; }
    .modal button { width: 100%; padding: 12px; background: #36C7B2; color: #0A1929; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .close { float: right; color: #B2BAC2; cursor: pointer; font-size: 20px; }
  </style>
</head>
<body>

  <header>
    <div class="logo">🌍 Gyste</div>
    <button class="btn-register" onclick="document.getElementById('registerModal').style.display='flex'">Registrarse</button>
  </header>

  <div class="feed">
    <div class="post">
      <div class="post-header"><div class="avatar">TS</div><div class="username">Tierra Salvaje</div></div>
      <div style="padding: 0 15px 15px;">Instinto, fuerza y trabajo en equipo. 🦁</div>
      <iframe class="media" src="https://www.youtube.com/embed/OMg8u2j8l8E" frameborder="0" allowfullscreen></iframe>
      <div class="post-actions"><div class="action">❤️ 2.4k</div><div class="action">💬 Comentar</div><div class="action">↗️ Compartir</div></div>
      <div class="transparency">¿Por qué veo esto? Porque te interesa <strong>Animales</strong>.</div>
    </div>
  </div>

  <div id="registerModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="document.getElementById('registerModal').style.display='none'">&times;</span>
      <h2 style="color: #36C7B2; margin-top: 0;">Únete a Gyste</h2>
      <form name="registro-gyste" data-netlify="true" onsubmit="alert('¡Bienvenido a Gyste! Tu perfil ha sido creado.'); document.getElementById('registerModal').style.display='none'; return false;">
        <input type="text" name="nombre" placeholder="Tu nombre" required>
        <input type="email" name="correo" placeholder="Tu correo electrónico" required>
        <button type="submit">Crear mi perfil</button>
      </form>
    </div>
  </div>

</body>
</html>
