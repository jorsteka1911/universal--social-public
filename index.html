async function sendPasswordReset(){
const email=document.getElementById("email").value.trim().toLowerCase();
if(!validEmail(email))return say("Escribe primero el correo de tu cuenta.",true);
const button=document.getElementById("forgot");
button.disabled=true;button.textContent="Enviando…";
try{
const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname});
if(error)throw error;
say("Te enviamos un enlace. Ábrelo desde este mismo navegador para crear tu contraseña nueva.");
}catch(e){say("No se pudo enviar el correo de recuperación. Comprueba la configuración de URL de Supabase e inténtalo de nuevo.",true);}
finally{button.disabled=false;button.textContent="¿Olvidaste tu contraseña?";}
}

async function saveNewPassword(){
const password=document.getElementById("newpassword").value;
const confirmation=document.getElementById("confirmnewpassword").value;
if(password.length<6)return say("La contraseña debe tener al menos 6 caracteres.",true);
if(password!==confirmation)return say("Las contraseñas no coinciden. Escríbelas de nuevo.",true);
const button=document.getElementById("savepassword");
button.disabled=true;button.textContent="Guardando…";
try{
const {data,error}=await db.auth.updateUser({password});
if(error)throw error;
session=(await db.auth.getSession()).data.session;
if(data?.user){
  window.history.replaceState({},document.title,window.location.pathname+window.location.search);
  notice="Contraseña actualizada correctamente. Ya puedes usarla para entrar en Gyste.";
  noticeError=false;
  await db.auth.signOut();
  session=null;me=null;chatUser=null;
  authView();
  say(notice,false);
}
}catch(e){say("No se pudo actualizar la contraseña. Vuelve a abrir el enlace de recuperación más reciente.",true);button.disabled=false;button.textContent="Guardar contraseña";}
}

function authMessage(error, mode){
  const raw=String(error?.message||"").toLowerCase();
  const code=String(error?.code||"").toLowerCase();
  if(raw.includes("invalid login credentials")||raw.includes("invalid_credentials")||code==="invalid_credentials")
    return "El correo o la contraseña no son correctos. Comprueba los datos e inténtalo de nuevo.";
  if(raw.includes("email not confirmed")||code==="email_not_confirmed")
    return "Tu correo todavía no está confirmado. Revisa tu bandeja de entrada y la carpeta de spam.";
  if(raw.includes("user already registered")||raw.includes("already registered")||raw.includes("user already exists")||code==="user_already_exists")
    return "Este correo ya tiene una cuenta. Pulsa Entrar para iniciar sesión.";
  if(raw.includes("password should be at least")||raw.includes("password is too short"))
    return "La contraseña debe tener al menos 6 caracteres.";
  if(raw.includes("rate limit")||raw.includes("too many requests")||code.includes("rate_limit"))
    return "Has realizado demasiados intentos. Espera un poco y vuelve a intentarlo.";
  if(raw.includes("network")||raw.includes("fetch")||raw.includes("timeout"))
    return "No se pudo conectar. Comprueba Internet y vuelve a intentarlo.";
  return mode==="login" ? "No se pudo iniciar sesión. Comprueba tus datos e inténtalo de nuevo." : "No se pudo crear la cuenta. Revisa los datos e inténtalo de nuevo.";
}

function validEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

async function login(){
  const email=document.getElementById("email").value.trim().toLowerCase();
  const password=document.getElementById("password").value;
  const button=document.getElementById("login");
  if(!validEmail(email))return say("Escribe un correo electrónico válido.",true);
  if(!password)return say("Escribe tu contraseña.",true);
  button.disabled=true;button.textContent="Entrando…";
  try{
    const {data,error}=await db.auth.signInWithPassword({email,password});
    if(error)throw error;
    if(!data.session)throw new Error("No se pudo establecer la sesión. Inténtalo de nuevo.");
    session=data.session;
    await boot();
  }catch(error){
    say(authMessage(error,"login"),true);
  }finally{
    const current=document.getElementById("login");
    if(current){current.disabled=false;current.textContent="Entrar";}
  }
}

async function signup(){
  const email=document.getElementById("email").value.trim().toLowerCase();
  const password=document.getElementById("password").value;
  const button=document.getElementById("signup");
  if(!validEmail(email))return say("Escribe un correo electrónico válido.",true);
  if(password.length<8)return say("Para crear una cuenta, elige una contraseña de al menos 8 caracteres.",true);
  if(!document.getElementById("signup-accept")?.checked)return say("Lee y acepta las normas de convivencia para registrarte.",true);
  if(button.disabled)return;
  button.disabled=true;button.textContent="Creando cuenta…";
  try{
    const {data,error}=await db.auth.signUp({email,password});
    if(error)throw error;
    // Supabase puede devolver identidades vacías cuando el correo ya existe,
    // para evitar revelar información de cuentas a terceros.
    if(data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0){
      say("Este correo ya tiene una cuenta. Pulsa Entrar para iniciar sesión.",true);
      return;
    }
    if(data.session){
      session=data.session;
      await boot();
    }else{
      say("Solicitud de registro recibida. Si Supabase requiere confirmar el correo, revisa tu bandeja de entrada y spam.");
    }
  }catch(error){
    say(authMessage(error,"signup"),true);
  }finally{
    const current=document.getElementById("signup");
    if(current){current.disabled=false;current.textContent="Crear cuenta";}
  }
}

async function logout(){
const {error}=await db.auth.signOut();
if(error)return say("No se pudo cerrar sesión: "+error.message,true);
session=null;me=null;chatUser=null;tab="feed";sharedPostId=null;selectedSpaceId=null;homeFilter="all";authView();
}

async function boot(){
const {data:{user},error}=await db.auth.getUser();
if(error||!user){session=null;me=null;return authView();}
me={id:user.id,email:user.email};
let {data:p,error:profileError}=await db.from("gyste_profiles").select("*").eq("user_id",user.id).maybeSingle();
if(profileError)return authViewWithError("No se pudo cargar tu perfil: "+profileError.message);
if(!p){
const name="Miembro de Gyste "+user.id.slice(0,6);
const username="gyste_"+user.id.replace(/-/g,"").slice(0,16);
const {data:created,error:createError}=await db.from("gyste_profiles").upsert({user_id:user.id,display_name:name,username}).select().single();
if(createError)return authViewWithError("No se pudo crear tu perfil: "+createError.message);
p=created;
}
me={...me,...p};
applyWallpaper(readWallpaper(me.id));
await loadFollowing();
await loadSpaces();
const requestedPost=new URLSearchParams(location.search).get("post");
if(requestedPost&&/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(requestedPost)){sharedPostId=requestedPost;tab="feed";selectedSpaceId=null;homeFilter="all";}
await renderTab();
}

function authViewWithError(message){notice=message;noticeError=true;authView();}

async function loadFollowing(){
const {data,error}=await db.from("gyste_follows").select("followed_id").eq("follower_id",me.id);
if(!error)following=new Set((data||[]).map(x=>x.followed_id));
else following=new Set();
}

,{group:"Dibujo",name:"Ojos realistas: estructura y volumen",level:"Clase guiada",steps:["Dibuja un óvalo horizontal ligero de 4 cm; marca las comisuras y el eje de la mirada.","Traza el párpado superior curvo y el inferior menos marcado: no dibujes un contorno rígido.","Dibuja el iris parcialmente cubierto por el párpado superior; centra la pupila según la mirada.","Reserva un pequeño brillo blanco; oscurece pupila y borde superior del iris.","Sombrea el pliegue del párpado y el globo ocular con tres valores; dibuja pestañas en grupos curvos.","Práctica: dibuja el mismo ojo mirando al frente, arriba y a un lado."]}
,{group:"Dibujo",name:"Nariz de frente y de perfil",level:"Clase guiada",steps:["Marca el eje central del rostro y la altura aproximada de la base de la nariz.","Construye el puente como un prisma suave y la punta como una esfera pequeña.","Ubica las aletas a ambos lados; observa que las fosas no son dos círculos negros.","Sombrea laterales del puente, parte inferior de la punta y debajo de las aletas.","Para el perfil, dibuja primero la silueta del puente y punta; después define la fosa nasal.","Práctica: cinco narices con luces diferentes, sin remarcar todos los contornos."]}
,{group:"Dibujo",name:"Boca y labios: forma, expresión y sombra",level:"Clase guiada",steps:["Dibuja una línea suave entre las dos comisuras; marca el centro.","Traza el arco de Cupido en el labio superior, que suele tener dos elevaciones.","Construye el labio inferior como un volumen curvo; evita una línea oscura continua.","Oscurece la separación entre labios y añade sombra debajo del inferior.","Para una sonrisa, eleva las comisuras y observa cómo cambian las mejillas.","Práctica: boca neutra, sonrisa y expresión de sorpresa."]}
,{group:"Dibujo",name:"Cabello y orejas: formas antes de detalles",level:"Clase guiada",steps:["Marca primero la masa general del cabello y la dirección de crecimiento.","Separa el cabello en mechones grandes; reserva bandas de luz.","Oscurece raíces y zonas interiores, sin dibujar cada pelo.","Coloca las orejas aproximadamente entre la línea de cejas y la base de la nariz en un rostro frontal adulto.","Dibuja borde externo, antihélix y lóbulo observando la referencia.","Práctica: tres peinados y dos orejas desde distintos ángulos."]}
,{group:"Cuero",name:"Costura de guarnicionero: dos agujas",level:"Clase guiada",steps:["Corta dos retales de cuero curtido y marca una línea paralela al borde, a unos 3–4 mm.","Señala orificios regulares con tenedor de costura y perfora sobre base adecuada.","Enhebra una aguja en cada extremo del mismo hilo encerado.","Pasa una aguja por el primer orificio y centra el hilo; cruza las agujas en cada agujero sin perforar el hilo.","Mantén tensión uniforme sin deformar el cuero; remata con dos o tres puntadas hacia atrás.","Práctica: cose 10 cm rectos y comprueba que las puntadas tienen igual inclinación."]}
,{group:"Pintura",name:"Mezclar colores sin ensuciar la paleta",level:"Clase guiada",steps:["Prepara rojo, amarillo, azul, blanco y un soporte para hacer pruebas.","Mezcla amarillo con azul en proporciones 3:1, 1:1 y 1:3 y compara los verdes.","Mezcla rojo con amarillo para crear naranjas cálidos y fríos.","Añade pequeñas cantidades del complementario para neutralizar sin recurrir siempre al negro.","Crea una escala de cinco valores de un color añadiendo blanco progresivamente.","Práctica: pinta una manzana usando únicamente cinco mezclas propias."]}
,{group:"Madera y manualidades",name:"Tallado de una hoja en relieve",level:"Clase guiada",steps:["Dibuja una hoja de 8 cm sobre una tabla blanda fijada con sargentos.","Marca el contorno y las nervaduras; mantén las manos fuera de la trayectoria de la herramienta.","Rebaja el fondo poco a poco alrededor de la hoja, sin intentar retirar toda la madera de una vez.","Redondea la superficie de la hoja siguiendo su forma natural.","Marca las nervaduras con cortes superficiales y suaviza con lija.","Práctica: crea dos hojas con profundidades diferentes y compara las sombras."]}

];

const professionalCourses=[{"group": "Dibujo académico", "title": "Retrato realista: método de observación", "level": "Avanzado · 6 sesiones", "steps": ["Prepara una referencia propia con luz lateral única, papel A3, HB, 2B, 4B, goma maleable y difumino limpio. Delimita el encuadre con cuatro marcas; evita dibujar de memoria.", "Bloquea la silueta del cráneo con líneas rectas provisionales; mide alto/ancho con el lápiz extendido y compara ángulos de mandíbula y sienes.", "Marca eje de simetría y dirección de cejas, base nasal y boca según el modelo; comprueba alineaciones verticales con una plomada. No impongas proporciones estándar a un rostro individual.", "Modela las órbitas: sombreado de cuencas, planos de frente y pómulos. Trabaja cinco valores de grafito; reserva el papel para los brillos.", "Ojos: observa el grosor del párpado, el solapamiento del iris, la sombra del párpado superior y la dirección de las pestañas. Nariz: pinta planos de luz y sombra, no dos líneas laterales.", "Boca: mide distancia entre comisuras, arco de Cupido y sombra bajo labio inferior. Cabello: organiza masas oscuras y reflejos; deja los mechones sueltos para el final.", "Termina corrigiendo semejanza, valores y bordes duros/blandos. Fotografía el dibujo en blanco y negro para comparar contraste con la referencia."]}, {"group": "Dibujo académico", "title": "Ojo humano: estudio anatómico en grafito", "level": "Intermedio · 90 minutos", "steps": ["Trabaja a partir de una fotografía nítida de un ojo real, con párpado y ceja visibles; marca la distancia entre lagrimal y comisura externa.", "Dibuja primero la forma del globo bajo los párpados, no un símbolo de almendra. Observa que el párpado superior suele ocultar parte del iris.", "Traza el grosor del borde palpebral; ubica lagrimal, pliegue superior y bolsas suaves del inferior según el modelo.", "Construye el iris con un círculo en perspectiva; deja sin grafito el reflejo de la luz y oscurece pupila y borde superior.", "Aplica cinco valores: blanco de brillo, piel iluminada, semitono, sombra del pliegue y pupila. Evita contornos uniformes.", "Dibuja pestañas en grupos de diferente longitud y dirección; suaviza las transiciones con grafito, no con el dedo.", "Compara con la foto a distancia de un brazo; corrige tamaño del iris, inclinación y volumen del párpado."]}, {"group": "Dibujo académico", "title": "Nariz y labios: planos, textura y expresiones", "level": "Intermedio · 2 sesiones", "steps": ["Observa un rostro real frontal y otro de tres cuartos. Encaja el volumen nasal como puente, punta y alas sin marcar líneas definitivas.", "Dibuja la sombra proyectada bajo la punta; distingue el plano lateral iluminado de la aleta y el interior de las fosas nasales.", "Para labios, mide ancho y altura respecto a la nariz. Construye primero la abertura entre los labios y luego sus volúmenes.", "Sombrea el labio superior y la sombra bajo el inferior según la luz. Reserva reflejos y evita contornear todo con negro.", "Repite la misma boca en gesto neutro y sonrisa; observa cómo se elevan comisuras y mejillas.", "Compara tus resultados con el modelo: semejanza, bordes, simetría natural y gradación de valores."]}, {"group": "Pintura profesional", "title": "Óleo: retrato por capas y control de valores", "level": "Avanzado · 4 sesiones", "steps": ["Ventila el espacio y revisa las indicaciones de pigmentos y disolventes; usa productos al agua cuando sea posible. Prepara soporte imprimado y referencia propia.", "Haz una grisalla monocroma: identifica cinco valores antes de introducir color; deja secar según el material.", "Construye mezclas de temperatura cálida/fría sin asumir un color de piel único. Compara cada mezcla con la referencia a la misma luz.", "Pinta grandes masas de frente, mejillas, mandíbula y cuello; corrige proporciones antes de los detalles.", "Añade capas finas siguiendo compatibilidad del fabricante y tiempo de secado; evita empastar zonas que necesitan bordes suaves.", "Finaliza con reflejos selectivos y una evaluación de semejanza, armonía cromática y contraste."]}, {"group": "Pintura profesional", "title": "Acuarela: arquitectura urbana y perspectiva", "level": "Intermedio · 3 sesiones", "steps": ["Elige una fotografía autorizada de una calle; dibuja horizonte y puntos de fuga antes de humedecer el papel.", "Prepara tres lavados de valor con el mismo pigmento para estudiar transparencia y control de agua.", "Pinta cielo y fachadas grandes con húmedo sobre húmedo, reservando luces del papel.", "Cuando seque, añade puertas, sombras proyectadas y detalles con pincel fino sobre seco.", "Corrige profundidad mediante contraste y temperatura: más contraste en primer plano, menos al fondo.", "Crea una segunda versión con otra hora del día y compara sombras y atmósfera."]}, {"group": "Escultura profesional", "title": "Busto anatómico en arcilla: del armazón al retrato", "level": "Avanzado · 6 sesiones", "steps": ["Prepara fotografías autorizadas frontal, perfil y tres cuartos; toma medidas relativas de altura craneal, mandíbula y cuello.", "Elige arcilla y soporte según su proceso de secado/cocción; si lleva armazón, comprueba compatibilidad con el horno y retíralo cuando sea necesario.", "Bloquea cráneo, cuello y hombros con masas grandes; gira la pieza cada pocos minutos para comprobar la silueta desde cuatro vistas.", "Sitúa plano frontal, temporales, pómulos y mandíbula; no modeles ojos ni labios antes de fijar el volumen de la cabeza.", "Construye cavidades orbitarias y volumen nasal; agrega párpados como láminas con grosor, no ojos dibujados sobre la superficie.", "Modela boca y orejas observando profundidad y asimetrías. Trabaja el cabello en masas; usa herramientas para bordes y transiciones.", "Vacía la pieza si la arcilla y el tamaño lo requieren, deja espesor uniforme y orificios de ventilación siguiendo la técnica de cocción.", "Documenta la obra desde frente, perfil y tres cuartos; evalúa semejanza, estabilidad, grietas y acabado."]}, {"group": "Escultura profesional", "title": "Relieve escultórico: composición y profundidad", "level": "Intermedio · 3 sesiones", "steps": ["Diseña un relieve de 20×20 cm con tres planos: fondo, volumen medio y volumen alto.", "Transfiere el dibujo a una placa de arcilla de espesor regular; evita partes demasiado finas.", "Añade y retira material progresivamente para modelar luz y sombra reales; comprueba la pieza con luz lateral.", "Refina transiciones y textura con estecas; evita detalles que sobresalgan sin apoyo.", "Seca lentamente y cuece solo con el procedimiento indicado por el fabricante y el taller."]}, {"group": "Marroquinería profesional", "title": "Bolso de cuero estructurado: patrón y prototipo", "level": "Avanzado · 5 sesiones", "steps": ["Define capacidad, medidas y uso: por ejemplo 28×22×9 cm; dibuja vistas frontal, lateral y superior a escala.", "Construye primero un prototipo en cartón y tela barata para verificar fuelle, apertura, asas y posición de bolsillos.", "Selecciona cuero por grosor y flexibilidad, prueba refuerzos y adhesivos en retales y añade margen de costura consistente.", "Corta con cuchilla y base apropiada; rebaja bordes que se pliegan y marca agujeros con separación uniforme.", "Cose con punto de guarnicionero, instala herrajes reforzando puntos de carga y prueba resistencia con peso gradual.", "Lija, pinta o bruñe cantos según el tipo de cuero; fotografía acabados y calcula coste de materiales y horas."]}, {"group": "Marroquinería profesional", "title": "Mosaico de cuero de Kazán: diseño contemporáneo", "level": "Avanzado · tradición tártara", "steps": ["Estudia patrones ornamentales de marroquinería tártara de Kazán en fuentes culturales; distingue piezas históricas de recreaciones modernas.", "Diseña un motivo original y define paleta de cuatro colores; numera las piezas del patrón.", "Corta retales con precisión, prueba su encaje sin superposiciones y fija temporalmente a una base.", "Ensaya costuras decorativas en una muestra; ajusta tensión para que las piezas no se deformen.", "Monta el panel en un monedero o cartera y refuerza reverso, cierres y bordes."]}, {"group": "Carpintería y artesanía", "title": "Talla escultórica de madera: hoja en bajo relieve", "level": "Intermedio · 3 sesiones", "steps": ["Selecciona madera blanda seca y sin grietas; fija la tabla con sargentos y usa protección adecuada.", "Transfiere un dibujo botánico real; decide fondo, plano intermedio y nervaduras antes de cortar.", "Rebaja el fondo con gubia en pasadas cortas siguiendo veta y siempre alejando el filo del cuerpo.", "Modela la curvatura de cada hoja con cortes progresivos; observa sombras bajo una luz lateral.", "Lija solo donde sea adecuado para conservar aristas; aplica acabado compatible y documenta el proceso."]}, {"group": "Carpintería y artesanía", "title": "Marquetería: panel geométrico de precisión", "level": "Avanzado · 4 sesiones", "steps": ["Dibuja el patrón a escala 1:1 con líneas de corte y sentido de la veta.", "Elige chapas con diferentes tonos y orientación; etiqueta cada pieza por su posición.", "Corta sobre base de seguridad con cuchilla apropiada; ensambla en seco y corrige huecos.", "Fija con cinta de marquetería y encola sobre soporte plano, prensando de forma uniforme.", "Retira cinta y lija con cuidado de no atravesar la chapa; aplica acabado y revisa juntas."]}];

const STORY_BUCKET="gyste-story-media";
let storyExpiryTimer=null;
function stopStoryTimer(){if(storyExpiryTimer!==null){clearInterval(storyExpiryTimer);storyExpiryTimer=null;}}
async function storiesView(){
 stopStoryTimer();
 const uid=me.id;
 const {data,error}=await db.from("gyste_stories").select("id,user_id,content,audience,media_path,media_type,created_at,expires_at").order("created_at",{ascending:false}).limit(80);
 if(tab!=="stories"||me?.id!==uid)return;
 if(error){shell(`<section class="panel"><h2>Historias</h2><p class="error">${esc(error.message)}</p></section>`);return;}
 const items=data||[],ids=[...new Set(items.map(s=>s.user_id))],names={},urls={};
 if(ids.length){const {data:p}=await db.from("gyste_profiles").select("user_id,display_name,avatar_url").in("user_id",ids);(p||[]).forEach(x=>names[x.user_id]=x);}
 const paths=items.map(x=>x.media_path).filter(Boolean);
 if(paths.length){const {data:m}=await db.storage.from(STORY_BUCKET).createSignedUrls(paths,60);(m||[]).forEach(x=>{if(x.path&&x.signedUrl)urls[x.path]=x.signedUrl;});}
 if(tab!=="stories"||me?.id!==uid)return;
 shell(`<section class="panel"><h2>⏳ Historias de 24 horas</h2><p>Comparte un momento con texto, foto o vídeo. Tu historia deja de aparecer tras 24 horas.</p><form id="story-form"><textarea id="story-text" class="field" maxlength="1000" placeholder="¿Qué estás haciendo hoy?"></textarea><label>Quién puede verla<select id="story-audience" class="field"><option value="mutual" selected>Seguimiento mutuo</option><option value="members">Miembros de Gyste</option><option value="only_me">Solo yo</option></select></label><label>Foto o vídeo (máximo 50 MB)<input type="file" id="story-file" class="field" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm"></label><button class="primary full" id="story-publish">Publicar historia</button><p id="story-status" role="status"></p></form></section>${items.map(s=>`<article class="post" data-story="${esc(s.id)}" data-expires="${esc(s.expires_at)}"><div class="posthead"><b>${esc(names[s.user_id]?.display_name||"Miembro")}</b><small>Caduca en ${Math.max(0,Math.ceil((new Date(s.expires_at)-Date.now())/3600000))} h</small></div><div class="bodytext">${esc(s.content)}</div>${s.media_path?urls[s.media_path]?`<div class="media-frame">${s.media_type?.startsWith("video/")?`<video class="media" controls playsinline preload="metadata" src="${esc(safeMediaUrl(urls[s.media_path]))}"></video>`:`<img class="media" alt="Historia" src="${esc(safeMediaUrl(urls[s.media_path]))}" loading="lazy">`}<button class="media-expand" type="button">⛶ Ampliar</button></div>`:'<p class="muted">Archivo temporalmente no disponible.</p>':""}${s.user_id===uid?`<button class="secondary" data-delete-story="${esc(s.id)}">Eliminar historia</button>`:""}</article>`).join("")||'<p class="panel muted">Todavía no hay historias. Publica la primera.</p>'}<button class="secondary full" id="refresh-stories">Actualizar historias</button>`);
 bindMediaActions();
 document.getElementById("refresh-stories").onclick=storiesView;
 storyExpiryTimer=setInterval(()=>{if(tab!=="stories"||!document.getElementById("story-form")){stopStoryTimer();return;}app.querySelectorAll("[data-expires]").forEach(n=>{if(Date.parse(n.dataset.expires)<=Date.now())n.remove();});},10000);
 app.querySelectorAll("[data-delete-story]").forEach(b=>b.onclick=async()=>{if(!confirm("¿Eliminar esta historia?"))return;const s=items.find(x=>x.id===b.dataset.deleteStory);if(!s)return;b.disabled=true;const {error}=await db.from("gyste_stories").delete().eq("id",s.id).eq("user_id",uid);if(error){say("No se pudo eliminar.",true);b.disabled=false;return;}if(s.media_path)await db.storage.from(STORY_BUCKET).remove([s.media_path]);say("Historia eliminada.");await storiesView();});
 document.getElementById("story-form").onsubmit=async e=>{
 e.preventDefault();const b=document.getElementById("story-publish"),status=document.getElementById("story-status"),content=document.getElementById("story-text").value.trim(),audience=document.getElementById("story-audience").value,file=document.getElementById("story-file").files[0];
 if(b.disabled||(!file&&!content))return;if(file&&(!MEDIA_TYPES.includes(file.type)||file.size>MAX_POST_BYTES)){status.textContent="Formato incompatible o archivo superior a 50 MB.";return;}
 b.disabled=true;let path=null,committed=false;try{const id=crypto.randomUUID();
 if(file){const ext=({"image/jpeg":"jpg","image/png":"png","image/webp":"webp","video/mp4":"mp4","video/webm":"webm"})[file.type];path=uid+"/"+id+"."+ext;status.textContent="Subiendo archivo…";const {error}=await db.storage.from(STORY_BUCKET).upload(path,file,{contentType:file.type,upsert:false});if(error)throw error;}
 const {error}=await db.from("gyste_stories").insert({id,user_id:uid,content,audience,media_path:path,media_type:file?.type||null});if(error)throw error;committed=true;say("Historia publicada durante 24 horas.");if(tab==="stories")await storiesView();
 }catch(e){if(path&&!committed)await db.storage.from(STORY_BUCKET).remove([path]);status.textContent="No se pudo publicar la historia.";}finally{b.disabled=false;}
 };
}

const pageKey=uid=>"gyste-pages-v1:"+uid;
function pageFollows(){try{const v=JSON.parse(localStorage.getItem(pageKey(me?.id))||"[]");return new Set(Array.isArray(v)?v.filter(x=>GYSTE_PAGES.some(p=>p[0]===x)):[]);}catch{return new Set();}}
function pageCard(p){const [id,icon,name,desc,url,view]=p,has=pageFollows().has(id);return `<article class="panel"><div class="section-heading"><b>${icon} ${esc(name)}</b><button class="secondary" data-page-follow="${id}" aria-pressed="${has}">${has?"Siguiendo":"Seguir"}</button></div><p>${esc(desc)}</p>${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Consultar fuente externa ↗</a>`:`<button class="text-link" data-tab="${view}">Abrir contenido</button>`}</article>`;}
function pagesView(){const f=pageFollows();shell(`<section class="panel"><h2>Páginas y noticias</h2><p>Selecciona las fuentes que te interesan. Tu seguimiento se guarda en este navegador; las fuentes externas no publican automáticamente en Gyste.</p><h3>Mis páginas (${f.size})</h3>${GYSTE_PAGES.filter(p=>f.has(p[0])).map(pageCard).join("")||"<p>Aún no sigues páginas.</p>"}<h3>Descubrir páginas</h3>${GYSTE_PAGES.filter(p=>!f.has(p[0])).map(pageCard).join("")}</section>`);}
function pageShelf(mode){const f=pageFollows(),pages=mode==="following"?GYSTE_PAGES.filter(p=>f.has(p[0])):GYSTE_PAGES.slice(0,5);return `<section class="panel"><div class="section-heading"><h2>${mode==="following"?"Tus páginas":"Páginas recomendadas"}</h2><button class="text-link" data-tab="pages">Ver todas</button></div><div style="display:flex;gap:10px;overflow-x:auto">${pages.map(p=>`<div style="flex:0 0 min(85%,280px)">${pageCard(p)}</div>`).join("")||"<p>Elige páginas que te interesen.</p>"}</div><p class="muted">Fuentes de consulta, no noticias en directo.</p></section>`;}
function bindPageFollows(){app.querySelectorAll("[data-page-follow]").forEach(b=>b.onclick=()=>{const uid=me?.id,id=b.dataset.pageFollow;if(!uid||!GYSTE_PAGES.some(p=>p[0]===id))return;const f=pageFollows();f.has(id)?f.delete(id):f.add(id);try{localStorage.setItem(pageKey(uid),JSON.stringify([...f]));}catch{return say("No se pudo guardar el seguimiento.",true);}if(tab==="pages")pagesView();else{b.textContent=f.has(id)?"Siguiendo":"Seguir";b.setAttribute("aria-pressed",String(f.has(id)));if(homeFilter==="following"&&!f.has(id))b.closest("article")?.remove();}});}
async function goReelCompose(){
 sharedPostId=null;selectedSpaceId=null;homeFilter="all";tab="feed";await renderTab();
 if(tab!=="feed")return;
 const input=document.getElementById("media"),button=document.getElementById("publish"),audience=document.getElementById("audience"),status=document.getElementById("media-selection");
 if(!input||!button||!audience||!status)return;
 input.accept="video/mp4,video/webm";input.multiple=true;audience.value="only_me";audience.onchange?.();
 const label=input.closest("label");if(label?.firstChild?.nodeType===3)label.firstChild.textContent="Vídeos para Reels (hasta 10, 50 MB por vídeo)";
 const hint=document.createElement("p");hint.className="muted";hint.textContent="Selecciona varios vídeos juntos o añade uno tras otro. Cada vídeo se guarda como un Reel independiente. Revisa la privacidad: empieza en Solo yo.";input.parentElement.insertBefore(hint,input);
 const list=document.createElement("div");input.parentElement.append(list);
 const feedback=document.createElement("p");feedback.id="reel-upload-status";feedback.setAttribute("role","status");feedback.setAttribute("aria-live","polite");button.insertAdjacentElement("afterend",feedback);
 const preview=document.createElement("video");preview.controls=true;preview.playsInline=true;preview.preload="metadata";preview.hidden=true;preview.style.cssText="width:100%;max-height:32dvh;object-fit:contain;background:#05090e";input.parentElement.append(preview);
 let objectUrl="",queue=[],busy=false,previewFile=null;
 const cleanup=()=>{if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl="";}};
 const observer=new MutationObserver(()=>{if(!input.isConnected){cleanup();observer.disconnect();}});observer.observe(app,{childList:true,subtree:true});
 const isVideo=f=>!!f&&["video/mp4","video/webm"].includes(f.type)&&f.size>0&&f.size<=MAX_POST_BYTES;
 const redraw=()=>{list.replaceChildren();status.textContent=queue.length+" vídeo(s) seleccionados. Puedes añadir más.";button.disabled=busy||!queue.length;button.textContent=busy?"Publicando…":queue.length>1?"Compartir "+queue.length+" Reels":"Compartir Reel";input.disabled=busy;
 if(previewFile!==queue[0]){cleanup();previewFile=queue[0];preview.removeAttribute("src");preview.hidden=!previewFile;if(previewFile){objectUrl=URL.createObjectURL(previewFile);preview.src=objectUrl;}}
 queue.forEach((f,i)=>{const row=document.createElement("div");row.className="row";const name=document.createElement("span");name.textContent=(i+1)+". "+f.name+" · "+(f.size/1048576).toFixed(1)+" MB";const remove=document.createElement("button");remove.type="button";remove.className="secondary";remove.textContent="Quitar";remove.disabled=busy;remove.onclick=()=>{queue.splice(i,1);redraw();};row.append(name,remove);list.append(row);});};
 input.onchange=()=>{let rejected=0;for(const f of Array.from(input.files||[])){if(!isVideo(f)||queue.length>=MAX_POST_FILES){rejected++;continue;}if(!queue.some(x=>x.name===f.name&&x.size===f.size&&x.lastModified===f.lastModified))queue.push(f);}input.value="";redraw();feedback.textContent=rejected?"Algunos archivos no se añadieron: máximo 10 vídeos MP4/WebM de 50 MB cada uno.":"";};
 button.onclick=async()=>{if(busy||!queue.length)return;busy=true;redraw();const total=queue.length,uid=me.id;let saved=0,warnings=0;
 try{while(queue.length&&input.isConnected&&me?.id===uid){feedback.textContent="Guardando Reel "+(saved+1)+" de "+total+"…";const result=await publish({reelFile:queue[0],batch:true});if(!result?.ok)break;if(result.warning)warnings++;queue.shift();saved++;if(input.isConnected)redraw();}
 if(input.isConnected&&saved===total){reelVideoKey="";tab="reels";say(saved+" Reel(s) guardado(s)."+(warnings?" Algunos quedaron solo para ti por un error de audiencia.":""));await renderTab();window.scrollTo({top:0});}
 else if(input.isConnected&&saved){feedback.textContent=saved+" Reel(s) guardado(s). Los restantes siguen seleccionados; vuelve a intentar.";}}
 finally{busy=false;if(input.isConnected)redraw();}};
 redraw();input.scrollIntoView({block:"center"});
}
function reelSwipeDirection(dx,dy){return Math.abs(dy)>=65&&Math.abs(dy)>Math.abs(dx)*1.5?(dy<0?1:-1):0;}
let reelViewEpoch=0,reelVideoKey="";
async function reelsView(){
 const epoch=++reelViewEpoch,uid=me?.id,valid=()=>tab==="reels"&&me?.id===uid&&epoch===reelViewEpoch;
 shell('<section class="panel"><h2>▶ Reels</h2><p role="status">Buscando vídeos…</p></section>');
 try{
 const {data,error}=await db.from("posts").select(POST_COLUMNS+(spacesReady?",space_id":"")).order("created_at",{ascending:false}).limit(150);
 if(!valid())return;if(error)throw error;
 const items=(data||[]).filter(p=>postMediaItems(p).some(m=>m.type?.startsWith("video/")));
 await prepareCards(items);if(!valid())return;
 const entries=items.flatMap(p=>postMediaItems(p).map((m,i)=>({p,m,key:p.id+":"+i})).filter(x=>x.m.type?.startsWith("video/")));
 shell(`<section class="panel"><h2>▶ Reels</h2><div class="actions"><button class="secondary" id="reelprev">↑ Anterior</button><span id="reelcount" role="status"></span><button class="secondary" id="reelnext">Siguiente ↓</button></div><div id="reelstage"></div><button class="primary full" id="reelpublish">+ Publicar Reels</button><button class="secondary full" data-tab="videos">Biblioteca de vídeos</button></section>`);
 const stage=document.getElementById("reelstage"),count=document.getElementById("reelcount"),prev=document.getElementById("reelprev"),next=document.getElementById("reelnext");let index=Math.max(0,entries.findIndex(x=>x.key===reelVideoKey)),serial=0;
 async function draw(){
 const n=++serial,active=()=>valid()&&n===serial&&stage.isConnected;
 stage.querySelectorAll("video").forEach(v=>v.pause());prev.disabled=index<=0;next.disabled=index>=entries.length-1;count.textContent=entries.length?"Reel "+(index+1)+" de "+entries.length:"0 Reels";
 const x=entries[index];if(!x){stage.innerHTML='<p>No hay vídeos disponibles entre las publicaciones recientes. Publica un vídeo propio para empezar.</p>';return;}
 reelVideoKey=x.key;stage.innerHTML='<p role="status">Preparando vídeo…</p>';
 let url=mediaItemUrl(x.m,x.p);if(!url&&x.m.path){try{const bucket=bucketFor(x.p),ttl=bucket===PRIVATE_BUCKET?300:MEDIA_SIGNED_URL_TTL;const {data,error}=await db.storage.from(bucket).createSignedUrl(x.m.path,ttl);if(!active())return;if(!error&&data?.signedUrl){mediaUrlCache.set(bucket+":"+x.m.path,{url:data.signedUrl,expiresAt:Date.now()+ttl*1000});url=mediaItemUrl(x.m,x.p);}}catch{}}
 if(!active())return;
 stage.innerHTML=`<div class="actions"><button class="primary" id="reelplay" ${url?"":"disabled"}>▶ Reproducir</button><button class="secondary" id="reelretry">Recargar vídeo</button>${url?'<button class="secondary" id="reel-full">⛶ Ampliar</button>':""}</div><p id="reelstatus" role="status">${url?"Cargando vídeo…":"No se pudo obtener el vídeo. Revisa tu acceso o vuelve a intentarlo."}</p>${url?`<video id="reelvideo" controls playsinline preload="metadata" style="display:block;width:100%;height:clamp(150px,47dvh,440px);touch-action:pan-x pinch-zoom;object-fit:contain;background:#05090e;border-radius:12px" src="${esc(url)}"></video>`:""}${postCard(x.p,postAuthors[x.p.user_id]||(x.p.user_id===uid?me:null),"")}`;
 const v=document.getElementById("reelvideo"),play=document.getElementById("reelplay"),status=document.getElementById("reelstatus");
 document.getElementById("reelretry").onclick=()=>{if(x.m.path)mediaUrlCache.delete(bucketFor(x.p)+":"+x.m.path);return draw();};
 if(v){let touchStart=null;v.addEventListener("touchstart",e=>{touchStart=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;},{passive:true});v.addEventListener("touchcancel",()=>{touchStart=null;});v.addEventListener("touchend",e=>{const t=e.changedTouches[0],start=touchStart;touchStart=null;if(!start||!t||!active())return;const d=reelSwipeDirection(t.clientX-start.x,t.clientY-start.y);if(d&&index+d>=0&&index+d<entries.length){index+=d;draw();}},{passive:true});const full=document.getElementById("reel-full");full.onclick=async()=>{try{if(v.requestFullscreen)await v.requestFullscreen();else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen();else status.textContent="Usa el control de pantalla completa del vídeo.";}catch{status.textContent="Usa el control de pantalla completa del vídeo.";}};const ready=()=>{if(active()){play.disabled=false;status.textContent=Number.isFinite(v.duration)?"Duración: "+Math.ceil(v.duration)+" s · Pulsa Reproducir":"Pulsa Reproducir";}};v.addEventListener("loadedmetadata",ready);if(v.readyState>=1)ready();v.addEventListener("play",()=>{if(active()){play.textContent="⏸ Pausar";status.textContent="Reproduciendo";}});v.addEventListener("pause",()=>{if(active()){play.textContent="▶ Reproducir";status.textContent="Vídeo pausado";}});v.addEventListener("ended",()=>{if(active()){play.textContent="↻ Repetir";status.textContent="Vídeo terminado";}});v.addEventListener("error",()=>{if(active()){play.disabled=true;status.textContent="No se pudo reproducir el archivo. Pulsa Recargar vídeo.";}});play.onclick=async()=>{if(!v.paused){v.pause();return;}try{if(v.ended)v.currentTime=0;await v.play();}catch{if(active())status.textContent="No se pudo iniciar. Prueba los controles del vídeo o Recargar vídeo.";}};}
 bindPostActions();
 }
 prev.onclick=()=>{if(index>0){index--;return draw();}};next.onclick=()=>{if(index<entries.length-1){index++;return draw();}};document.getElementById("reelpublish").onclick=goReelCompose;await draw();
 }catch(e){if(valid())shell(`<section class="panel"><h2>▶ Reels</h2><p class="error">No se pudieron cargar los vídeos: ${esc(e.message||"Error de conexión")}</p><button class="secondary" data-tab="reels">Reintentar</button></section>`);}
}
function historyView(){
 const cards=historicalImages.map(x=>{

 shell(`<section class="panel"><h2>Historia documental · La Habana y el mundo</h2><p>Referencias documentales para consulta; las fichas y licencias individuales aún necesitan validación. Las fotografías y reproducciones se sirven desde Wikimedia Commons: requieren conexión y su carga no está garantizada. Si alguna falla, no se sustituye por imágenes generadas.</p><p>Para el siglo XVIII se conservan mapas, pinturas y grabados, <b>no fotografías</b>. La fotografía se desarrolló durante el siglo XIX.</p></section><section class="panel"><h2>La Habana histórica</h2><div class="archive-grid">${cards}</div><p>También puedes consultar el <a href="https://www.loc.gov/resource/det.4a06698/" target="_blank" rel="noopener noreferrer">registro de una panorámica de La Habana de 1904 (Biblioteca del Congreso)</a>.</p></section><section class="panel"><h2>Explora archivos por región</h2><p><a target="_blank" rel="noopener noreferrer" href="https://commons.wikimedia.org/wiki/Category:Havana_in_the_1900s">La Habana de 1900</a> · <a target="_blank" rel="noopener noreferrer" href="https://commons.wikimedia.org/wiki/Category:Old_maps_of_Havana">Mapas antiguos de La Habana</a> · <a target="_blank" rel="noopener noreferrer" href="https://www.loc.gov/pictures/">Estados Unidos</a> · <a target="_blank" rel="noopener noreferrer" href="https://www.europeana.eu/">Europa</a> · <a target="_blank" rel="noopener noreferrer" href="https://www.ndl.go.jp/en/">Asia: Biblioteca Nacional de Japón</a></p></section><section class="panel"><h2>🔎 Tecnologías olvidadas</h2><p>Inventos del pasado que anticiparon el futuro. Consulta documentos históricos y compara prototipos con tecnologías actuales.</p><article class="archive-card"><h3>1900 · Automóviles eléctricos</h3><p>El Riker eléctrico de alrededor de 1900 se conserva en el Smithsonian.</p><a href="https://www.si.edu/object/riker-electric-automobile-ca-1900%3Anmah_840488" target="_blank" rel="noopener noreferrer">Consultar fuente original · Smithsonian</a></article><article class="archive-card"><h3>1906 · Patines con motor</h3><p>Scientific American documentó patines motorizados en abril de 1906.</p><a href="https://www.scientificamerican.com/article/motor-roller-skates/" target="_blank" rel="noopener noreferrer">Consultar fuente original · Scientific American</a></article><article class="archive-card"><h3>1918 · Patinete Autoped</h3><p>El Smithsonian conserva este vehículo motorizado fabricado en Nueva York.</p><a href="https://www.si.edu/object/nmah_746073" target="_blank" rel="noopener noreferrer">Consultar fuente original · Smithsonian</a></article><article class="archive-card"><h3>1925 · Automóvil radiocontrolado</h3><p>TIME documentó un coche conducido a distancia desde otro vehículo; no era autónomo en el sentido actual.</p><a href="https://time.com/archive/6653944/science-radio-auto/" target="_blank" rel="noopener noreferrer">Consultar fuente original · TIME, 10 de agosto de 1925</a></article><h3>Canales externos de curiosidades históricas</h3><p>Estos canales presentan historias e interpretaciones sobre inventos olvidados. Son independientes de Gyste; sus afirmaciones no han sido verificadas individualmente.</p><p><a href="https://www.youtube.com/channel/UCZDGFY74Zb16TEivl5xIjpA" target="_blank" rel="noopener noreferrer">Tecnología Olvidada</a> · <a href="https://www.youtube.com/channel/UCq6mA2UolG8cGSPDczflbkQ" target="_blank" rel="noopener noreferrer">Olvidada</a></p><p class="muted">Investiga por qué se abandonó cada invento: costes, competencia, decisiones empresariales y limitaciones técnicas. Distingue los documentos de las hipótesis; no todas las explicaciones tienen el mismo respaldo.</p></section><section class="panel"><h2>La Edad de Hielo: una investigación real</h2><p>Durante el Pleistoceno se sucedieron fases glaciares e interglaciares. En el último máximo glacial, hace aproximadamente 26.500–19.000 años, grandes mantos de hielo cubrieron zonas del norte de Europa y América. El mar estaba a un nivel inferior y hubo estepas frías habitadas por mamuts, bisontes y otros animales. No todo el planeta estaba congelado.</p><p><b>Cómo se sabe:</b> los científicos analizan testigos de hielo, sedimentos, polen fósil, huesos y cambios en la distribución de especies. Una imagen de esa época solo puede ser una reconstrucción científica o artística, nunca una fotografía.</p><p><b>Actividad:</b> compara un mapa del último máximo glacial con un mapa actual; identifica tres diferencias y explica qué evidencia permite deducirlas.</p></section>`);
}

const masterclasses=[{"area":"Dibujo realista","title":"Retrato a grafito: cabeza de tres cuartos","duration":"8 sesiones de 60–90 minutos","materials":"Papel de 180 g/m², lápices H, HB, 2B, 4B y 6B, goma moldeable, difumino, espejo y fotografía propia con luz lateral","steps":[["Preparación del modelo","Coloca una única luz a 45° y evita la luz frontal. Fotografía el rostro a la altura de los ojos, con giro de unos 30°. Trabaja a partir de esa referencia fija."],["Encuaje y silueta","Dibuja un rectángulo que delimite el cráneo completo, sin cabello decorativo. Marca altura total y ancho máximo. Comprueba la inclinación del eje central y la línea de los ojos antes de dibujar rasgos."],["Medición comparativa","Con el lápiz a brazo extendido, compara anchura de nariz con distancia entre ojos; compara mentón–nariz con nariz–cejas. Transfiere relaciones, no medidas absolutas. Verifica asimetrías del giro."],["Construcción de volúmenes","Representa frente, pómulos, mandíbula, cuenca ocular y puente nasal como planos grandes. Distingue el plano frontal del lateral de la cabeza. No traces contornos oscuros alrededor de ojos o labios."],["Mapa de cinco valores","Reserva el blanco del papel para la máxima luz. Separa luz, semitono, sombra propia, sombra proyectada y acentos. Entorna los ojos para juzgar masas, no detalles."],["Modelado anatómico","Construye los párpados envolviendo el globo ocular; la nariz por puente, alas y plano inferior; la boca por volumen del orbicular y sombra bajo labio inferior. Trabaja del valor medio al oscuro."],["Textura y bordes","Utiliza bordes duros en sombras proyectadas y blandos en transiciones de mejilla y frente. Añade cabello por grupos de mechones; evita dibujar cada pelo. Levanta luces con goma moldeable."],["Control y entrega","Invierte horizontalmente la foto del dibujo y la referencia. Corrige proporciones antes de oscurecer. Entrega retrato, esquema de planos, escala tonal y tres fotos de proceso."]],"errors":["Ojos demasiado altos: vuelve a medir cráneo y línea ocular, no corrijas solo los ojos.","Nariz plana: distingue plano inferior y sombra de contacto con el rostro.","Piel manchada: trabaja capas uniformes y limpia el difumino.","Parecido insuficiente: comprueba distancias y ángulos antes de añadir pestañas."],"assessment":"20 puntos: semejanza y proporción (6), volúmenes (6), control tonal (4), proceso documentado (4)."},{"area":"Escultura","title":"Busto anatómico en arcilla: del armazón al acabado","duration":"10 sesiones de 90 minutos","materials":"Arcilla de modelado compatible con el proceso elegido, base estable, varillas o soporte apropiado, estecas, calibre, esponja y fotografías propias frontal/lateral/¾","steps":[["Estudio de referencia","Obtén vistas frontal, perfil y tres cuartos a la misma altura. Marca anchura de cráneo, distancia mentón–coronilla y profundidad de caja craneal. Dibuja siluetas antes de tocar la arcilla."],["Soporte seguro","Prepara una base que no vuelque. Si utilizas arcilla cerámica destinada a cocción, planifica desde el principio el vaciado y el secado; no introduzcas soportes incompatibles en el horno."],["Bloqueo de masas","Levanta primero caja craneal, cuello y cintura escapular. Comprueba perfil y frente a cada adición. Mantén simetría estructural antes de introducir expresiones faciales."],["Planos del cráneo","Localiza arco superciliar, pómulos, mandíbula y mentón. Usa el calibre para comprobar anchuras. Observa que el cráneo continúa detrás de la oreja; evita una cabeza aplanada."],["Órbitas y nariz","Excava suavemente la cuenca antes de añadir párpados. Construye nariz desde puente, cartílagos y base, no como una pieza triangular pegada. Controla proyección en perfil."],["Boca y orejas","Modela el cilindro dental bajo los labios; sitúa comisuras en relación con el eje de la cara. Construye orejas por masas: hélix, antihélix, concha y lóbulo, evitando surcos decorativos excesivos."],["Superficie y carácter","Establece primero planos grandes y transición de luces. Después introduce arrugas o textura únicamente donde expliquen anatomía o expresión. Examina la escultura con una luz lateral."],["Preparación final","Para pieza cerámica: ahueca según grosor y recomendaciones de la arcilla, permite secado uniforme y cuece solo con equipamiento y supervisión adecuados. Para arcilla no cocible: sigue su ficha técnica."],["Evaluación tridimensional","Fotografía 8 ángulos, incluido perfil estricto. Corrige cabeza demasiado pequeña, cuello cilíndrico y mandíbula sin articulación. Entrega vistas, medidas y registro de cambios."]],"errors":["Cráneo sin profundidad: revisa la vista de perfil antes de trabajar ojos.","Ojos saltones: construye primero la órbita y luego los párpados.","Cuello como tubo: incorpora esternocleidomastoideo y trapecio como grandes masas.","Grietas en cerámica: evita secados desiguales y respeta el proceso de vaciado."],"assessment":"20 puntos: proporciones (5), lectura anatómica en 360° (7), acabado (4), documentación y seguridad (4)."},{"area":"Marroquinería","title":"Cartera bifold de cuero: patrón, rebajado y costura a mano","duration":"6 sesiones de 90 minutos","materials":"Cuero curtido apropiado (1,0–1,5 mm para bolsillos), cartulina de patrón, cuchilla afilada, regla metálica, tabla de corte, compás, sacabocados/tenedor de costura, hilo encerado, dos agujas de guarnicionero, cola apta para cuero y bruñidor","steps":[["Diseño funcional","Define tamaño cerrado aproximado 11 × 9 cm y capacidad de billetes/tarjetas. Dibuja el patrón a escala real; reserva holguras para pliegue, grosor de capas y costuras. Crea primero una maqueta de papel."],["Prueba de capacidad","Introduce tarjetas y billetes en la maqueta. Verifica que el pliegue central no fuerza los bolsillos. Ajusta patrón antes de cortar cuero."],["Selección y dirección","Examina marcas, flexibilidad y grosor. Orienta piezas considerando dirección de estiramiento. Identifica exterior, forro y bolsillos; marca reversos discretamente."],["Corte y rebajado","Corta con pasadas controladas, regla y base estable, siempre alejando la cuchilla del cuerpo. Rebaja los bordes de solape y pliegue para reducir volumen sin debilitar la costura."],["Encolado y alineación","Presenta en seco. Aplica adhesivo según ficha del fabricante, ventila el espacio y une solo tras confirmar escuadra. Prensa sin deformar bolsillos."],["Marcado de puntadas","Traza línea de costura paralela al borde (por ejemplo 3–4 mm, ajustada al diseño). Marca paso uniforme con herramienta adecuada. Evita perforar a ciegas capas desplazadas."],["Puntada de guarnicionero","Con dos agujas e hilo encerado, cruza cada puntada con tensión constante. Practica en retales antes de coser la pieza. Remata sin nudos voluminosos en zonas de roce."],["Cantos y acabado","Iguala cantos, lija progresivamente, aplica producto compatible y bruñe. Redondea esquinas y comprueba que no quedan fibras levantadas ni restos de adhesivo."],["Control de calidad","Introduce tarjetas reales y abre/cierra 30 veces. Comprueba costuras, deslizamiento, pliegue, simetría y espesor. Fotografía patrón, maqueta, costura y producto final."]],"errors":["Bolsillos muy apretados: aumenta holgura en el patrón, no estires a la fuerza.","Borde grueso: rebaja antes de encolar y cose sobre muestra.","Costura ondulada: guía la línea y controla tensión puntada a puntada.","Pliegue abultado: revisa superposición de capas cerca del centro."],"assessment":"20 puntos: patrón y capacidad (6), corte/rebajado (4), costura (6), acabado (4)."},{"area":"Pintura","title":"Bodegón al óleo: composición, color y capas","duration":"7 sesiones de 90 minutos","materials":"Lienzo imprimado, pinturas al óleo, pinceles planos y redondos, paleta, trapos, recipiente con tapa y disolventes solo si son adecuados y con ventilación; alternativa: óleo soluble en agua","steps":[["Composición","Dispón tres objetos con materiales distintos y una luz lateral estable. Realiza cinco miniaturas en dos valores para elegir una composición con jerarquía visual."],["Dibujo y proporción","Encaja grandes formas, elipses y ejes. Comprueba verticales y horizontales; evita perfilar cada objeto con negro."],["Estudio tonal","Reduce la escena a tres valores. Reserva el mayor contraste para el centro de interés y controla el valor del fondo."],["Mezclas de color","Construye una carta de mezclas para luces, semitonos y sombras. Compara temperatura y valor antes de saturación; no aclares automáticamente todo con blanco."],["Primera mancha","Aplica capas delgadas para bloquear grandes masas. Mantén las sombras simples y transparentes cuando corresponda al material y al método."],["Volumen y materia","Diferencia metal, cerámica y fruta mediante bordes, reflejos y transición de valores. Trabaja primero masas grandes, después acentos."],["Revisión y conservación","Comprueba la obra en espejo, corrige elipses y relaciones de color. Respeta tiempos de secado, manejo de residuos y recomendaciones de materiales."]],"errors":["Objetos flotantes: corrige sombras de contacto.","Colores apagados: revisa mezclas excesivas y contraste de temperatura.","Todos los bordes iguales: jerarquiza bordes según foco."],"assessment":"20 puntos: composición (5), dibujo (5), color (6), proceso (4)."}];
function masterclassPanel(){
 return `<section class="panel"><h2>Clases magistrales · Taller profesional</h2><p>Cuatro proyectos completos con procedimientos, errores frecuentes y criterios de evaluación. Material escrito para práctica real; no se presenta como vídeo ni fotografía.</p><label for="masterclass-select">Elegir taller</label><select class="field" id="masterclass-select">${masterclasses.map((m,i)=>`<option value="${i}">${esc(m.area)} · ${esc(m.title)}</option>`).join('')}</select><div id="masterclass-detail"></div></section>`;
}
function activateMasterclasses(){
 const sel=document.getElementById('masterclass-select'),out=document.getElementById('masterclass-detail');if(!sel||!out)return;
 const render=()=>{const m=masterclasses[Number(sel.value)];if(!m)return;out.innerHTML=`<article class="lesson" style="padding:16px;margin-top:12px;border:1px solid #8995a340;border-radius:12px"><h3>${esc(m.title)}</h3><p><b>Duración sugerida:</b> ${esc(m.duration)}</p><p><b>Materiales:</b> ${esc(m.materials)}</p><h4>Demostración técnica paso a paso</h4><ol>${m.steps.map(s=>`<li style="margin-bottom:12px"><b>${esc(s[0])}.</b> ${esc(s[1])}</li>`).join('')}</ol><h4>Errores frecuentes y cómo corregirlos</h4><ul>${m.errors.map(e=>`<li>${esc(e)}</li>`).join('')}</ul><p><b>Evaluación:</b> ${esc(m.assessment)}</p></article>`;};sel.onchange=render;render();
}

const PRIVATE_BUCKET="gyste-private-media";
const bucketFor=p=>p.audience&&p.audience!=="public"?PRIVATE_BUCKET:BUCKET;
async function prepareMediaUrls(list){
 for(const bucket of [BUCKET,PRIVATE_BUCKET]){
 const paths=[...new Set(list.filter(p=>bucketFor(p)===bucket).flatMap(p=>postMediaItems(p).map(m=>m.path)).filter(Boolean))];
 if(!paths.length)continue;
 const ttl=bucket===PRIVATE_BUCKET?300:MEDIA_SIGNED_URL_TTL;
 const {data,error}=await db.storage.from(bucket).createSignedUrls(paths,ttl);
 if(error){console.warn("No se pudieron generar enlaces firmados",error.message);continue;}
 (data||[]).forEach(item=>{if(item.path&&item.signedUrl)mediaUrlCache.set(bucket+":"+item.path,{url:item.signedUrl,expiresAt:Date.now()+ttl*1000});});
 }
}
function safeMediaUrl(value){
 try{const u=new URL(value,location.href);return u.protocol==="https:"?u.href:"";}catch{return "";}
}

const MEDIA_TYPES=["image/jpeg","image/png","image/webp","video/mp4","video/webm"];
const MEDIA_MANIFEST="gyste-gallery-v1:";
const MAX_POST_FILES=10;
const MAX_POST_BYTES=50*1024*1024;
function postMediaItems(p){
 if(typeof p.media_url==="string"&&p.media_url.startsWith(MEDIA_MANIFEST)){
  try{
   const items=JSON.parse(p.media_url.slice(MEDIA_MANIFEST.length));
   if(Array.isArray(items)&&items.length>=2&&items.length<=MAX_POST_FILES&&items[0]?.path===p.media_path&&items.every(m=>m&&typeof m.path==="string"&&m.path.startsWith(p.user_id+"/")&&/^[0-9a-z-]+\.(jpg|png|webp|mp4|webm)$/i.test(m.path.slice(p.user_id.length+1))&&MEDIA_TYPES.includes(m.type)))return items.map(m=>({path:m.path,type:m.type,url:null}));
  }catch(e){console.warn("Galería no válida",e);}
 }
 return p.media_path||p.media_url?[{path:p.media_path,type:p.media_type,url:typeof p.media_url==="string"&&!p.media_url.startsWith(MEDIA_MANIFEST)?p.media_url:null}]:[];
}
function mediaItemUrl(m,p){
 const bucket=bucketFor(p);
 if(m.path){
  const cached=mediaUrlCache.get(bucket+":"+m.path);
  if(cached&&cached.expiresAt>Date.now()+60000)return safeMediaUrl(cached.url);
  if(bucket===BUCKET&&!MEDIA_BUCKET_PRIVATE)return safeMediaUrl(db.storage.from(BUCKET).getPublicUrl(m.path).data.publicUrl);
 }
 return bucket===PRIVATE_BUCKET||MEDIA_BUCKET_PRIVATE?"":(m.url?safeMediaUrl(m.url):"");
}
function postMediaHTML(p){
 const items=postMediaItems(p);if(!items.length)return "";
 return `<div class="media-gallery ${items.length>1?"multi":""}">${items.map((m,i)=>{
  const url=mediaItemUrl(m,p);if(!url)return '<p class="muted">Archivo no disponible temporalmente.</p>';
  const video=m.type?.startsWith("video/");
  const element=video?`<video class="media" controls playsinline preload="metadata" src="${esc(url)}"></video>`:`<img class="media" loading="lazy" src="${esc(url)}" alt="Foto ${i+1} de ${items.length}">`;
  return `<div class="media-frame ${video?"video-frame":""}">${element}<button type="button" class="media-expand">⛶ ${video?"Pantalla completa":"Ampliar foto"}</button></div>`;
 }).join("")}</div>`;
}
function bindMediaActions(){
 app.querySelectorAll(".media-expand").forEach(b=>{
  const frame=b.closest(".media-frame"),original=b.textContent;
  const refresh=()=>{b.textContent=(document.fullscreenElement===frame||frame.classList.contains("media-overlay"))?"✕ Salir de pantalla completa":original;};
  frame.addEventListener("fullscreenchange",refresh);
  b.onclick=async()=>{
   if(document.fullscreenElement===frame){await document.exitFullscreen();return;}
   if(frame.classList.contains("media-overlay")){frame.classList.remove("media-overlay");refresh();return;}
   if(frame.requestFullscreen){try{await frame.requestFullscreen();refresh();return;}catch{}}
   frame.classList.add("media-overlay");refresh();
  };
 });
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")app.querySelectorAll(".media-overlay .media-expand").forEach(b=>b.click());});

function bindVerticalVideos(items){

  bindPostActions();
 };
 prev.onclick=()=>{if(index>0){index--;draw();}};next.onclick=()=>{if(index<entries.length-1){index++;draw();}};
 draw();

 sharedPostId=null;

// Primero borra la fila protegida por RLS; después intenta limpiar el objeto.
// Esto evita dejar una publicación visible con un enlace multimedia roto.
async function deletePost(id,button){
 const post=posts.find(p=>p.id===id);
 if(!post)return say("No se encontró esta publicación. Actualiza el inicio.",true);
 if(post.user_id!==me.id)return say("Solo puedes eliminar tus propias publicaciones.",true);
 if(!confirm("¿Eliminar esta publicación? Esta acción no se puede deshacer."))return;
 if(button){button.disabled=true;button.textContent="Eliminando…";}
 try{
  const {data,error}=await db.from("posts").delete().eq("id",id).eq("user_id",me.id).select("id").maybeSingle();
  if(error)throw error;
  if(!data)throw new Error("No se confirmó el borrado; revisa los permisos de Supabase.");
  const ownedPaths=postMediaItems(post).map(m=>m.path).filter(path=>typeof path==="string"&&path.startsWith(me.id+"/"));
   if(ownedPaths.length){const {error:storageError}=await db.storage.from(bucketFor(post)).remove(ownedPaths);if(storageError)console.warn("La publicación se borró, pero quedaron archivos pendientes de limpieza:",storageError.message);}
  posts=posts.filter(p=>p.id!==id);
  ownedPaths.forEach(path=>mediaUrlCache.delete(bucketFor(post)+":"+path));
  say("Publicación eliminada.");await renderTab();
 }catch(e){say("No se pudo eliminar: "+(e?.message||"Error"),true);if(button){button.disabled=false;button.textContent="🗑 Eliminar";}}
}

async function changeProfileImage(kind,file){
 if(!me||profileImageBusy||!["avatar","cover"].includes(kind))return;
 const uid=me.id,key=kind+"_url";
 const extensions={"image/jpeg":"jpg","image/png":"png","image/webp":"webp"};
 if(file&&(!Object.hasOwn(extensions,file.type)||file.size>PROFILE_MAX_BYTES||!file.size))return profilePhotoStatus("Elige una imagen JPG, PNG o WebP de hasta 5 MB.",true);
 profileImageBusy=true;
 app.querySelectorAll("[data-photo-pick],[data-photo-remove]").forEach(b=>b.disabled=true);
 const storage=db.storage.from(PROFILE_BUCKET);let newPath=null;let oldPath=null;
 try{
  profilePhotoStatus(file?"Subiendo fotografía…":"Quitando fotografía…");
  const current=await db.from("gyste_profiles").select(key).eq("user_id",uid).single();
  if(current.error)throw current.error;
  oldPath=ownProfileImagePath(current.data?.[key],uid);
  let url=null;
  if(file){
   newPath=`${uid}/${kind}-${crypto.randomUUID()}.${extensions[file.type]}`;
   const up=await storage.upload(newPath,file,{contentType:file.type,cacheControl:"3600",upsert:false});
   if(up.error)throw up.error;
   url=storage.getPublicUrl(newPath).data.publicUrl;
   if(!profileImageUrl(url))throw new Error("No se obtuvo un enlace de imagen válido.");
  }
  if(me?.id!==uid)throw new Error("La sesión ha cambiado. Vuelve a intentarlo.");
  const saved=await db.from("gyste_profiles").update({[key]:url,updated_at:new Date().toISOString()}).eq("user_id",uid).select().single();
  if(saved.error)throw saved.error;
  if(me?.id===uid){me={...me,...saved.data};refreshProfilePhotoControls();}
  // Remove only objects belonging to this account, after the database update succeeds.
  // Avoid deleting on uncertain network failures (the saved URL may already be in use).
  let cleanupError=false;
  if(oldPath&&oldPath!==newPath){try{const result=await storage.remove([oldPath]);cleanupError=Boolean(result.error);}catch{cleanupError=true;}}
  if(me?.id===uid)profilePhotoStatus((file?"Fotografía guardada.":"Fotografía quitada del perfil.")+(cleanupError?" No se pudo limpiar el archivo anterior.":""),cleanupError);
 }catch(e){if(me?.id===uid)profilePhotoStatus("No se pudo completar el cambio: "+(e?.message||"revisa la conexión")+". Actualiza el perfil antes de reintentar.",true);}
 finally{profileImageBusy=false;app.querySelectorAll("[data-photo-pick],[data-photo-remove]").forEach(b=>b.disabled=false);}
}

// No afirma ofrecer cifrado de extremo a extremo ni notificaciones push.
let chatRefreshTimer=null;
let chatRenderSignature="";
function stopChatRefresh(){if(chatRefreshTimer){clearInterval(chatRefreshTimer);chatRefreshTimer=null;}}
const CHAT_BUCKET="gyste-chat-media";
const CHAT_AUDIO_TYPES=["audio/webm","audio/mp4","audio/ogg","audio/mpeg","audio/wav"];
const chatFileType=f=>String(f?.type||"").split(";")[0].toLowerCase();
let voiceCapture=null,voiceDraft=null,voiceDraftUrl=null;
function clearVoiceDraft(){voiceDraft=null;if(voiceDraftUrl)URL.revokeObjectURL(voiceDraftUrl);voiceDraftUrl=null;}
function stopVoiceCapture(){if(voiceCapture){const v=voiceCapture;voiceCapture=null;v.cancelled=true;clearTimeout(v.timer);if(v.rec.state!=="inactive")v.rec.stop();v.stream.getTracks().forEach(t=>t.stop());}clearVoiceDraft();}
const chatMediaCache=new Map();
async function prepareChatMedia(items){
 const paths=[...new Set((items||[]).map(m=>m.media_path).filter(Boolean))].filter(p=>!chatMediaCache.has(p)||chatMediaCache.get(p).expires<Date.now()+30000);
 if(!paths.length)return;
 const {data,error}=await db.storage.from(CHAT_BUCKET).createSignedUrls(paths,300);
 if(error)return;
 for(const item of data||[])if(item.path&&item.signedUrl)chatMediaCache.set(item.path,{url:item.signedUrl,expires:Date.now()+300000});
}
function chatAttachment(m){
 if(!m.media_path)return "";
 const entry=chatMediaCache.get(m.media_path),url=entry&&entry.expires>Date.now()?safeMediaUrl(entry.url):"";
 if(!url)return '<p class="muted">Archivo no disponible. Actualiza la conversación.</p>';
 if(m.media_type?.startsWith("audio/"))return `<audio controls preload="none" style="width:100%;max-width:100%" src="${esc(url)}"></audio>`;
 const video=m.media_type?.startsWith("video/");
 return `<div class="media-frame" style="max-width:100%;margin:8px 0;text-align:center">${video?`<video class="media" controls playsinline preload="metadata" src="${esc(url)}"></video>`:`<img class="media" loading="lazy" alt="Fotografía privada" src="${esc(url)}">`}<button type="button" class="media-expand">⛶ ${video?"Pantalla completa":"Ampliar foto"}</button></div>`;
}
function chatBody(content){
 const s=String(content||""),match=s.match(/(?:^|\n)📎 Publicación de Gyste: ([^\s]+)$/);if(!match)return esc(s);
 try{const u=new URL(match[1]);const id=u.searchParams.get("post");if(u.origin!==location.origin||!id||!/^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$/i.test(id))return esc(s);return esc(s.slice(0,match.index).trim())+`<div><button type="button" class="secondary" data-chat-post="${esc(id)}">▶ Ver publicación compartida</button></div>`;}catch{return esc(s);}
}
function chatMarkup(items){return (items||[]).map(m=>`<div class="comment" style="text-align:${m.sender_id===me.id?"right":"left"}"><div class="comment-author" style="justify-content:${m.sender_id===me.id?"flex-end":"flex-start"}"><span class="face">${avatarContent(m.sender_id===me.id?me:chatPeerProfile)}</span></div><div class="bodytext">${chatBody(m.content)}</div>${chatAttachment(m)}<small>${time(m.created_at)}</small></div>`).join("")||'<p class="muted">Inicia la conversación.</p>';}

  if(ids.length){const {data:u}=await db.from("gyste_profiles").select("user_id,display_name,avatar_url").in("user_id",ids);(u||[]).forEach(x=>map[x.user_id]=x);}
  if(!valid())return;
  shell(`<section class="panel"><h2>Gyste Chat</h2><p class="muted">Mensajería privada entre miembros. Abre un perfil desde Descubrir para iniciar una conversación.</p>${ids.map(id=>{const last=(data||[]).find(m=>m.sender_id===id||m.recipient_id===id);const unread=(data||[]).filter(m=>m.sender_id===id&&m.recipient_id===me.id&&!m.read_at).length;return `<div class="userrow"><span class="face">${avatarContent(map[id])}</span><div class="userinfo"><b>${esc(map[id]?.display_name||"Miembro")}</b>${unread?` <strong aria-label="Mensajes sin leer">(${unread} nuevos)</strong>`:""}<small class="muted" style="display:block">${esc((last?.content||"").slice(0,100))}</small></div><button class="secondary" data-openchat="${esc(id)}">Abrir</button></div>`;}).join("")||'<p class="muted">Aún no tienes conversaciones.</p>'}</section>`);
  // Permite iniciar una conversación sin tener mensajes previos.
  const panel=document.querySelector(".panel");
  if(panel){
   const finder=document.createElement("div");
   finder.style.marginBottom="18px";
   finder.innerHTML='<label for="chatfind"><b>Buscar una persona para conversar</b></label><input id="chatfind" class="field" maxlength="80" placeholder="Escribe al menos 2 letras del nombre" autocomplete="off"><div id="chatresults" aria-live="polite"></div>';
   panel.insertBefore(finder,panel.children[2]||null);
   let searchSerial=0;
   document.getElementById("chatfind").addEventListener("input",async function(){
    const q=this.value.trim();const results=document.getElementById("chatresults");const serial=++searchSerial;
    if(q.length<2){results.textContent="";return;}
    results.textContent="Buscando…";
    const {data:people,error:searchError}=await db.from("gyste_profiles").select("user_id,display_name").ilike("display_name","%"+q.replace(/[%_,]/g,"")+"%").neq("user_id",me.id).limit(15);
    if(serial!==searchSerial||!valid()||!results.isConnected)return;
    results.replaceChildren();
    if(searchError){results.textContent="No se pudo buscar: "+searchError.message;return;}
    if(!people?.length){results.textContent="No se encontraron miembros.";return;}
    for(const person of people){
     const line=document.createElement("div");line.className="userrow";
     const name=document.createElement("span");name.textContent=person.display_name||"Miembro";
     const open=document.createElement("button");open.className="secondary";open.textContent="Conversar";
     open.onclick=()=>{chatUser=person.user_id;messagesView();};
     line.append(name,open);results.append(line);
    }
   });
  }
  document.querySelectorAll("[data-openchat]").forEach(b=>{b.onclick=()=>{chatUser=b.dataset.openchat;messagesView();};});
  return;
 }
 const target=chatUser;
 if(target===me.id){chatUser=null;return messagesView();}
 const {data:person,error:personError}=await db.from("gyste_profiles").select("display_name,avatar_url").eq("user_id",target).maybeSingle();
 if(!valid())return;
 if(personError){shell(`<p class="error">No se pudo cargar el perfil: ${esc(personError.message)}</p>`);return;}
 chatPeerProfile=person;
 shell(`<section class="panel"><button id="back" class="ghost">← Conversaciones</button><button id="block-chat" class="secondary">Bloquear usuario</button><h2 class="comment-author"><span class="face">${avatarContent(person)}</span>${esc(person?.display_name||"Conversación")}</h2><p class="muted">Gyste Chat · texto, voz, fotos y vídeos privados</p><div id="chatlist" aria-live="polite" style="max-height:55vh;min-height:130px;overflow:auto"></div><p id="chatstatus" class="error" role="status"></p><form id="sendmsg"><div class="commentform"><input id="msg" class="field" maxlength="5000" placeholder="Escribe un mensaje…" aria-label="Mensaje" autocomplete="off"><button id="sendmsgbtn" class="primary">Enviar</button></div><label class="muted">📎 Adjuntar foto, vídeo o audio (máx. 50 MB)<input id="chatfile" class="field" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm,audio/webm,audio/mp4,audio/ogg,audio/mpeg,audio/wav"></label><p class="muted" id="chatfile-status" aria-live="polite"></p><div class="actions"><button type="button" class="secondary" id="voice-record">🎙 Grabar voz</button><button type="button" class="secondary" id="voice-cancel" hidden>Cancelar audio</button></div><div id="voice-preview" aria-live="polite"></div><p class="muted">Los participantes pueden conservar o copiar los archivos que reciben.</p></form></section>`);
 document.getElementById("back").onclick=()=>{stopVoiceCapture();stopChatRefresh();chatUser=null;messagesView();};
 bindVoiceRecorder(target);
 document.getElementById("sendmsg").onsubmit=sendMessage;
 document.getElementById("chatfile").onchange=e=>{stopVoiceCapture();resetVoiceUI();const f=e.target.files[0];document.getElementById("chatfile-status").textContent=f?f.name+" · "+(f.size/1048576).toFixed(1)+" MB":"";};
 document.getElementById("block-chat").onclick=e=>blockUser(target,e.currentTarget);
 await refreshChatMessages(target,true);
 if(valid())chatRefreshTimer=setInterval(()=>{if(document.visibilityState!=="hidden")refreshChatMessages(target,true);},8000);
}
function resetVoiceUI(){
 const b=document.getElementById("voice-record"),cancel=document.getElementById("voice-cancel"),preview=document.getElementById("voice-preview");
 if(b){b.textContent="🎙 Grabar voz";b.disabled=false;}if(cancel)cancel.hidden=true;if(preview)preview.replaceChildren();
}
function bindVoiceRecorder(target){
 const record=document.getElementById("voice-record"),cancel=document.getElementById("voice-cancel"),preview=document.getElementById("voice-preview");
 cancel.onclick=()=>{stopVoiceCapture();resetVoiceUI();};
 record.onclick=async()=>{
 if(voiceCapture){const v=voiceCapture;if(v.rec.state==="recording"){clearTimeout(v.timer);v.rec.stop();record.disabled=true;}return;}
 if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==="undefined"){preview.textContent="Este navegador no permite grabar voz. Puedes adjuntar un audio.";return;}
 clearVoiceDraft();preview.textContent="Solicitando permiso de micrófono…";record.disabled=true;
 let stream;
 try{
 stream=await navigator.mediaDevices.getUserMedia({audio:true});
 if(tab!=="messages"||chatUser!==target||!record.isConnected){stream.getTracks().forEach(t=>t.stop());return;}
 const mime=["audio/webm;codecs=opus","audio/mp4","audio/ogg;codecs=opus"].find(t=>MediaRecorder.isTypeSupported(t));
 const rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined),chunks=[];
 const v={rec,stream,cancelled:false,timer:null};voiceCapture=v;
 rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
 rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());clearTimeout(v.timer);if(voiceCapture===v)voiceCapture=null;if(v.cancelled||tab!=="messages"||chatUser!==target||!record.isConnected)return;
 const type=(rec.mimeType||chunks[0]?.type||"audio/webm").split(";")[0];
 const blob=new Blob(chunks,{type});resetVoiceUI();
 if(!CHAT_AUDIO_TYPES.includes(type)||!blob.size||blob.size>MAX_POST_BYTES){preview.textContent="No se pudo guardar esta grabación.";return;}
 voiceDraft=blob;voiceDraftUrl=URL.createObjectURL(blob);const audio=document.createElement("audio");audio.controls=true;audio.src=voiceDraftUrl;audio.style.width="100%";preview.append("Audio listo. Escúchalo y pulsa Enviar.",audio);cancel.hidden=false;document.getElementById("chatfile").value="";document.getElementById("chatfile-status").textContent="";
 };
 rec.onerror=()=>{stopVoiceCapture();resetVoiceUI();preview.textContent="Error al grabar audio.";};
 rec.start();record.disabled=false;record.textContent="■ Detener grabación";cancel.hidden=false;preview.textContent="Grabando… máximo 2 minutos.";v.timer=setTimeout(()=>{if(rec.state==="recording")rec.stop();},120000);
 }catch(e){if(stream)stream.getTracks().forEach(t=>t.stop());resetVoiceUI();preview.textContent="No se pudo acceder al micrófono. Revisa los permisos.";}
 };
}
async function sendMessage(e){
 e.preventDefault();if(!me||!chatUser)return;
 const target=chatUser,uid=me.id,input=document.getElementById("msg"),button=document.getElementById("sendmsgbtn"),fileInput=document.getElementById("chatfile");
 if(voiceCapture)return;
 const content=input?.value.trim(),file=voiceDraft||fileInput?.files?.[0],fileType=chatFileType(file);if((!content&&!file)||!button||button.disabled)return;
 const status=document.getElementById("chatstatus");
 if(file&&(![...MEDIA_TYPES,...CHAT_AUDIO_TYPES].includes(fileType)||file.size>MAX_POST_BYTES)){if(status)status.textContent="Formato no compatible o archivo superior a 50 MB.";return;}
 button.disabled=true;button.textContent=file?"Subiendo…":"Enviando…";let path=null,committed=false;
 try{
 const id=crypto.randomUUID();
 if(file){const ext=({"image/jpeg":"jpg","image/png":"png","image/webp":"webp","video/mp4":"mp4","video/webm":"webm","audio/webm":"webm","audio/mp4":"m4a","audio/ogg":"ogg","audio/mpeg":"mp3","audio/wav":"wav"})[fileType];path=uid+"/"+id+"."+ext;const {error}=await db.storage.from(CHAT_BUCKET).upload(path,file,{upsert:false,contentType:fileType});if(error)throw error;}
 const {error}=await db.from("gyste_messages").insert({id,sender_id:uid,recipient_id:target,content:content||(fileType.startsWith("audio/")?"🎙 Mensaje de voz":fileType.startsWith("video/")?"🎬 Vídeo":"📷 Fotografía"),media_path:path,media_type:fileType||null});if(error)throw error;
 committed=true;
 if(chatUser===target&&input.isConnected){input.value="";fileInput.value="";clearVoiceDraft();resetVoiceUI();document.getElementById("chatfile-status").textContent="";await refreshChatMessages(target,true);input.focus();}
 }catch(error){if(path&&!committed){try{await db.storage.from(CHAT_BUCKET).remove([path]);}catch{}}if(status&&status.isConnected)status.textContent=error.code==="42501"?"No puedes enviar mensajes debido a las preferencias de privacidad o bloqueo.":"No se pudo enviar el mensaje o archivo.";}
 finally{button.disabled=false;button.textContent="Enviar";}
}
async function start(){
try{
if(!window.supabase||typeof window.supabase.createClient!=="function"){
app.innerHTML='<section class="auth"><h1>Gyste</h1><p class="error">No se pudo cargar el servicio de conexión. Comprueba Internet y vuelve a intentarlo.</p><button class="primary full" id="retry">Reintentar</button></section>';
document.getElementById("retry").onclick=start;
return;
}
if(!db)db=window.supabase.createClient(URL_DB,KEY_DB,{
  auth:{
    persistSession:true,
    autoRefreshToken:true,
    detectSessionInUrl:true,
    storage:window.localStorage
  }
});
if(!authListener){
authListener=db.auth.onAuthStateChange((event,s)=>{
session=s;
if(event==="PASSWORD_RECOVERY"){
  recoveryView();
  return;
}
if(!s){me=null;chatUser=null;tab="feed";sharedPostId=null;selectedSpaceId=null;homeFilter="all";authView();}
});
}
const result=await Promise.race([
db.auth.getSession(),
new Promise((_,reject)=>setTimeout(()=>reject(new Error("La conexión está tardando demasiado. Comprueba Internet y pulsa Reintentar.")),15000))
]);
const {data,error}=result;
if(error)throw error;
session=data.session;
const recoveryLink=/(?:^|[&#])type=recovery(?:&|$)/i.test(window.location.hash);
if(recoveryLink&&session){recoveryView();}
else if(session)await boot();else authView();
}catch(e){
app.innerHTML=`<section class="auth"><h1>Gyste</h1><p class="error">${esc(e?.message||"No se pudo iniciar Gyste. Comprueba Internet.")}</p><button class="primary full" id="retry">Reintentar</button></section>`;
document.getElementById("retry").onclick=start;
}
}

// Renueva la vista del feed al volver a la app si los enlaces firmados están cerca de expirar.
document.addEventListener("visibilitychange",()=>{
if(document.visibilityState==="visible"&&session&&me&&tab==="feed"){
const expiring=[...mediaUrlCache.values()].some(x=>x.expiresAt<Date.now()+5*60*1000);
if(expiring)feedView();
}
});

document.addEventListener("play",e=>{if(e.target instanceof HTMLMediaElement)document.querySelectorAll("video,audio").forEach(m=>{if(m!==e.target&&!m.paused)m.pause();});},true);
window.addEventListener("pagehide",stopVoiceCapture);
start();
</script>
