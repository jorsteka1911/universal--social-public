}
let notificationEpoch=0,notificationFilter="all";
const notificationLocks=new Set();
function visibleNotifications(rows,filter){return filter==="unread"?rows.filter(n=>!n.is_read):rows;}
async function markNotificationRows(uid,ids){

function chatFileSelection(f){

 reload.onclick=async()=>{if(!valid()||reload.disabled)return;reload.disabled=true;chatMediaCache.clear();chatRenderSignature="";try{await refreshChatMessages(target,true);}finally{if(reload.isConnected)reload.disabled=false;}};
 await refreshChatMessages(target,true);
 if(valid()&&chatList?.isConnected&&document.getElementById("chatlist")===chatList){

 chatRefreshTimer=setInterval(()=>{

function resetVoiceUI(){
 const b=document.getElementById("voice-record"),cancel=document.getElementById("voice-cancel"),preview=document.getElementById("voice-preview");
 if(b){b.textContent="🎙 Grabar voz";b.disabled=false;}if(cancel)cancel.hidden=true;if(preview)preview.replaceChildren();
}
function bindVoiceRecorder(target){
 const record=document.getElementById("voice-record"),cancel=document.getElementById("voice-cancel"),preview=document.getElementById("voice-preview");
 cancel.onclick=()=>{stopVoiceCapture();resetVoiceUI();};
 record.onclick=async()=>{
 if(voiceCapture){const v=voiceCapture;if(v.rec.state==="recording"){clearTimeout(v.timer);v.rec.stop();record.disabled=true;}return;}
 if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==="undefined"){preview.textContent="Este navegador no permite grabar voz. Puedes adjuntar un audio.";return;}
 clearVoiceDraft();preview.textContent="Solicitando permiso de micrófono…";record.disabled=true;
 let stream;
 try{
 stream=await navigator.mediaDevices.getUserMedia({audio:true});
 if(tab!=="messages"||chatUser!==target||!record.isConnected){stream.getTracks().forEach(t=>t.stop());return;}
 const mime=["audio/webm;codecs=opus","audio/mp4","audio/ogg;codecs=opus"].find(t=>MediaRecorder.isTypeSupported(t));
 const rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined),chunks=[];
 const v={rec,stream,cancelled:false,timer:null};voiceCapture=v;
 rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
 rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());clearTimeout(v.timer);if(voiceCapture===v)voiceCapture=null;if(v.cancelled||tab!=="messages"||chatUser!==target||!record.isConnected)return;
 const type=(rec.mimeType||chunks[0]?.type||"audio/webm").split(";")[0];
 const blob=new Blob(chunks,{type});resetVoiceUI();
 if(!CHAT_AUDIO_TYPES.includes(type)||!blob.size||blob.size>MAX_POST_BYTES){preview.textContent="No se pudo guardar esta grabación.";return;}
 voiceDraft=blob;voiceDraftUrl=URL.createObjectURL(blob);const audio=document.createElement("audio");audio.controls=true;audio.src=voiceDraftUrl;audio.style.width="100%";preview.append("Audio listo. Escúchalo y pulsa Enviar.",audio);cancel.hidden=false;document.getElementById("chatfile").value="";updateChatFileUI();
 };
 rec.onerror=()=>{stopVoiceCapture();resetVoiceUI();preview.textContent="Error al grabar audio.";};
 rec.start();record.disabled=false;record.textContent="■ Detener grabación";cancel.hidden=false;preview.textContent="Grabando… máximo 2 minutos.";v.timer=setTimeout(()=>{if(rec.state==="recording")rec.stop();},120000);
 }catch(e){if(stream)stream.getTracks().forEach(t=>t.stop());resetVoiceUI();preview.textContent="No se pudo acceder al micrófono. Revisa los permisos.";}
 };
}
const chatSendLocks=new Set(),chatPendingSends=new WeakMap();
async function checkSentMessage(uid,target,id,path=null,type=null){
 try{
 const {data,error}=await db.from("gyste_messages").select("id,sender_id,recipient_id,media_path,media_type").eq("id",id).eq("sender_id",uid).eq("recipient_id",target).maybeSingle();
 return !error&&data?.id===id&&data.sender_id===uid&&data.recipient_id===target&&(data.media_path??null)===path&&(data.media_type??null)===type;
 }catch{return false;}
}
async function sendMessage(e){
 e.preventDefault();const form=e.currentTarget,uid=me?.id,target=chatUser,key=uid+":"+target;
 if(!uid||!target||!form||voiceCapture||chatSendLocks.has(key))return;
 const input=document.getElementById("msg"),button=document.getElementById("sendmsgbtn"),fileInput=document.getElementById("chatfile"),status=document.getElementById("chatstatus");
 if(!input||!button||!fileInput||button.disabled)return;
 const content=input.value.trim(),file=voiceDraft||fileInput.files?.[0];let fileType=chatFileType(file);const compatibility=chatPhotoCompatibility(file),force=compatibility==="convert"||Boolean(file&&fileType==="image/jpeg"&&file.type!=="image/jpeg"),light=Boolean(document.getElementById("chat-light-photo")?.checked&&compatibility!=="none");
 if(!content&&!file){if(status)status.textContent="Escribe un mensaje o selecciona una fotografía antes de enviar.";return;}
 if(content.length>5000||file&&(!chatFileSelection(file).ok)){if(status)status.textContent="Revisa el texto o el formato y tamaño del archivo (máximo 50 MB).";return;}
 const active=()=>me?.id===uid&&tab==="messages"&&chatUser===target&&form.isConnected&&document.getElementById("sendmsg")===form;
 const controls=[input,button,fileInput,document.getElementById("send-chat-file"),document.getElementById("voice-record"),document.getElementById("voice-cancel"),document.getElementById("chat-light-photo")].filter(Boolean),previous=controls.map(c=>c.disabled);
 chatSendLocks.add(key);controls.forEach(c=>c.disabled=true);button.textContent=file?"Subiendo…":"Enviando…";if(status){status.removeAttribute("data-success");status.textContent="";}
 let draft=chatPendingSends.get(form);
 let committed=false,stage="preparación";
 try{
 if(!draft||draft.uid!==uid||draft.target!==target||draft.content!==content||draft.file!==file||(!draft.insertAttempted&&draft.light!==light)){
 stage="preparación de la fotografía";let payload=file;if((force||light)&&file){if(status)status.textContent=force?"Convirtiendo fotografía a JPG…":"Preparando foto ligera…";try{payload=await gysteOptimizePhoto(file,light?"light":"original",force);}catch{if(active()&&status)status.textContent=force?"Este teléfono no pudo convertir la foto. Guárdala como JPG o PNG y vuelve a seleccionarla. No se ha enviado.":"No se pudo reducir la foto. Desmarca Foto ligera para enviar el original.";return;}if(!active())return;if(!payload.size||payload.size>MAX_POST_BYTES){if(status)status.textContent="La foto preparada supera el límite de 50 MB.";return;}}
 if(payload&&chatFileType(payload).startsWith("video/")){stage="comprobación del vídeo";if(status)status.textContent="Comprobando vídeo en este teléfono…";const result=await probeLocalVideo(payload);if(!active())return;if(result==="unsupported"){if(status)status.textContent="Este teléfono no puede abrir el vídeo. Usa MP4 con H.264 y AAC. Conservamos tu selección.";return;}payload=await gysteOptimizeVideo(payload,gysteMediaMode(uid),active,p=>{if(active()&&status)status.textContent=p;});if(!active())return;}
 fileType=chatFileType(payload);
 const id=crypto.randomUUID(),ext=({"image/jpeg":"jpg","image/png":"png","image/webp":"webp","video/mp4":"mp4","video/webm":"webm","audio/webm":"webm","audio/mp4":"m4a","audio/ogg":"ogg","audio/mpeg":"mp3","audio/wav":"wav"})[fileType];
 draft={uid,target,content,file,payload,light,fileType,id,path:file?uid+"/"+id+"."+ext:null,uploaded:false,insertAttempted:false,transfer:{url:null}};
 chatPendingSends.set(form,draft);
 }
 fileType=draft.fileType;
 if(file&&(fileType.startsWith("image/")||fileType.startsWith("video/"))){
   stage="copia local y subida";
   const job={id:draft.id,uid,kind:"chat",bucket:CHAT_BUCKET,files:[draft.payload],transfers:[{path:draft.path,url:null}],members:[],created:Date.now(),row:{id:draft.id,sender_id:uid,recipient_id:target,content:content||(fileType.startsWith("video/")?"🎬 Vídeo":"📷 Fotografía"),media_path:draft.path,media_type:fileType}};
   if(status)status.textContent="Guardando copia local"+gysteMediaSavings([file],[draft.payload])+"…";
   await processPending(job,p=>{if(active()){if(status)status.textContent=p;button.textContent="Subiendo…";}},active);
   committed=true;
 }
 if(!committed&&draft.insertAttempted){committed=await checkSentMessage(uid,target,draft.id,draft.path,fileType||null);}
 if(!committed){
 if(!active())return;
 if(file&&!draft.uploaded){
 stage="subida del archivo";if(active()&&status)status.textContent="Subiendo archivo… No cierres esta conversación.";
 if(fileType.startsWith("image/")||fileType.startsWith("video/")){
  await uploadGysteMedia(uid,CHAT_BUCKET,draft.path,draft.payload,draft.transfer,active,p=>{if(status)status.textContent="Subiendo archivo · "+p+" %";button.textContent=p+" %";});
 }else{const {error}=await db.storage.from(CHAT_BUCKET).upload(draft.path,draft.payload,{upsert:false,contentType:fileType});if(error)throw error;}
 draft.uploaded=true;
 }
 if(!active())return;
 stage="registro del mensaje";button.textContent="Enviando…";if(active()&&status)status.textContent="Registrando mensaje…";draft.insertAttempted=true;
 try{
 const {error}=await db.from("gyste_messages").insert({id:draft.id,sender_id:uid,recipient_id:target,content:content||(fileType.startsWith("audio/")?"🎙 Mensaje de voz":fileType.startsWith("video/")?"🎬 Vídeo":"📷 Fotografía"),media_path:draft.path,media_type:fileType||null});
 if(error)throw error;
 stage="confirmación del mensaje";committed=await checkSentMessage(uid,target,draft.id,draft.path,fileType||null);
 if(!committed)throw Error("Mensaje no confirmado");
 }catch(error){if(me?.id===uid)committed=await checkSentMessage(uid,target,draft.id,draft.path,fileType||null);if(!committed)throw error;}
 }
 if(committed){chatPendingSends.delete(form);if(active()){input.value="";fileInput.value="";clearVoiceDraft();resetVoiceUI();const fs=document.getElementById("chatfile-status");if(fs)fs.textContent="";const fileSend=document.getElementById("send-chat-file");if(fileSend)fileSend.hidden=true;const lightOption=document.getElementById("chat-light-photo-option");if(lightOption)lightOption.hidden=true;clearChatFilePreview();if(status){status.dataset.success="true";status.textContent=file?"Archivo enviado y registrado.":"Mensaje enviado y registrado.";}try{await refreshChatMessages(target,true);}catch{}}}
 }catch(error){
 if(active())gysteFault("mensajes",error);
 if(active()&&status){status.removeAttribute("data-success");status.textContent=error?.code==="42501"?"No se pudo enviar. Comprueba que ambos os seguís y que el destinatario permite mensajes. Conservamos tu borrador.":"No se pudo completar la etapa de "+stage+". Si se guardó la copia, estará en Archivos pendientes. Si no aparece, conserva esta pantalla y vuelve a pulsar Enviar.";}
 // No eliminar archivos tras una respuesta incierta: podrían pertenecer a un mensaje ya registrado.
 }finally{chatSendLocks.delete(key);controls.forEach((c,i)=>c.disabled=previous[i]);button.textContent="Enviar";if(committed&&active())input.focus();}
}
async function start(){
const timingStart=performance.now();
try{
if(!window.supabase||typeof window.supabase.createClient!=="function"){
 gysteFault("inicio");
app.innerHTML='<section class="auth"><h1>Gyste</h1><p class="error">No se pudo cargar el servicio de conexión. Comprueba Internet y vuelve a intentarlo.</p><button class="primary full" id="retry">Reintentar</button></section>';
document.getElementById("retry").onclick=start;
return;
}
if(!db)db=window.supabase.createClient(URL_DB,KEY_DB,{
  auth:{
    persistSession:true,
    autoRefreshToken:true,
    detectSessionInUrl:true,
    storage:window.localStorage
  }
});
if(!authListener){
authListener=db.auth.onAuthStateChange((event,s)=>{
gysteFaultScope(s?.user?.id||null);session=s;
if(event==="PASSWORD_RECOVERY"){
  recoveryView();
  return;
}
if(!s){me=null;chatUser=null;tab="feed";sharedPostId=null;selectedSpaceId=null;homeFilter="all";authView();}
});
}
const result=await Promise.race([
db.auth.getSession(),
new Promise((_,reject)=>setTimeout(()=>reject(new Error("La conexión está tardando demasiado. Comprueba Internet y pulsa Reintentar.")),15000))
]);
const {data,error}=result;
if(error)throw error;
session=data.session;gysteFaultScope(session?.user?.id||null);
const recoveryLink=/(?:^|[&#])type=recovery(?:&|$)/i.test(window.location.hash);
if(recoveryLink&&session){recoveryView();}
else if(session)await boot();else authView();
if(session&&me)recordGysteTiming("startup",timingStart);
}catch(e){
gysteFault("inicio",e);
app.innerHTML=`<section class="auth"><h1>Gyste</h1><p class="error">${esc(e?.message||"No se pudo iniciar Gyste. Comprueba Internet.")}</p><button class="primary full" id="retry">Reintentar</button></section>`;
document.getElementById("retry").onclick=start;
}
}

// Renueva la vista del feed al volver a la app si los enlaces firmados están cerca de expirar.
document.addEventListener("visibilitychange",()=>{
if(document.visibilityState==="visible"&&session&&me&&tab==="feed"){
const expiring=[...mediaUrlCache.values()].some(x=>x.expiresAt<Date.now()+60000);
if(expiring){const state=navigationDraftState();const viewing=Boolean(document.fullscreenElement||document.querySelector("dialog[open],.media-overlay"))||Array.from(app.querySelectorAll("video,audio")).some(m=>!m.paused&&!m.ended);if(!state.busy&&!state.text&&!state.files&&!viewing)feedView();}
}
});

document.addEventListener("play",e=>{if(e.target instanceof HTMLMediaElement)document.querySelectorAll("video,audio").forEach(m=>{if(m!==e.target&&!m.paused)m.pause();});},true);
for(const event of ["play","playing","waiting","stalled","pause","ended","error","emptied","seeking"])document.addEventListener(event,observeVideoTiming,true);
document.addEventListener("visibilitychange",()=>{if(document.hidden)gysteMediaTimings=new WeakMap();else void refreshUnreadBadges();});
setInterval(()=>{if(!document.hidden)void refreshUnreadBadges();},60000);
window.addEventListener("pagehide",stopVoiceCapture);
window.addEventListener("error",e=>{if(e.target===window)gysteFault("programa");else if(e.target instanceof HTMLMediaElement&&app.contains(e.target))gysteFault("archivos");},true);
window.addEventListener("unhandledrejection",()=>gysteFault("programa"));
start();
// Register independently of authentication; no reload and no cached application data.
if(document.readyState==="complete")void registerGysteOffline();else window.addEventListener("load",()=>{void registerGysteOffline();},{once:true});
</script>
