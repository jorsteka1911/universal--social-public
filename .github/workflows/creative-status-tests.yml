name: Creative status tests
on:
  push:
    paths:
      - 'api/creative-status.js'
      - 'tests/creative-status.test.mjs'
      - '.github/workflows/creative-status-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/creative-status.test.mjs
